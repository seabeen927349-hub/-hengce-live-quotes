name: HENGCE Nextday N3 V6 Strong Wilson
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_n3_v6_strong_wilson.py'
      - '.github/workflows/hengce-nextday-n3-v6-strong-wilson.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded N3 V6 strong Wilson
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_n3_v6_strong_wilson.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/nextday_n3_v6_strong_wilson_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-n3-v6-strong-wilson
          path: |
            research/codex_full_reset_20261023/nextday_n3_v6_strong_wilson_result.json
            research/codex_full_reset_20261023/nextday_n3_events.jsonl
