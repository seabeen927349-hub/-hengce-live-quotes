name: HENGCE original EOD ingest
# Manual existing-vessel EOD refresh requested 2026-11-05; no workflow logic change.
# Existing HENGCE blood vessel. Research auxiliaries attach inside this same
# eod/YYYYMMDD path; no parallel collector, mother, universe, or model authority.

"on":
  workflow_dispatch:
    inputs:
      date:
        description: Target Taiwan market date YYYY-MM-DD; blank = Taipei today
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-original-eod-ingest.yml'
      - 'scripts/hengce_eod_broker_aux.py'
      - 'scripts/hengce_finmind_twse_common_snapshot_probe.py'
      - 'scripts/hengce_market_state_finmind_aux.py'
      - 'scripts/hengce_market_state_twse_only_aux.py'
      - 'hengce/market_state/HENGCE_MARKET_STATE_FINMIND_ENHANCEMENT_CONTRACT_v0_5_20261103.json'
  schedule:
    - cron: '0 15 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-original-eod-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Checkout original HENGCE vessel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install original-vessel runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl 'finmind-mcp[parquet]' numpy pandas pyarrow

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          set -euo pipefail
          MANUAL='${{ inputs.date }}'
          if [ -n "$MANUAL" ]; then
            D="$MANUAL"
          else
            D="$(TZ=Asia/Taipei date '+%F')"
          fi
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "compact=${D//-/}" >> "$GITHUB_OUTPUT"
          echo "HENGCE original vessel target=$D"

      - name: Run original HENGCE incremental ingest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_eod_incremental_ingest.py --mode ingest --date '${{ steps.target.outputs.date }}'

      - name: Capture Broker HHI inside the same original EOD vessel
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_eod_broker_aux.py \
            --mode capture \
            --date '${{ steps.target.outputs.date }}' \
            --eod-dir 'eod/${{ steps.target.outputs.compact }}'

      - name: Observe FinMind TWSE-only Market State context inside the same original EOD vessel
        id: finmind_market_state_shadow
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_market_state_finmind_aux.py \
            --date '${{ steps.target.outputs.date }}' \
            --eod-dir 'eod/${{ steps.target.outputs.compact }}'

      - name: Record fail-closed FinMind shadow runtime receipt without blocking core vessel
        if: steps.finmind_market_state_shadow.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          D='${{ steps.target.outputs.date }}'
          C='${{ steps.target.outputs.compact }}'
          OUTCOME='${{ steps.finmind_market_state_shadow.outcome }}'
          python - "$D" "$C" "$OUTCOME" <<'PY'
          import json,sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          d,c,outcome=sys.argv[1:]
          root=Path('eod')/c
          sp=root/'status.json'
          x=json.loads(sp.read_text(encoding='utf-8'))
          now=datetime.now(ZoneInfo('Asia/Taipei')).isoformat()
          definition='TWSE_CURRENT_LISTED_ORDINARY_EQUITIES_ONLY_EXCLUDES_TPEX_AND_EMERGING'
          r={
              'system':'HENGCE',
              'artifact':'MARKET_STATE_FINMIND_SHADOW_AUX_RECEIPT',
              'schema':'HENGCE_MARKET_STATE_FINMIND_SHADOW_AUX_V6',
              'target_date':d,
              'observed_at_taipei':now,
              'status':'SHADOW_BLOCKED_WORKFLOW_ERROR',
              'workflow_step_outcome':outcome,
              'contract':'hengce/market_state/HENGCE_MARKET_STATE_FINMIND_ENHANCEMENT_CONTRACT_v0_5_20261103.json',
              'primary_scope':'twse_all_listed_equities',
              'market_scope_definition':definition,
              'formal_market_state_classifier':'hengce/market_state/HENGCE_MARKET_STATE_CLASSIFIER_FREEZE_v1_0_20261102.json',
              'authority':'RESEARCH_SHADOW_ONLY_DESCRIPTIVE_NO_TRADING_AUTHORITY',
              'data_vessel':'EXISTING_HENGCE_ORIGINAL_EOD_VESSEL',
              'parallel_eod_tree':False,
              'second_mother':False,
              'parallel_universe':False,
              'raw_vendor_snapshot_persisted':False,
              'derived_aggregate_context_persisted':False,
              'formal_classifier_mutated':False,
              'forward_outcomes_used':False,
              'selection_authority':False,
              'escape_authority':False,
              'model_authority':False,
              'trading_authority':False,
              'capital_authority':False,
              'blocks_core_three_leg_or_mother':False,
              'usable_for_formal_market_state':False,
          }
          rp=root/'receipts'/'market_state_finmind_shadow.json'
          rp.parent.mkdir(parents=True,exist_ok=True)
          rp.write_text(json.dumps(r,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          x.update({
              'market_state_finmind_shadow_status':r['status'],
              'market_state_finmind_shadow_receipt':'receipts/market_state_finmind_shadow.json',
              'market_state_finmind_shadow_observed_at_taipei':now,
              'market_state_finmind_primary_scope':'twse_all_listed_equities',
              'market_state_finmind_market_scope_definition':definition,
              'market_state_finmind_shadow_blocks_core_three_leg_or_mother':False,
              'market_state_finmind_shadow_formal_classifier_mutated':False,
              'market_state_finmind_shadow_model_authority_created':False,
              'market_state_finmind_shadow_trading_authority_created':False,
          })
          for key in list(x):
              if key.startswith('market_state_finmind_all_taiwan') or key.startswith('market_state_finmind_tpex'):
                  x.pop(key,None)
          sp.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify original-vessel output only
        shell: bash
        run: |
          set -euo pipefail
          D='${{ steps.target.outputs.date }}'
          C='${{ steps.target.outputs.compact }}'
          test -f "eod/$C/status.json"
          test -f "eod/$C/receipts/market_state_finmind_shadow.json"
          python - "$D" "$C" <<'PY'
          import json,sys
          from pathlib import Path
          d,c=sys.argv[1:]
          root=Path('eod')/c
          x=json.loads((root/'status.json').read_text(encoding='utf-8'))
          assert x.get('target_date')==d, x
          assert x.get('artifact')=='EOD_ORIGINAL_VESSEL_INCREMENTAL_INGEST', x
          assert x.get('parallel_eod_tree') is False, x
          assert x.get('second_mother') is False, x
          assert x.get('parallel_universe') is False, x
          assert x.get('model_authority_created') is False, x
          assert x.get('broker_hhi_blocks_core_three_leg_or_mother') is False, x
          assert x.get('market_state_finmind_shadow_blocks_core_three_leg_or_mother') is False, x
          assert x.get('market_state_finmind_shadow_formal_classifier_mutated') is False, x
          assert x.get('market_state_finmind_shadow_model_authority_created') is False, x
          assert x.get('market_state_finmind_shadow_trading_authority_created') is False, x
          assert x.get('data_vessel_governance')=='ALL_NEW_DATA_ATTACH_TO_EXISTING_GOVERNED_HENGCE_VESSEL_NO_PARALLEL_COLLECTOR', x

          fr=json.loads((root/'receipts'/'market_state_finmind_shadow.json').read_text(encoding='utf-8'))
          assert fr.get('status') in {
              'OBSERVED_CONTEXT_ATTACHED','OBSERVED_CAPABILITY_ONLY',
              'SHADOW_BLOCKED_FAIL_CLOSED','SHADOW_BLOCKED_WORKFLOW_ERROR',
              'SKIP_NO_HISTORICAL_REALTIME_SNAPSHOT'
          }, fr
          assert fr.get('data_vessel')=='EXISTING_HENGCE_ORIGINAL_EOD_VESSEL', fr
          assert fr.get('parallel_eod_tree') is False, fr
          assert fr.get('second_mother') is False, fr
          assert fr.get('parallel_universe') is False, fr
          assert fr.get('raw_vendor_snapshot_persisted') is False, fr
          assert fr.get('formal_classifier_mutated') is False, fr
          assert fr.get('forward_outcomes_used') is False, fr
          assert fr.get('selection_authority') is False, fr
          assert fr.get('escape_authority') is False, fr
          assert fr.get('model_authority') is False, fr
          assert fr.get('trading_authority') is False, fr
          assert fr.get('capital_authority') is False, fr
          assert fr.get('blocks_core_three_leg_or_mother') is False, fr
          assert fr.get('usable_for_formal_market_state') is False, fr

          if fr.get('status')=='OBSERVED_CONTEXT_ATTACHED':
              ctx=json.loads((root/'market_state_finmind_context.json').read_text(encoding='utf-8'))
              assert ctx.get('artifact')=='MARKET_STATE_FINMIND_DERIVED_CONTEXT', ctx
              assert ctx.get('schema')=='HENGCE_MARKET_STATE_FINMIND_DERIVED_CONTEXT_V5', ctx
              assert ctx.get('target_date')==d, ctx
              assert ctx.get('primary_scope')=='twse_all_listed_equities', ctx
              assert ctx.get('market_scope_definition')=='TWSE_CURRENT_LISTED_ORDINARY_EQUITIES_ONLY_EXCLUDES_TPEX_AND_EMERGING', ctx
              assert ctx.get('data_vessel')=='EXISTING_HENGCE_ORIGINAL_EOD_VESSEL', ctx
              assert ctx.get('source_revision_class')=='FORWARD_COLLECTED_VENDOR_SNAPSHOT', ctx
              assert ctx.get('raw_vendor_snapshot_persisted') is False, ctx
              assert ctx.get('per_ticker_vendor_rows_persisted') is False, ctx
              assert ctx.get('forward_outcomes_used') is False, ctx
              assert ctx.get('formal_classifier_effect')=='NONE', ctx
              assert ctx.get('selection_effect')=='NONE', ctx
              assert ctx.get('escape_effect')=='NONE', ctx
              assert ctx.get('trading_effect')=='NONE', ctx
              assert ctx.get('capital_effect')=='NONE', ctx
              scopes=ctx.get('scopes') or {}
              assert set(scopes)=={'twse_all_listed_equities','hengce_electronics100_diagnostic'}, ctx
              membership=ctx.get('twse_membership') or {}
              assert membership.get('membership_authority')=='OFFICIAL_TWSE_CURRENT_MASTER', membership
              assert membership.get('market_scope_rule')=='twse_only_excludes_tpex_and_emerging', membership
              assert membership.get('twse_count',0)>900, membership
              assert membership.get('tpex_included') is False, membership
              assert membership.get('emerging_included') is False, membership
              assert scopes['twse_all_listed_equities'].get('snapshot_presence_ratio',0)>0.98, ctx
              assert scopes['hengce_electronics100_diagnostic'].get('requested_code_count')==100, ctx
              assert fr.get('derived_context_sha256')==ctx.get('payload_sha256'), (fr,ctx)

          print(json.dumps({k:x.get(k) for k in (
              'target_date','price_status','price_rows','institutional_status','institutional_rows',
              'margin_status','margin_rows','broker_hhi_status','broker_hhi_rows',
              'market_state_finmind_shadow_status','market_state_finmind_primary_scope',
              'market_state_finmind_twse_equity_membership_count',
              'market_state_finmind_twse_snapshot_present_count',
              'market_state_finmind_twse_current_date_count',
              'market_state_finmind_context_status','mother_status','three_leg_complete','downstream_ready'
          )},ensure_ascii=False))
          PY

      - name: Delete transient licensed Broker objects
        if: always()
        run: rm -rf /tmp/hengce-original-vessel-broker-*

      - name: Commit original eod tree
        shell: bash
        run: |
          set -euo pipefail
          C='${{ steps.target.outputs.compact }}'
          git config user.name 'hengce-original-vessel-bot'
          git config user.email 'hengce-original-vessel-bot@users.noreply.github.com'
          git add "eod/$C"
          if git diff --cached --quiet; then
            echo 'No original-vessel changes.'
          else
            git commit -m "HENGCE original EOD ingest ${{ steps.target.outputs.date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload exact original-vessel EOD bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HENGCE_ORIGINAL_EOD_${{ steps.target.outputs.compact }}
          path: eod/${{ steps.target.outputs.compact }}/
          if-no-files-found: error
          retention-days: 7
