name: HENGCE Nextday O3 Robustness Audit
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_o3_robustness_audit.py'
      - '.github/workflows/hengce-nextday-o3-robustness-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O3 robustness audit
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_o3_robustness_audit.py
      - name: Print result
        if: always()
        run: test -f research/codex_full_reset_20261023/nextday_o3_robustness_audit_result.json && cat research/codex_full_reset_20261023/nextday_o3_robustness_audit_result.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-o3-robustness-audit
          path: research/codex_full_reset_20261023/nextday_o3_robustness_audit_result.json
          if-no-files-found: ignore
