name: HENGCE Ranking X11 Tail Confidence Drawdown Gate
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x11_tail_confidence_drawdown_gate.py'
      - '.github/workflows/hengce-ranking-x11-tail-confidence-drawdown-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X11 tail confidence drawdown gate
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x11_tail_confidence_drawdown_gate.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x11_tail_confidence_drawdown_gate_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x11-tail-confidence-drawdown-gate
          path: |
            research/codex_full_reset_20261023/ranking_x11_tail_confidence_drawdown_gate_result.json
            research/codex_full_reset_20261023/ranking_x11_events.jsonl
