name: HENGCE Ranking V38 V36 Continuous Budget
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v38_v36_continuous_budget.py'
      - '.github/workflows/hengce-ranking-v38-v36-continuous-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V38 V36 continuous budget
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v38_v36_continuous_budget.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v38_v36_continuous_budget_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v38-v36-continuous-budget
          path: |
            research/codex_full_reset_20261023/ranking_v38_v36_continuous_budget_result.json
            research/codex_full_reset_20261023/ranking_v38_events.jsonl
