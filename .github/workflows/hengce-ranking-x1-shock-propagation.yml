name: HENGCE Ranking X1 Shock Propagation
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x1_shock_propagation.py'
      - '.github/workflows/hengce-ranking-x1-shock-propagation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X1 shock propagation
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x1_shock_propagation.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x1_shock_propagation_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x1-shock-propagation
          path: |
            research/codex_full_reset_20261023/ranking_x1_shock_propagation_result.json
            research/codex_full_reset_20261023/ranking_x1_events.jsonl
