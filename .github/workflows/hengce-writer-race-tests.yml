name: HENGCE Writer Race Safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-races:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Assert current Q017 retirement and monitoring contract
        run: python -B tests/engineering/test_current_retirement_monitoring.py
      - name: Audit pinned historical writer and health dependencies (isolated)
        run: python -B tests/engineering/run_retired_suite.py --suite writer
      - name: Exercise synthetic local Git writer races
        run: python -B tests/engineering/test_writer_races.py
