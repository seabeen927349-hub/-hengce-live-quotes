name: HENGCE G1 2025-2026 TDCC raw holder counts full extract
"on":
  push:
    branches: [research/behavior-atlas-sequence-g2-retail-v2-20261107]
    paths:
      - .github/workflows/hengce-g1-tdcc-full-53week-people.yml
      - research/behavior_atlas_sequence_g2_retail_v2_20261107/g1_extract_official_53week_retail_counts.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        shard: ["2025A","2025B","2026A","2026B","2026C","2026D"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install beautifulsoup4 lxml
      - name: Extract true 15-grade TDCC holder counts without deriving from large-holder remainder
        run: |
          python research/behavior_atlas_sequence_g2_retail_v2_20261107/g1_extract_official_53week_retail_counts.py --shard ${{ matrix.shard }}
      - name: Archive source SHA receipts and per-security grade counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "HENGCE_G1_15GRADE_PEOPLE_${{ matrix.shard }}"
          path: /tmp/hengce_tdcc_retail_g1/
          retention-days: 30
          if-no-files-found: warn
