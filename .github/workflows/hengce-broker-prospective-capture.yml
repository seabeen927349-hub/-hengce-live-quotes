name: HENGCE Broker Prospective First-Observed Capture

"on":
  workflow_dispatch:
  schedule:
    - cron: '45 10 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-broker-prospective-first-observed-capture
  cancel-in-progress: false

env:
  RESEARCH_BRANCH: research/broker-prospective-validation-20261103

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Checkout isolated prospective research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-capture dependencies
        run: python -m pip install --disable-pip-version-check 'finmind-mcp[parquet]' numpy pandas pyarrow

      - name: Syntax check prospective capture
        run: python -m py_compile research/broker_prospective_20261103/capture_broker_snapshot.py

      - name: Capture immutable same-day source vintage and derived HHI
        run: python research/broker_prospective_20261103/capture_broker_snapshot.py

      - name: Delete transient licensed Broker objects
        if: always()
        run: rm -rf /tmp/hengce-broker-prospective-*

      - name: Commit first-observed derived capture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-broker-prospective-bot'
          git config user.email 'hengce-broker-prospective-bot@users.noreply.github.com'
          git add research/broker_prospective_20261103/captures/
          if git diff --cached --quiet; then
            echo 'No new immutable capture to commit.'
            exit 0
          fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "research(broker): first-observed prospective capture ${TS}"
          if ! git push origin HEAD:${RESEARCH_BRANCH}; then
            git pull --rebase origin ${RESEARCH_BRANCH}
            git push origin HEAD:${RESEARCH_BRANCH}
          fi
