name: HENGCE Ranking X8 Temporal Consensus
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x8_temporal_consensus.py'
      - '.github/workflows/hengce-ranking-x8-temporal-consensus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X8 temporal consensus
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x8_temporal_consensus.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x8_temporal_consensus_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x8-temporal-consensus
          path: |
            research/codex_full_reset_20261023/ranking_x8_temporal_consensus_result.json
            research/codex_full_reset_20261023/ranking_x8_events.jsonl
