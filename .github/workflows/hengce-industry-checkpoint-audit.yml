name: HENGCE industry checkpoint audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/selection-challenge-20261102
    paths:
      - '.github/workflows/hengce-industry-checkpoint-audit.yml'

permissions:
  contents: read

concurrency:
  group: hengce-industry-checkpoint-audit
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - name: Stopped by research direction
        run: echo 'INDUSTRY_CHECKPOINT_AUDIT_STOPPED_BY_USER_20261103'
