name: HENGCE original vessel promotion bundle 20261102

on:
  push:
    branches:
      - repair/original-vessel-promotion-20261103
    paths:
      - '.github/workflows/hengce-original-vessel-promotion-bundle-20261102.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-original-vessel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package immutable original-vessel shards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, csv, gzip, hashlib, json
          from pathlib import Path

          root = Path('eod/20261102')
          status = json.loads((root/'status.json').read_text(encoding='utf-8'))
          assert status['target_date'] == '2026-11-02'
          assert status['three_leg_complete'] is True
          expected = {
              'price': int(status['price_rows']),
              'institutional': int(status['institutional_rows']),
              'margin': int(status['margin_rows']),
          }

          bundle = {
              'system': 'HENGCE',
              'artifact': 'ORIGINAL_VESSEL_CANONICAL_PROMOTION_INPUT_BUNDLE',
              'target_date': '2026-11-02',
              'source_artifact': 'EOD_ORIGINAL_VESSEL_INCREMENTAL_INGEST',
              'formal_source': True,
              'second_mother': False,
              'model_or_schema_mutated': False,
              'legs': {},
          }
          manifest = {
              'system': 'HENGCE',
              'artifact': 'ORIGINAL_VESSEL_PROMOTION_BUNDLE_MANIFEST',
              'target_date': '2026-11-02',
              'source_status_sha256': hashlib.sha256((root/'status.json').read_bytes()).hexdigest(),
              'legs': {},
          }

          for leg in ('price','institutional','margin'):
              files = sorted(root.glob(f'{leg}_*.csv'), key=lambda p: int(p.stem.split('_')[-1]))
              assert files, leg
              rows=[]
              shard_hashes={}
              header=None
              for p in files:
                  raw=p.read_bytes()
                  shard_hashes[p.name]=hashlib.sha256(raw).hexdigest()
                  with p.open('r', encoding='utf-8-sig', newline='') as f:
                      r=csv.DictReader(f)
                      if header is None: header=r.fieldnames
                      else: assert r.fieldnames == header, (leg,p.name)
                      rows.extend(list(r))
              assert len(rows) == expected[leg], (leg,len(rows),expected[leg])
              keys=[(r['Date'],r['Ticker']) for r in rows]
              assert len(keys)==len(set(keys)), f'duplicate keys {leg}'
              assert all(r['Date']=='2026-11-02' for r in rows), leg
              bundle['legs'][leg]={'header':header,'rows':rows}
              manifest['legs'][leg]={
                  'rows':len(rows),
                  'shards':len(files),
                  'shard_sha256':shard_hashes,
              }

          payload=json.dumps(bundle,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          gz=gzip.compress(payload,compresslevel=9,mtime=0)
          b64=base64.b64encode(gz).decode('ascii')
          wrapped='\n'.join(b64[i:i+4096] for i in range(0,len(b64),4096))+'\n'
          out=root/'promotion_bundle_20261102.json.gz.b64'
          out.write_text(wrapped,encoding='ascii')
          manifest['uncompressed_json_sha256']=hashlib.sha256(payload).hexdigest()
          manifest['gzip_sha256']=hashlib.sha256(gz).hexdigest()
          manifest['bundle_b64_sha256']=hashlib.sha256(b64.encode('ascii')).hexdigest()
          manifest['bundle_b64_bytes']=len(b64)
          manifest['bundle_b64_lines']=(len(b64)+4095)//4096
          (root/'promotion_bundle_20261102_manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'expected':expected,
              'bundle_b64_bytes':len(b64),
              'bundle_b64_lines':manifest['bundle_b64_lines'],
              'gzip_sha256':manifest['gzip_sha256']
          },ensure_ascii=False))
          PY

      - name: Commit verification bundle to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-repair-bot'
          git config user.email 'hengce-repair-bot@users.noreply.github.com'
          git add eod/20261102/promotion_bundle_20261102.json.gz.b64 eod/20261102/promotion_bundle_20261102_manifest.json
          git commit -m 'repair: package 2026-11-02 original-vessel promotion input'
          git push origin HEAD:repair/original-vessel-promotion-20261103
