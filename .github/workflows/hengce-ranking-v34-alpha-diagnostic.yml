name: HENGCE Ranking V34 Alpha Diagnostic
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v34_alpha_diagnostic.py'
      - '.github/workflows/hengce-ranking-v34-alpha-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V34 alpha diagnostic
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v34_alpha_diagnostic.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v34_alpha_diagnostic_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v34-alpha-diagnostic
          path: research/codex_full_reset_20261023/ranking_v34_alpha_diagnostic_result.json
