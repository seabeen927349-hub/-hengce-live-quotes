name: HENGCE H3 Nonoverlap Robustness Audit
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/h3_nonoverlap_robustness_audit.py'
      - '.github/workflows/hengce-h3-nonoverlap-robustness-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fixed H3 non-overlap robustness audit
        run: PYTHONPATH=. python research/codex_full_reset_20261023/h3_nonoverlap_robustness_audit.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-h3-nonoverlap-robustness-audit
          path: research/codex_full_reset_20261023/h3_nonoverlap_robustness_audit_result.json
# trigger: formal h3 robustness audit 2026-10-25
