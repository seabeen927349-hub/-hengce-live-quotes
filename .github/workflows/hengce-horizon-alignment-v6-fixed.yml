name: HENGCE Horizon Alignment V6 Fixed
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/horizon_alignment_v6_fixed.py'
      - '.github/workflows/hengce-horizon-alignment-v6-fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fixed V6 horizon alignment
        run: PYTHONPATH=. python research/codex_full_reset_20261023/horizon_alignment_v6_fixed.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-horizon-alignment-v6-fixed
          path: research/codex_full_reset_20261023/horizon_alignment_v6_fixed_result.json
# trigger: formal horizon alignment run 2026-10-25
