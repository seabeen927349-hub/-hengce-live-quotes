name: HENGCE intraday handoff runner test

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/RUN_INTRADAY_ACTION_BOARD.sh'
      - 'scripts/hengce_intraday_action_board.py'
      - 'scripts/hengce_unified_candidate_adapter.py'
      - 'scripts/hengce_unified*.py'
      - 'scripts/hengce_q017_position_watch.py'
      - 'scripts/hengce_q017_structure_exit.py'
      - 'scripts/hengce_alert_ledger.py'
      - '.github/workflows/hengce-intraday-handoff-runner-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated HENGCE fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/hengce-intraday-runner-test
          rm -rf "$ROOT"
          mkdir -p "$ROOT/work" "$ROOT/work_output/formal/production" "$ROOT/work_output/context" "$ROOT/fixture"
          cp scripts/hengce_intraday_action_board.py "$ROOT/work/"
          cp scripts/hengce_unified_candidate_adapter.py "$ROOT/work/"
          cp scripts/hengce_unified*.py "$ROOT/work/"
          cp scripts/hengce_q017_position_watch.py "$ROOT/work/"
          cp scripts/hengce_q017_structure_exit.py "$ROOT/work/"
          cp scripts/hengce_alert_ledger.py "$ROOT/work/"
          cp scripts/RUN_INTRADAY_ACTION_BOARD.sh "$ROOT/"
          chmod +x "$ROOT/RUN_INTRADAY_ACTION_BOARD.sh"
          cat > "$ROOT/work_output/formal/production/v2_scan.json" <<'JSON'
          {
            "formal_scan_allowed": true,
            "run_id": "FORMAL_BASE_TEST",
            "rows": [
              {"Ticker":"AAA","FormalEntryTrigger":true,"ActivationState":"READY","BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90},
              {"Ticker":"BBB","FormalEntryTrigger":false,"ActivationState":"EMPTY_SHADOW","BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90},
              {"Ticker":"CCC","FormalEntryTrigger":true,"ActivationState":"READY","PositionHeld":true,"BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90}
            ]
          }
          JSON
          cat > "$ROOT/work_output/context/HENGCE_MARKET_CONTEXT.json" <<'JSON'
          {"MarketContextState":"CAUTION","NewCapitalPolicy":"PROBE_ONLY"}
          JSON
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Taipei'))
          root=Path(sys.argv[1])
          for rel in ['work_output/formal/production/v2_scan.json','work_output/context/HENGCE_MARKET_CONTEXT.json']:
              p=root/rel;x=json.loads(p.read_text());x.update(trade_date=now.date().isoformat(),generated_at=now.isoformat());p.write_text(json.dumps(x))
          PY
          NOW="$(TZ=Asia/Taipei date --iso-8601=seconds)"
          DATE="$(TZ=Asia/Taipei date +%F)"
          cat > "$ROOT/fixture/live.json" <<JSON
          {
            "snapshot_id":"LIVE_TEST",
            "generated_at_taipei":"$NOW",
            "stale_count":0,
            "data":[
              {"symbol":"AAA","price":103,"high":104,"low":99,"avg_price":102,"quote_date":"$DATE"},
              {"symbol":"BBB","price":104,"high":104,"low":99,"avg_price":102,"quote_date":"$DATE"},
              {"symbol":"CCC","price":89,"high":101,"low":88,"avg_price":95,"quote_date":"$DATE"}
            ]
          }
          JSON

      - name: Formal handoff must PASS
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/hengce-intraday-runner-test
          cd "$ROOT"
          HENGCE_ROOT="$ROOT" HENGCE_LIVE_JSON="$ROOT/fixture/live.json" bash ./RUN_INTRADAY_ACTION_BOARD.sh
          python3 - <<'PY'
          import json
          p='/tmp/hengce-intraday-runner-test/work_output/intraday_action_board/HENGCE_INTRADAY_ACTION_BOARD.json'
          r='/tmp/hengce-intraday-runner-test/work_output/intraday_action_board/HENGCE_INTRADAY_BINDING_RECEIPT.json'
          u='/tmp/hengce-intraday-runner-test/work_output/intraday_action_board/HENGCE_UNIFIED_CANDIDATE_BASE.json'
          x=json.load(open(p)); rec=json.load(open(r)); ub=json.load(open(u))
          assert x['ActionLayer']=='INTRADAY_ACTION_BOARD'
          assert x['binding_status']=='PASS'
          assert x['system']=='HENGCE'
          assert x['module']=='HENGCE_UNIFIED_INTRADAY_ACTION_BOARD'
          assert rec['binding_status']=='PASS'
          assert rec['score_fusion'] is False
          assert ub['q017_contract_status']=='NOT_PROVIDED'
          assert ub['source_provenance_counts']=={'LEGACY':3,'Q017':0,'BOTH':0}
          m={z['Ticker']:z for z in x['rows']}
          assert m['AAA']['FinalAction']=='REVIEW_PROBE'
          assert m['AAA']['SourceProvenance']=='LEGACY'
          assert m['BBB']['FormalEntryTrigger'] is False
          assert m['BBB']['FinalAction']=='ABSTAIN'
          assert m['CCC']['FinalAction']=='EXIT_ALL'
          print('FORMAL_UNIFIED_HANDOFF_PASS')
          PY

      - name: Missing context must fail closed
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/hengce-intraday-no-context
          rm -rf "$ROOT"
          mkdir -p "$ROOT/work" "$ROOT/work_output/formal/production" "$ROOT/fixture"
          cp scripts/hengce_intraday_action_board.py "$ROOT/work/"
          cp scripts/hengce_unified_candidate_adapter.py "$ROOT/work/"
          cp scripts/hengce_unified*.py "$ROOT/work/"
          cp scripts/hengce_q017_position_watch.py "$ROOT/work/"
          cp scripts/hengce_q017_structure_exit.py "$ROOT/work/"
          cp scripts/hengce_alert_ledger.py "$ROOT/work/"
          cp scripts/RUN_INTRADAY_ACTION_BOARD.sh "$ROOT/"
          chmod +x "$ROOT/RUN_INTRADAY_ACTION_BOARD.sh"
          cp /tmp/hengce-intraday-runner-test/work_output/formal/production/v2_scan.json "$ROOT/work_output/formal/production/v2_scan.json"
          cp /tmp/hengce-intraday-runner-test/fixture/live.json "$ROOT/fixture/live.json"
          set +e
          HENGCE_ROOT="$ROOT" HENGCE_LIVE_JSON="$ROOT/fixture/live.json" bash "$ROOT/RUN_INTRADAY_ACTION_BOARD.sh"
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          p='/tmp/hengce-intraday-no-context/work_output/intraday_action_board/HENGCE_INTRADAY_BINDING_RECEIPT.json'
          x=json.load(open(p))
          assert x['binding_status']=='FAIL_CLOSED'
          assert x['reason']=='MARKET_CONTEXT_NOT_FOUND'
          print('MISSING_CONTEXT_FAIL_CLOSED_PASS')
          PY

      - name: Disallowed formal base must fail closed
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/hengce-intraday-disallowed
          rm -rf "$ROOT"
          mkdir -p "$ROOT/work" "$ROOT/work_output/formal/production" "$ROOT/work_output/context" "$ROOT/fixture"
          cp scripts/hengce_intraday_action_board.py "$ROOT/work/"
          cp scripts/hengce_unified_candidate_adapter.py "$ROOT/work/"
          cp scripts/hengce_unified*.py "$ROOT/work/"
          cp scripts/hengce_q017_position_watch.py "$ROOT/work/"
          cp scripts/hengce_q017_structure_exit.py "$ROOT/work/"
          cp scripts/hengce_alert_ledger.py "$ROOT/work/"
          cp scripts/RUN_INTRADAY_ACTION_BOARD.sh "$ROOT/"
          chmod +x "$ROOT/RUN_INTRADAY_ACTION_BOARD.sh"
          printf '{"formal_scan_allowed":false,"rows":[]}' > "$ROOT/work_output/formal/production/v2_scan.json"
          printf '{"MarketContextState":"NORMAL","NewCapitalPolicy":"NORMAL"}' > "$ROOT/work_output/context/HENGCE_MARKET_CONTEXT.json"
          cp /tmp/hengce-intraday-runner-test/fixture/live.json "$ROOT/fixture/live.json"
          set +e
          HENGCE_ROOT="$ROOT" HENGCE_LIVE_JSON="$ROOT/fixture/live.json" bash "$ROOT/RUN_INTRADAY_ACTION_BOARD.sh"
          rc=$?
          set -e
          test "$rc" -eq 2
          echo FORMAL_BASE_FAIL_CLOSED_PASS
