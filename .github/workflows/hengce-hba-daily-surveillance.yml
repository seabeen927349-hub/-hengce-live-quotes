name: HENGCE HBA Daily Surveillance Research Sidecar
on:
  # Run the SAME existing HBA research workflow when its code is merged to main.
  # Generated reports do not match these paths and cannot trigger a write loop.
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_hba_daily_surveillance.py'
      - 'scripts/hengce_hba_context_bridge_v1.py'
      - 'tests/hba_surveillance/**'
      - '.github/workflows/hengce-hba-daily-surveillance.yml'
  pull_request:
    paths:
      - 'governance/HENGCE_LONGITUDINAL_CAPITAL_CYCLE_HARD_GATE_v1_20261109.*'
      - 'governance/HENGCE_RESEARCH_LITERATURE_FIRST_CONSTITUTION_v1.md'
      - 'scripts/hengce_hba_daily_surveillance.py'
      - 'scripts/hengce_hba_context_bridge_v1.py'
      - 'tests/hba_surveillance/**'
      - '.github/workflows/hengce-hba-daily-surveillance.yml'
  schedule:
    # Asia/Taipei Mon–Fri 08:38 and 08:53 (retries after governed SOX/VIX producer)
    - cron: '38 0 * * 1-5'
    - cron: '53 0 * * 1-5'
    # Asia/Taipei Mon–Fri 23:35 and 23:55, after usual governed EOD completion
    - cron: '35 15 * * 1-5'
    - cron: '55 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hengce-hba-surveillance-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (fail closed)
        run: python -m unittest discover -s tests/hba_surveillance -p 'test_*.py' -v
      - name: Scan existing governed vessels only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TZ=Asia/Taipei python scripts/hengce_hba_daily_surveillance.py --root . --out research/hba_surveillance/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/hba_surveillance/latest.json').read_text())
          assert d['not_an_order'] is True and d['no_formula_profit_claim'] is True
          assert d['data_gate'] != 'BLOCKED', 'FAIL_CLOSED: no fresh EOD'
          PY
      - name: Integrate existing market environment and long-term gross flow (read-only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # This cache is an optional already-verified derivative of the nine-year mother.
          # Do not rebuild or download historical data inside the scheduled job.
          SUMMARY="research/hba_surveillance/data/HENGCE_LIFELONG_GROSS_SUMMARY.csv"
          if [ -f "$SUMMARY" ]; then
            python scripts/hengce_hba_context_bridge_v1.py \
              --root . --hba-input research/hba_surveillance/latest.json \
              --mother-summary "$SUMMARY" \
              --out research/hba_surveillance/integrated_latest.json
          else
            python scripts/hengce_hba_context_bridge_v1.py \
              --root . --hba-input research/hba_surveillance/latest.json \
              --out research/hba_surveillance/integrated_latest.json
          fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/hba_surveillance')
          p=root/'integrated_latest.json'
          raw=p.read_bytes(); d=json.loads(raw)
          assert d['authority']['trade'] is False and d['authority']['new_selection'] is False
          assert d['readiness'] in ('RESEARCH_READY','EOD_READY_LONG_TERM_MISSING','BLOCKED')
          sha=hashlib.sha256(raw).hexdigest()
          history=root/'integrated_history'/f"{d['target_tw_date'].replace('-','')}_{sha[:16]}.json"
          history.parent.mkdir(parents=True,exist_ok=True)
          if history.exists(): assert history.read_bytes()==raw
          else: history.write_bytes(raw)
          (root/'last_integrated_history_path.txt').write_text(str(history)+'\n')
          print('HBA_INTEGRATED_CONTEXT:',d['readiness'],history)
          PY
      - name: Append immutable daily research receipt and publish latest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/hba_surveillance')
          p=root/'latest.json'; raw=p.read_bytes(); d=json.loads(raw)
          sha=hashlib.sha256(raw).hexdigest()
          h=root/'history'/f"{d['target_tw_date'].replace('-','')}_{sha[:16]}.json"
          h.parent.mkdir(parents=True,exist_ok=True)
          if h.exists(): assert h.read_bytes()==raw
          else:h.write_bytes(raw)
          (root/'last_history_path.txt').write_text(str(h)+'\n')
          print('HBA_SURVEILLANCE_SHA256',sha,'ARCHIVE',h)
          PY
          git config user.name 'hengce-hba-surveillance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/hba_surveillance/latest.json research/hba_surveillance/latest.md "$(cat research/hba_surveillance/last_history_path.txt)"
          git add research/hba_surveillance/integrated_latest.json research/hba_surveillance/integrated_latest.md "$(cat research/hba_surveillance/last_integrated_history_path.txt)"
          git diff --cached --quiet && exit 0
          git commit -m 'research(sidecar): daily HBA surveillance with PIT macro and capital evidence'
          # Race protection: guarded publisher handles immutable write paths.
          git restore --worktree -- research/hba_surveillance/last_history_path.txt || true
          python scripts/hengce_publish.py --profile conservative-all --report-dir "${RUNNER_TEMP}/hengce-hba-publication"
      - name: Upload run receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hengce-hba-daily-surveillance
          path: |
            research/hba_surveillance/latest.json
            research/hba_surveillance/latest.md
            research/hba_surveillance/integrated_latest.json
            research/hba_surveillance/integrated_latest.md
            ${{ runner.temp }}/hengce-hba-publication
          if-no-files-found: ignore
          retention-days: 14