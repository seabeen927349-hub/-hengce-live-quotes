name: HENGCE HBA Daily Surveillance Research Sidecar
on:
  # Run the SAME existing HBA research workflow when its code is merged to main.
  # Generated reports do not match these paths and cannot trigger a write loop.
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_hba_daily_surveillance.py'
      - 'scripts/hengce_taifex_taiwan_vix_v1.py'
      - 'scripts/hengce_hba_context_bridge_v1.py'
      - 'scripts/hengce_hba_decision_report.py'
      - 'research/hba_surveillance/data/HENGCE_LIFELONG_GROSS_SUMMARY.csv'
      - 'tests/hba_surveillance/**'
      # A new verified original Mother receipt is the real EOD-ready event.
      # Reuse this HBA scan; never start a new collector or wait for the next
      # scheduled slot after the upstream canonical bridge is complete.
      - 'eod/**/receipts/mother.json'
      - '.github/workflows/hengce-hba-daily-surveillance.yml'
  pull_request:
    paths:
      - 'scripts/hengce_hba_decision_report.py'
      - 'governance/HENGCE_LONGITUDINAL_CAPITAL_CYCLE_HARD_GATE_v1_20261109.*'
      - 'governance/HENGCE_RESEARCH_LITERATURE_FIRST_CONSTITUTION_v1.md'
      - 'scripts/hengce_hba_daily_surveillance.py'
      - 'scripts/hengce_taifex_taiwan_vix_v1.py'
      - 'scripts/hengce_hba_context_bridge_v1.py'
      - 'research/hba_surveillance/data/HENGCE_LIFELONG_GROSS_SUMMARY.csv'
      - 'tests/hba_surveillance/**'
      - '.github/workflows/hengce-hba-daily-surveillance.yml'
  schedule:
    # Asia/Taipei Mon–Fri 08:38 and 08:53 (retries after governed SOX/VIX producer)
    - cron: '38 0 * * 1-5'
    - cron: '53 0 * * 1-5'
    # Asia/Taipei Mon–Fri 23:35 and 23:55, after usual governed EOD completion
    - cron: '35 15 * * 1-5'
    - cron: '55 15 * * 1-5'
  workflow_run:
    # Reuse the SAME original EOD producer's successful completion; do not start a new collector.
    # Reuse existing successfully published monitored sources to refresh HBA.
    # No new collectors or recursive FinMind wake-up are introduced.
    workflows: ['HENGCE original EOD ingest','HENGCE Governed SOX VIX Premarket EOD' ,'HENGCE Escape TWSE Common FinMind Shadow','HENGCE TAIFEX Taiwan VIX Daily Source']
    types: [completed]
  # 2026-11-09: on-demand refresh after canonical 2026-11-09 mother receipt PASS; unchanged scan logic.
  # 2026-11-17: one-time existing HBA refresh after verified 2026-11-16 Mother receipt mirror; scan code unchanged.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hengce-hba-surveillance-research
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'schedule' || (github.event.workflow_run.name == 'HENGCE TAIFEX Taiwan VIX Daily Source' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.event.workflow_run.name == 'HENGCE Escape TWSE Common FinMind Shadow' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (fail closed)
        run: python -m unittest discover -s tests/hba_surveillance -p 'test_*.py' -v
      - name: Scan existing governed vessels only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TZ=Asia/Taipei python scripts/hengce_hba_daily_surveillance.py --root . --out research/hba_surveillance/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/hba_surveillance/latest.json').read_text())
          assert d['not_an_order'] is True and d['no_formula_profit_claim'] is True
          assert d['data_gate'] != 'BLOCKED', 'FAIL_CLOSED: no fresh EOD'
          PY
      - name: Integrate existing market environment and long-term gross flow (read-only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # This cache is an optional already-verified derivative of the nine-year mother.
          # Do not rebuild or download historical data inside the scheduled job.
          SUMMARY="research/hba_surveillance/data/HENGCE_LIFELONG_GROSS_SUMMARY.csv"
          if [ -f "$SUMMARY" ]; then
            python scripts/hengce_hba_context_bridge_v1.py \
              --root . --hba-input research/hba_surveillance/latest.json \
              --mother-summary "$SUMMARY" \
              --out research/hba_surveillance/integrated_latest.json
          else
            python scripts/hengce_hba_context_bridge_v1.py \
              --root . --hba-input research/hba_surveillance/latest.json \
              --out research/hba_surveillance/integrated_latest.json
          fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/hba_surveillance')
          p=root/'integrated_latest.json'
          raw=p.read_bytes(); d=json.loads(raw)
          assert d['authority']['trade'] is False and d['authority']['new_selection'] is False
          assert d['readiness'] in ('RESEARCH_READY','EOD_READY_LONG_TERM_MISSING','BLOCKED')
          sha=hashlib.sha256(raw).hexdigest()
          history=root/'integrated_history'/f"{d['target_tw_date'].replace('-','')}_{sha[:16]}.json"
          history.parent.mkdir(parents=True,exist_ok=True)
          if history.exists(): assert history.read_bytes()==raw
          else: history.write_bytes(raw)
          (root/'last_integrated_history_path.txt').write_text(str(history)+'\n')
          print('HBA_INTEGRATED_CONTEXT:',d['readiness'],history)
          PY
      - name: Produce governed HBA human-decision report (research only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_hba_decision_report.py \
            --root . \
            --original research/hba_surveillance/latest.json \
            --integrated research/hba_surveillance/integrated_latest.json \
            --out research/hba_surveillance/decision_latest.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('research/hba_surveillance')
          file=root/'decision_latest.json'
          raw=file.read_bytes()
          x=json.loads(raw)
          assert x['status']=='RESEARCH_ADVISORY_READY'
          assert x['authority']['active_selection_strategy_count']==0
          assert x['authority']['formal_selection'] is False
          assert x['authority']['trading'] is False
          assert x['authority']['broker_execution'] is False
          assert x['authority']['capital_twd']==0
          assert x['not_live_quotes'] is True
          assert x['historical_alpha_validated'] is False
          assert x['research_summary']['market_covered']==len(x['full_market_observations'])
          assert len(raw)<950000, 'GitHub file read limit threatened'
          sha=hashlib.sha256(raw).hexdigest()
          history=root/'decision_history'/f"{x['target_tw_date'].replace('-','')}_{sha[:16]}.json"
          history.parent.mkdir(parents=True,exist_ok=True)
          if history.exists():assert history.read_bytes()==raw
          else:history.write_bytes(raw)
          (root/'last_decision_history_path.txt').write_text(str(history)+'\n')
          print('HBA_DECISION_RESEARCH:',x['status'],len(x['full_market_observations']),history)
          PY
      - name: Append immutable daily research receipt and publish latest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research/hba_surveillance')
          p=root/'latest.json'; raw=p.read_bytes(); d=json.loads(raw)
          sha=hashlib.sha256(raw).hexdigest()
          h=root/'history'/f"{d['target_tw_date'].replace('-','')}_{sha[:16]}.json"
          h.parent.mkdir(parents=True,exist_ok=True)
          if h.exists(): assert h.read_bytes()==raw
          else:h.write_bytes(raw)
          (root/'last_history_path.txt').write_text(str(h)+'\n')
          print('HBA_SURVEILLANCE_SHA256',sha,'ARCHIVE',h)
          PY
          git config user.name 'hengce-hba-surveillance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/hba_surveillance/latest.json research/hba_surveillance/latest.md "$(cat research/hba_surveillance/last_history_path.txt)"
          git add research/hba_surveillance/integrated_latest.json research/hba_surveillance/integrated_latest.md "$(cat research/hba_surveillance/last_integrated_history_path.txt)"
          git add research/hba_surveillance/decision_latest.json research/hba_surveillance/decision_latest.md "$(cat research/hba_surveillance/last_decision_history_path.txt)"
          git diff --cached --quiet && exit 0
          git commit -m 'research(sidecar): daily HBA surveillance with PIT macro and capital evidence'
          # Race protection: guarded publisher handles immutable write paths.
          git restore --worktree -- research/hba_surveillance/last_history_path.txt || true
          python scripts/hengce_publish.py --profile hba-surveillance --report-dir "${RUNNER_TEMP}/hengce-hba-publication"
      - name: Upload run receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hengce-hba-daily-surveillance
          path: |
            research/hba_surveillance/latest.json
            research/hba_surveillance/latest.md
            research/hba_surveillance/integrated_latest.json
            research/hba_surveillance/integrated_latest.md
            research/hba_surveillance/decision_latest.json
            research/hba_surveillance/decision_latest.md
            ${{ runner.temp }}/hengce-hba-publication
          if-no-files-found: ignore
          retention-days: 14
      - name: Build complete research cards from verified HBA sources
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            market_day=2026-11-17
            cutoff=2026-11-18T10:30:00+08:00
          else
            market_day=$(python -c 'import json; print(json.load(open("research/hba_surveillance/latest.json"))["latest_verified_eod"])')
            cutoff=$(TZ=Asia/Taipei date -Iseconds)
          fi
          python scripts/hengce_hba_decision_report.py \
            --research-cards "$RUNNER_TEMP/hengce-research-cards" \
            --market-date "$market_day" --evidence-cutoff "$cutoff"
      - name: Publish independent research cards
        id: research_cards
        uses: actions/upload-artifact@v4
        with:
          name: hengce-research-cards-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-research-cards/
          if-no-files-found: error
          retention-days: 14
      - name: Read back published research cards
        id: read_cards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hengce-research-cards-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-research-cards-readback/
      - name: Allow newly published artifact to become visible
        if: steps.read_cards.outcome == 'failure'
        run: sleep 5
      - name: Retry artifact readback
        if: steps.read_cards.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: hengce-research-cards-v1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-research-cards-readback/
      - name: Verify downloaded card hashes, coverage and report examples
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          from hengce_hba_decision_report import read_research_cards
          root = Path(os.environ['RUNNER_TEMP'])
          published = root / 'hengce-research-cards-readback'
          manifest, cards = read_research_cards(published)
          for path in published.iterdir():
              assert path.read_bytes() == (root/'hengce-research-cards'/path.name).read_bytes()
          print('RESEARCH_CARD_RECEIPT', manifest['market_date'], len(cards),
                len(manifest['shards']), hashlib.sha256((published/'manifest.json').read_bytes()).hexdigest())
          if os.environ['EVENT_NAME'] == 'pull_request':
              assert len(cards) == 1091
              assert list(cards) == sorted(cards)
              def evidence_groups(card):
                  flow = card['institutional']
                  ownership = card['ownership']
                  price = card['price']
                  financing = card['leverage']['MarginBalance']
                  short = card['leverage']['ShortBalance']
                  range_ = price['range']
                  if range_['status'] == 'VERIFIED':
                      assert range_['role'] == 'HISTORICAL_OBSERVATION_RANGE'
                      assert range_['method'] == 'MIN_LOW_MAX_HIGH_5_SESSIONS'
                  for item in (financing, short):
                      delta = item['change_5d']
                      if delta.get('change_pct') is not None:
                          assert type(delta['change_lots']) is int
                  if flow['20']['status'] != 'VERIFIED':
                      assert flow['20']['status'] == 'UNVERIFIED' and 'net_shares' not in flow['20']
                  return {
                      **{'institutional_'+n+'d': [item['status']] for n, item in flow.items()},
                      'institutional_all_windows': [item['status'] for item in flow.values()],
                      'financing': [financing['status'], financing['change_5d']['status']],
                      'short': [short['status'], short['change_5d']['status']],
                      'tdcc_latest': [ownership['snapshots'][0]['status']] if ownership['snapshots'] else ['MISSING'],
                      'tdcc_pair_and_change': [ownership['change']['status']],
                      'price_close': [price['close_twd_status']],
                      'price_full': [price[k+'_status'] for k in ('close_twd', 'volume_shares', 'turnover_twd')]
                                    + [price[k]['status'] for k in ('trend', 'volume_ratio', 'range')],
                  }

              counts = {}
              for card in cards.values():
                  for name, statuses in evidence_groups(card).items():
                      status = ('UNVERIFIED' if 'UNVERIFIED' in statuses else
                                'MISSING' if 'MISSING' in statuses else 'VERIFIED')
                      counts.setdefault(name, Counter())[status] += 1
              assert all(sum(count.values()) == len(cards) for count in counts.values())
              print('RESEARCH_CARD_COVERAGE', json.dumps(counts, sort_keys=True))
              print('RESEARCH_CARD_ENVIRONMENT', json.dumps(manifest['environment'], ensure_ascii=False))
              for symbol in ('1476', '2597', '3042', '2610'):
                  print('RESEARCH_CARD_EXAMPLE', json.dumps(cards[symbol], ensure_ascii=False))
          PY
