name: HENGCE Ranking X12 Prior Q25 Skip
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x12_prior_q25_skip.py'
      - '.github/workflows/hengce-ranking-x12-prior-q25-skip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X12 prior Q25 skip
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x12_prior_q25_skip.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x12_prior_q25_skip_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x12-prior-q25-skip
          path: |
            research/codex_full_reset_20261023/ranking_x12_prior_q25_skip_result.json
            research/codex_full_reset_20261023/ranking_x12_events.jsonl
