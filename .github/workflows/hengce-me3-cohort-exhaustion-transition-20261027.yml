name: HENGCE ME3 Cohort Exhaustion Transition 20261027

on:
  push:
    branches: ['research/codex-full-reset-run-20261023']
    paths:
      - '.github/workflows/hengce-me3-cohort-exhaustion-transition-20261027.yml'
      - 'research/codex_full_reset_20261023/me3_cohort_exhaustion_transition_20261027.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: research/codex-full-reset-run-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Recover frozen historical electronics artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _frozen_artifacts/a11670479047 _frozen_artifacts/a11670339491
          for id in 11670479047 11670339491; do
            curl -L --fail --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "_frozen_artifacts/${id}.zip"
            unzip -q "_frozen_artifacts/${id}.zip" -d "_frozen_artifacts/a${id}"
          done
      - name: Run ME3 frozen challenger
        run: python research/codex_full_reset_20261023/me3_cohort_exhaustion_transition_20261027.py
      - name: Commit exact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/codex_full_reset_20261023/results/me3_cohort_exhaustion_transition_20261027/
          git diff --cached --quiet && exit 0
          git commit -m "research: archive ME3 cohort exhaustion transition result"
          git push origin HEAD:research/codex-full-reset-run-20261023
