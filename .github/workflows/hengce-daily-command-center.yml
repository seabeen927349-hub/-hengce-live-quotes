name: HENGCE Daily Command Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | premarket | decision | monitor | postclose'
        required: false
        default: 'self-test'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_daily_command_center.py'
      - 'scripts/hengce_daily_command_center_core_legacy.py'
      - 'scripts/hengce_q017_decision_lock.py'
      - 'scripts/hengce_q017_authority_guard.py'
      - 'scripts/test_hengce_q017_decision_lock.py'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_0_20261017.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_1_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_2_20261019.json'
      - '.github/workflows/hengce-daily-command-center.yml'
  schedule:
    # Asia/Taipei = UTC+8
    - cron: '30 22 * * 0-4'
    # Start early, prepare causal inputs, then wait inside the job for 09:01:05.
    - cron: '50 0 * * 1-5'
    # Post-lock monitor snapshots. These may mark prices but may not rerank.
    - cron: '3 1 * * 1-5'
    - cron: '10 1 * * 1-5'
    - cron: '20 1 * * 1-5'
    # Post-close official three-leg ingest + electronics history append.
    - cron: '0 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-daily-command-center
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            MODE='${{ inputs.mode }}'
            # Backward-compatible alias. It routes only to the locked monitor;
            # the legacy radar implementation is never called by this workflow.
            if [[ "$MODE" == 'radar' ]]; then MODE='monitor'; fi
          elif [[ '${{ github.event_name }}' == 'schedule' ]]; then
            H='${{ github.event.schedule }}'
            case "$H" in
              '30 22 * * 0-4') MODE='premarket' ;;
              '50 0 * * 1-5') MODE='decision' ;;
              '3 1 * * 1-5'|'10 1 * * 1-5'|'20 1 * * 1-5') MODE='monitor' ;;
              '0 7 * * 1-5') MODE='postclose' ;;
              *) MODE='self-test' ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE"

      - name: Run self-test
        if: steps.mode.outputs.mode == 'self-test'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_daily_command_center.py --mode self-test
          python scripts/hengce_q017_decision_lock.py --mode self-test
          python scripts/hengce_q017_authority_guard.py --mode self-test
          python scripts/test_hengce_q017_decision_lock.py

          # Permanent negative test: the old schema-v1 radar CLI must be unable
          # to run or publish any formal candidate.
          set +e
          python scripts/hengce_daily_command_center.py --mode radar > /tmp/legacy-radar-kill-switch.json 2>&1
          RC=$?
          set -e
          test "$RC" -eq 2
          grep -q 'LEGACY_RADAR_DISABLED_USE_Q017_IMMUTABLE_0901_DECISION_LOCK_AND_LOCKED_MONITOR' /tmp/legacy-radar-kill-switch.json
          grep -q '"authority": "NO_FORMAL_SIGNAL"' /tmp/legacy-radar-kill-switch.json
          grep -q '"formal_buy_count": 0' /tmp/legacy-radar-kill-switch.json
          echo 'PASS LEGACY_RADAR_KILL_SWITCH_EXIT2_ZERO_AUTHORITY'

      - name: Run premarket data gate
        if: steps.mode.outputs.mode == 'premarket'
        run: python scripts/hengce_daily_command_center.py --mode premarket

      - name: Capture immutable 09:01 Q017 decision snapshot
        if: steps.mode.outputs.mode == 'decision'
        run: python scripts/hengce_q017_decision_lock.py --mode decision

      - name: Run locked Q017 post-open monitor
        if: steps.mode.outputs.mode == 'monitor'
        run: python scripts/hengce_q017_decision_lock.py --mode monitor

      - name: Run post-close official ingest and history append
        if: steps.mode.outputs.mode == 'postclose'
        run: python scripts/hengce_daily_command_center.py --mode postclose

      - name: Enforce Q017 authority guard
        if: always() && steps.mode.outputs.mode != 'self-test'
        run: python scripts/hengce_q017_authority_guard.py --mode check-and-repair

      - name: Commit command-center outputs
        if: always() && steps.mode.outputs.mode != 'self-test'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-command-center-bot'
          git config user.email 'hengce-command-center-bot@users.noreply.github.com'
          git add hengce/q017_radar/ eod/ || true
          if git diff --cached --quiet; then
            echo 'No command-center output changes.'
            exit 0
          fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE command center ${TS} ${{ steps.mode.outputs.mode }}"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
