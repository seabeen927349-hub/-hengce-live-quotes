name: HENGCE Daily Command Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | premarket | e2-morning | decision | compute | monitor | postclose'
        required: false
        default: 'self-test'
      trade_date:
        description: 'Optional YYYY-MM-DD for manual compute/recovery'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_daily_command_center.py'
      - 'scripts/hengce_daily_command_center_core_legacy.py'
      - 'scripts/hengce_eod_incremental_ingest.py'
      - 'scripts/test_hengce_eod_original_vessel_incremental.py'
      - 'hengce/HENGCE_THREE_LEG_ORIGINAL_VESSEL_INCREMENTAL_POLICY_LOCK_v1_0_20261020.json'
      - 'scripts/hengce_q017_decision_lock.py'
      - 'scripts/hengce_q017_authority_guard.py'
      - 'scripts/hengce_q017_decision_lock_v4.py'
      - 'scripts/hengce_q017_authority_guard_v4.py'
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_premarket_snapshot_v1.py'
      - 'scripts/hengce_q017_authority_guard_v5.py'
      - 'scripts/hengce_q017_10d_review.py'
      - 'scripts/hengce_q017_10d_review_extension.py'
      - 'scripts/test_hengce_q017_decision_lock.py'
      - 'scripts/test_hengce_q017_adversarial_v4.py'
      - 'scripts/hengce_e2_live.py'
      - 'scripts/apply_20261019_lane_coherence_repair.py'
      - 'hengce/e2_live/**'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_0_20261017.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_1_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_2_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_3_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_4_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_5_20261019.json'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_6_20261019.json'
      - 'hengce/HENGCE_Q017_10D_REVIEW_CONTRACT_v1_0_20261019.json'
      - 'hengce/HENGCE_Q017_10D_REVIEW_CONTRACT_v1_1_20261019.json'
      - '.github/workflows/hengce-daily-command-center.yml'
  schedule:
    # Asia/Taipei = UTC+8
    # 06:30 Taipei: premarket data gate + zero-authority Q017 model snapshot.
    - cron: '30 22 * * 0-4'
    # 08:50 Taipei: E2 morning binding only. Q017 capture is owned by dedicated primary/backup observers.
    - cron: '50 0 * * 1-5'
    # Post-lock monitor snapshots; E2 remains bound to prior-close state.
    - cron: '3 1 * * 1-5'
    - cron: '10 1 * * 1-5'
    - cron: '20 1 * * 1-5'
    # Post-close official three-leg ingest + E2 incremental state refresh.
    - cron: '0 7 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '0 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-daily-command-center
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            python -m pip install --disable-pip-version-check requests openpyxl && exit 0
            echo "pip install attempt ${n} failed"
            sleep $((n*5))
          done
          exit 2

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            MODE='${{ inputs.mode }}'
            if [[ "$MODE" == 'radar' ]]; then MODE='monitor'; fi
          elif [[ '${{ github.event_name }}' == 'schedule' ]]; then
            H='${{ github.event.schedule }}'
            case "$H" in
              '30 22 * * 0-4') MODE='premarket' ;;
              '50 0 * * 1-5') MODE='e2-morning' ;;
              '3 1 * * 1-5'|'10 1 * * 1-5'|'20 1 * * 1-5') MODE='monitor' ;;
              '0 7 * * 1-5'|'30 7 * * 1-5'|'0 8 * * 1-5'|'0 9 * * 1-5') MODE='postclose' ;;
              *) MODE='self-test' ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE"

      - name: Resolve optional trade date
        id: target
        shell: bash
        run: |
          set -euo pipefail
          DATE_ARG=''
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' && -n '${{ inputs.trade_date }}' ]]; then
            [[ '${{ inputs.trade_date }}' =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'BAD_TRADE_DATE_FORMAT'; exit 2; }
            DATE_ARG='--date ${{ inputs.trade_date }}'
          fi
          echo "date_arg=$DATE_ARG" >> "$GITHUB_OUTPUT"
          TARGET_DATE='${{ inputs.trade_date }}'
          if [[ -z "$TARGET_DATE" ]]; then TARGET_DATE="$(TZ=Asia/Taipei date '+%Y-%m-%d')"; fi
          echo "trade_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Run self-test
        if: steps.mode.outputs.mode == 'self-test'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_daily_command_center.py --mode self-test
          python scripts/hengce_eod_incremental_ingest.py --mode self-test
          python scripts/test_hengce_eod_original_vessel_incremental.py
          python scripts/hengce_q017_decision_lock.py --mode self-test
          python scripts/hengce_q017_authority_guard.py --mode self-test
          python scripts/test_hengce_q017_decision_lock.py
          python scripts/hengce_q017_decision_lock_v4.py --mode self-test
          python scripts/hengce_q017_authority_guard_v4.py --mode self-test
          python scripts/test_hengce_q017_adversarial_v4.py
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_premarket_snapshot_v1.py --mode self-test
          python scripts/hengce_q017_authority_guard_v5.py --mode self-test
          python scripts/hengce_q017_10d_review.py --mode self-test
          python scripts/hengce_q017_10d_review_extension.py --mode self-test
          python scripts/hengce_e2_live.py --mode self-test

          set +e
          python scripts/hengce_daily_command_center.py --mode radar > /tmp/legacy-radar-kill-switch.json 2>&1
          RC=$?
          set -e
          test "$RC" -eq 2
          grep -q 'LEGACY_RADAR_DISABLED_USE_Q017_IMMUTABLE_0901_DECISION_LOCK_AND_LOCKED_MONITOR' /tmp/legacy-radar-kill-switch.json
          grep -q '"authority": "NO_FORMAL_SIGNAL"' /tmp/legacy-radar-kill-switch.json
          grep -q '"formal_buy_count": 0' /tmp/legacy-radar-kill-switch.json
          echo 'PASS LEGACY_RADAR_KILL_SWITCH_EXIT2_ZERO_AUTHORITY'

      - name: Run premarket data gate
        id: premarket_gate
        if: steps.mode.outputs.mode == 'premarket'
        continue-on-error: true
        run: python scripts/hengce_daily_command_center.py --mode premarket

      - name: Build zero-authority Q017 prewarm fallback snapshot
        id: q017_snapshot
        if: always() && steps.mode.outputs.mode == 'premarket'
        continue-on-error: true
        run: python scripts/hengce_q017_premarket_snapshot_v1.py --mode build

      # Manual emergency decision mode remains available, but no schedule maps to it.
      - name: Capture immutable 09:01 Q017 observation only
        id: q017_observe
        if: steps.mode.outputs.mode == 'decision'
        continue-on-error: true
        shell: bash
        run: python scripts/hengce_q017_observation_lock_v5.py --mode observe ${{ steps.target.outputs.date_arg }}

      - name: Persist 09:01 observation before any ranking computation
        if: always() && steps.mode.outputs.mode == 'decision' && steps.q017_observe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-observation-lock-bot'
          git config user.email 'hengce-observation-lock-bot@users.noreply.github.com'
          git add hengce/q017_radar/observations/ hengce/q017_radar/observation_latest.json hengce/q017_radar/history/ || true
          if git diff --cached --quiet; then
            echo '09:01 observation already persisted.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 immutable 09:01 observation ${TS}"
            python scripts/hengce_publish.py --profile conservative-all
          fi

      - name: Compute Q017 only from locked 09:01 observation
        id: q017_compute
        if: steps.mode.outputs.mode == 'compute' || (steps.mode.outputs.mode == 'decision' && steps.q017_observe.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: python scripts/hengce_q017_observation_lock_v5.py --mode compute ${{ steps.target.outputs.date_arg }}

      - name: Bind E2 prior-close state for morning execution
        id: e2_morning
        if: always() && (steps.mode.outputs.mode == 'e2-morning' || steps.mode.outputs.mode == 'decision' || steps.mode.outputs.mode == 'compute' || steps.mode.outputs.mode == 'monitor')
        continue-on-error: true
        run: python scripts/hengce_e2_live.py --mode morning

      - name: Run locked Q017 post-open monitor
        id: q017_monitor
        if: steps.mode.outputs.mode == 'monitor'
        continue-on-error: true
        shell: bash
        run: python scripts/hengce_q017_observation_lock_v5.py --mode monitor ${{ steps.target.outputs.date_arg }}

      - name: Run post-close official ingest and history append
        id: postclose_ingest
        if: steps.mode.outputs.mode == 'postclose'
        run: python scripts/hengce_daily_command_center.py --mode postclose ${{ steps.target.outputs.date_arg }}

      - name: Resolve post-close mother-gated readiness
        id: postclose_ready
        if: always() && steps.mode.outputs.mode == 'postclose'
        shell: bash
        run: |
          set -euo pipefail
          DS="$(echo '${{ steps.target.outputs.trade_date }}' | tr -d '-')"
          FILE="eod/${DS}/status.json"
          python - "$FILE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          x=json.loads(p.read_text()) if p.exists() else {}
          print('price_complete=' + ('true' if x.get('price_status')=='COMPLETE' else 'false'))
          print('three_leg_complete=' + ('true' if x.get('three_leg_complete') is True else 'false'))
          print('mother_complete=' + ('true' if x.get('mother_status')=='COMPLETE' else 'false'))
          print('downstream_ready=' + ('true' if x.get('downstream_ready') is True else 'false'))
          PY

      - name: Refresh E2 incremental post-close state
        if: steps.mode.outputs.mode == 'postclose' && steps.postclose_ready.outputs.downstream_ready == 'true'
        run: python scripts/hengce_e2_live.py --mode postclose ${{ steps.target.outputs.date_arg }}

      - name: Update all active Q017 10-session review cohorts
        if: steps.mode.outputs.mode == 'postclose' && steps.postclose_ready.outputs.downstream_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_q017_10d_review.py --mode update
          python scripts/hengce_q017_10d_review_extension.py --mode update

      - name: Enforce Q017 schema-v5 observation-bound authority guard
        if: always() && (steps.mode.outputs.mode == 'decision' || steps.mode.outputs.mode == 'compute' || steps.mode.outputs.mode == 'monitor')
        run: python scripts/hengce_q017_authority_guard_v5.py --mode check-and-repair

      - name: Commit command-center outputs
        if: always() && steps.mode.outputs.mode != 'self-test'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-command-center-bot'
          git config user.email 'hengce-command-center-bot@users.noreply.github.com'
          git add hengce/q017_radar/ hengce/q017_review_10d/ hengce/e2_live/ eod/ || true
          if git diff --cached --quiet; then
            echo 'No command-center output changes.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE command center ${TS} ${{ steps.mode.outputs.mode }}"
            python scripts/hengce_publish.py --profile conservative-all
          fi

      - name: Premarket snapshot health
        if: always() && steps.mode.outputs.mode == 'premarket'
        shell: bash
        run: |
          set -euo pipefail
          echo "premarket_gate=${{ steps.premarket_gate.outcome }} q017_snapshot=${{ steps.q017_snapshot.outcome }}"
          if [[ '${{ steps.premarket_gate.outcome }}' != 'success' || '${{ steps.q017_snapshot.outcome }}' != 'success' ]]; then
            echo 'PREMARKET_OR_Q017_SNAPSHOT_FAIL_CLOSED; diagnostics were persisted; snapshot has zero signal authority.'
            exit 2
          fi
          echo 'PREMARKET_AND_Q017_PREWARM_SNAPSHOT_PASS'

      - name: Final engine health status
        if: always() && (steps.mode.outputs.mode == 'e2-morning' || steps.mode.outputs.mode == 'decision' || steps.mode.outputs.mode == 'compute' || steps.mode.outputs.mode == 'monitor')
        shell: bash
        run: |
          set -euo pipefail
          MODE='${{ steps.mode.outputs.mode }}'
          Q017_OK=1
          if [[ "$MODE" == 'decision' ]]; then
            [[ '${{ steps.q017_observe.outcome }}' == 'success' && '${{ steps.q017_compute.outcome }}' == 'success' ]] || Q017_OK=0
          elif [[ "$MODE" == 'compute' ]]; then
            [[ '${{ steps.q017_compute.outcome }}' == 'success' ]] || Q017_OK=0
          elif [[ "$MODE" == 'monitor' ]]; then
            [[ '${{ steps.q017_monitor.outcome }}' == 'success' ]] || Q017_OK=0
          fi
          E2_OK=1
          [[ '${{ steps.e2_morning.outcome }}' == 'success' ]] || E2_OK=0
          echo "Q017_OK=$Q017_OK E2_OK=$E2_OK"
          if [[ "$Q017_OK" -ne 1 || "$E2_OK" -ne 1 ]]; then
            echo 'One engine is fail-closed; the other engine was still allowed to run and persist its state.'
            exit 2
          fi

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
