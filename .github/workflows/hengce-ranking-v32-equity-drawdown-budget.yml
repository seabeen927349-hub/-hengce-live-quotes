name: HENGCE Ranking V32 Equity Drawdown Budget

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v32_equity_drawdown_budget.py'
      - '.github/workflows/hengce-ranking-v32-equity-drawdown-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V32 equity drawdown budget
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v32_equity_drawdown_budget.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v32_equity_drawdown_budget_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v32-equity-drawdown-budget
          path: |
            research/codex_full_reset_20261023/ranking_v32_equity_drawdown_budget_result.json
            research/codex_full_reset_20261023/ranking_v32_events.jsonl
          if-no-files-found: error
