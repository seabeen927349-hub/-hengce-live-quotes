name: HENGCE postclose finalize 20261021

on:
  push:
    branches: [hengce/postclose-finalize-20261021]
    paths:
      - '.github/workflows/hengce-postclose-finalize-20261021.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install requests openpyxl
      - name: Run authoritative postclose gate
        run: python scripts/hengce_daily_command_center.py --mode postclose --date 2026-10-21
      - name: Validate downstream readiness
        run: |
          python - <<'PY'
          import json
          e=json.load(open('eod/20261021/status.json',encoding='utf-8'))
          d=json.load(open('hengce/q017_radar/data_status.json',encoding='utf-8'))
          assert e['three_leg_complete'] is True
          assert e['mother_status']=='COMPLETE'
          assert e['downstream_ready'] is True
          assert d['status']=='PASS'
          assert d['downstream_ready'] is True
          assert d['electronics_history_append']['status']=='PASS'
          assert d['sox']['status']=='PASS'
          print('PASS POSTCLOSE_FINALIZE')
          PY
      - name: Commit generated downstream state
        run: |
          set -euo pipefail
          git config user.name 'hengce-postclose-finalize-bot'
          git config user.email 'hengce-postclose-finalize-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'HENGCE finalize 2026-10-21 postclose after canonical mother promotion'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
