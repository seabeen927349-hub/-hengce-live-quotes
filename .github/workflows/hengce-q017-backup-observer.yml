name: HENGCE Q017 Backup Observer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | observe'
        required: false
        default: 'self-test'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_backup_observer_v5.py'
      - 'scripts/hengce_q017_macro_cache_v1.py'
      - 'scripts/hengce_q017_premarket_snapshot_v1.py'
      - 'scripts/hengce_q017_observer_supervisor_v1.py'
      - 'scripts/hengce_q017_observer_supervisor_v2.py'
      - 'scripts/test_hengce_q017_observer_resilience_v1.py'
      - 'scripts/hengce_q017_recovery_compute_v5.py'
      - '.github/workflows/hengce-q017-backup-observer.yml'
  schedule:
    # Asia/Taipei 08:15. Normal path reads the already-persisted morning macro cache.
    - cron: '15 0 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-q017-backup-observer
  cancel-in-progress: false

jobs:
  backup-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            python -m pip install --disable-pip-version-check requests openpyxl && exit 0
            echo "pip install attempt ${n} failed"
            sleep $((n*5))
          done
          exit 2

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then MODE='observe'; fi
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then MODE='${{ inputs.mode }}'; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test backup, macro cache, supervisors and recovery lanes
        if: steps.mode.outputs.mode == 'self-test'
        run: |
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_backup_observer_v5.py --mode self-test
          python scripts/hengce_q017_macro_cache_v1.py --mode self-test
          python scripts/hengce_q017_premarket_snapshot_v1.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v1.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v2.py --mode self-test
          python scripts/test_hengce_q017_observer_resilience_v1.py
          python scripts/hengce_q017_recovery_compute_v5.py --mode self-test

      - name: Sync latest persisted morning inputs before observer starts
        if: steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Recovery admission from clean current remote
        if: steps.mode.outputs.mode == 'observe'
        env:
          HENGCE_REQUEST_DATE: ${{ inputs.trade_date || '' }}
          HENGCE_REQUEST_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/hengce_recovery_transaction.py prepare --lane q017-backup --mode "$HENGCE_REQUEST_MODE"

      - name: Capture independent 09:01 backup observation through macro-cache-first supervisor
        id: backup_observe
        if: steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: |
          python scripts/hengce_recovery_transaction.py fence --scope q017-backup
          python scripts/hengce_q017_observer_supervisor_v2.py --mode observe --lane backup

      - name: Persist backup evidence or failure diagnostics
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-backup-observer-bot'
          git config user.email 'hengce-backup-observer-bot@users.noreply.github.com'

          paths=(
            hengce/q017_radar/backup_observations/
            hengce/q017_radar/backup_observation_history/
            hengce/q017_radar/backup_observation_latest.json
            hengce/q017_radar/backup_observation_status.json
            hengce/q017_radar/backup_observation_attempts/
            hengce/q017_radar/backup_observation_attempt_latest.json
            hengce/q017_radar/observer_supervisor_backup_status.json
            hengce/q017_radar/observer_supervisor_attempts/
          )
          for p in "${paths[@]}"; do
            if [[ -e "$p" ]]; then
              git add -A -- "$p"
            fi
          done

          OBS="hengce/q017_radar/backup_observations/$(TZ=Asia/Taipei date '+%Y%m%d')_0901_observation.json"
          if [[ '${{ steps.backup_observe.outcome }}' == 'success' ]]; then
            [[ -f "$OBS" ]] || { echo "BACKUP_CANONICAL_OBSERVATION_MISSING_BEFORE_PERSIST:$OBS"; exit 2; }
            git add -- "$OBS"
          fi

          if git diff --cached --quiet; then
            echo 'No backup evidence/diagnostic changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            python scripts/hengce_recovery_transaction.py stage
            git commit -m "HENGCE Q017 backup 09:01 evidence/status ${TS}"
            python scripts/hengce_publish.py --profile q017-backup-capture --transaction-lane q017-backup
          fi

      - name: Verify backup observation is persisted in Git HEAD
        id: backup_evidence
        if: steps.mode.outputs.mode == 'observe' && steps.backup_observe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Verify the exact accepted proposal; no post-computation pull/rebase.
          OBS="hengce/q017_radar/backup_observations/$(TZ=Asia/Taipei date '+%Y%m%d')_0901_observation.json"
          git cat-file -e "HEAD:$OBS"
          git show "HEAD:$OBS" > /tmp/q017_backup_observation.json
          python - /tmp/q017_backup_observation.json <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          o = json.loads(p.read_text(encoding='utf-8'))
          assert o.get('schema_version') == 5
          assert o.get('module') == 'Q017_0901_OBSERVATION_LOCK'
          lock = o.get('observation_lock') or {}
          assert lock.get('cutoff_label') == '09:01'
          assert lock.get('window_valid') is True
          assert lock.get('immutable') is True
          h = o.get('observation_snapshot_sha256')
          payload = {k: v for k, v in o.items() if k != 'observation_snapshot_sha256'}
          exp = hashlib.sha256(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert h and h == exp
          print('PASS BACKUP_OBSERVATION_PERSISTED_AND_HASH_VALID')
          PY

      - name: Backup observer health
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          echo "backup_observe_outcome=${{ steps.backup_observe.outcome }} backup_evidence=${{ steps.backup_evidence.outcome }}"
          if [[ '${{ steps.backup_observe.outcome }}' != 'success' ]]; then
            echo 'BACKUP_0901_OBSERVATION_FAIL_CLOSED; supervisor diagnostics were persisted when available.'
            exit 2
          fi
          if [[ '${{ steps.backup_evidence.outcome }}' != 'success' ]]; then
            echo 'BACKUP_0901_OBSERVATION_NOT_PERSISTED_TO_GIT_HEAD_FAIL_CLOSED'
            exit 2
          fi
          echo 'BACKUP_0901_OBSERVATION_PERSISTED_PASS'

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
