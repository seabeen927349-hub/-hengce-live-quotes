name: HENGCE Q017 Backup Observer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | observe'
        required: false
        default: 'self-test'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_backup_observer_v5.py'
      - 'scripts/hengce_q017_observer_supervisor_v1.py'
      - 'scripts/test_hengce_q017_observer_resilience_v1.py'
      - 'scripts/hengce_q017_recovery_compute_v5.py'
      - '.github/workflows/hengce-q017-backup-observer.yml'
  schedule:
    # Asia/Taipei 08:15. Start well before 09:01 and remain alive through transient preflight failures.
    - cron: '15 0 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-q017-backup-observer
  cancel-in-progress: false

jobs:
  backup-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            python -m pip install --disable-pip-version-check requests openpyxl && exit 0
            echo "pip install attempt ${n} failed"
            sleep $((n*5))
          done
          exit 2

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then MODE='observe'; fi
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then MODE='${{ inputs.mode }}'; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test backup, supervisor and recovery lanes
        if: steps.mode.outputs.mode == 'self-test'
        run: |
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_backup_observer_v5.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v1.py --mode self-test
          python scripts/test_hengce_q017_observer_resilience_v1.py
          python scripts/hengce_q017_recovery_compute_v5.py --mode self-test

      - name: Capture independent 09:01 backup observation through resilient supervisor
        id: backup_observe
        if: steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: python scripts/hengce_q017_observer_supervisor_v1.py --mode observe --lane backup

      - name: Persist backup evidence or failure diagnostics
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-backup-observer-bot'
          git config user.email 'hengce-backup-observer-bot@users.noreply.github.com'
          git add \
            hengce/q017_radar/backup_observations/ \
            hengce/q017_radar/backup_observation_history/ \
            hengce/q017_radar/backup_observation_latest.json \
            hengce/q017_radar/backup_observation_status.json \
            hengce/q017_radar/backup_observation_attempts/ \
            hengce/q017_radar/backup_observation_attempt_latest.json \
            hengce/q017_radar/observer_supervisor_backup_status.json \
            hengce/q017_radar/observer_supervisor_attempts/ || true
          if git diff --cached --quiet; then
            echo 'No backup evidence/diagnostic changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 backup 09:01 evidence/status ${TS}"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Backup observer health
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          echo "backup_observe_outcome=${{ steps.backup_observe.outcome }}"
          if [[ '${{ steps.backup_observe.outcome }}' != 'success' ]]; then
            echo 'BACKUP_0901_OBSERVATION_FAIL_CLOSED; supervisor diagnostics were persisted when available.'
            exit 2
          fi
          echo 'BACKUP_0901_OBSERVATION_PASS'
