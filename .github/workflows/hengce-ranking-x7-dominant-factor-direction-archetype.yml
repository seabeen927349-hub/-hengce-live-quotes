name: HENGCE Ranking X7 Dominant Factor Direction Archetype
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x7_dominant_factor_direction_archetype.py'
      - '.github/workflows/hengce-ranking-x7-dominant-factor-direction-archetype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X7 dominant-factor direction archetype
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x7_dominant_factor_direction_archetype.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x7_dominant_factor_direction_archetype_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x7-dominant-factor-direction-archetype
          path: |
            research/codex_full_reset_20261023/ranking_x7_dominant_factor_direction_archetype_result.json
            research/codex_full_reset_20261023/ranking_x7_events.jsonl
