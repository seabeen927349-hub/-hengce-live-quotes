name: HENGCE Ranking V9 Walkforward IC

on:
  push:
    branches: [research/codex-full-reset-run-20261023]
    paths:
      - 'research/codex_full_reset_20261023/ranking_v9_walkforward_ic.py'
      - '.github/workflows/hengce-ranking-v9-walkforward-ic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix V9 indentation typo
        run: sed -i 's/^ics=/ ics=/' research/codex_full_reset_20261023/ranking_v9_walkforward_ic.py
      - name: Run V9 walkforward IC learner
        run: python -u research/codex_full_reset_20261023/ranking_v9_walkforward_ic.py
      - name: Print result
        if: always()
        run: cat research/codex_full_reset_20261023/ranking_v9_walkforward_ic_result.json 2>/dev/null || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v9-walkforward-ic
          path: |
            research/codex_full_reset_20261023/ranking_v9_walkforward_ic_result.json
            research/codex_full_reset_20261023/ranking_v9_champion_events.jsonl
          if-no-files-found: warn
          retention-days: 30
