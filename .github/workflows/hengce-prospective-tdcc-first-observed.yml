name: HENGCE TDCC Provenance Verifier (No Network)

# Superseded as a collector. This workflow MUST NOT fetch TDCC.
# It exists only for manual verification of evidence produced by the canonical
# ownership vessel: hengce-tdcc-ownership-daily.yml + hengce_tdcc_ownership_ingest.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify canonical TDCC provenance without network access
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('ownership/tdcc/provenance')
          current_path=root/'current.json'
          if not current_path.exists():
              raise SystemExit('TDCC_CANONICAL_PROVENANCE_NOT_YET_PRESENT')
          current=json.loads(current_path.read_text(encoding='utf-8'))
          sha=current.get('payload_sha256')
          if not sha:
              raise SystemExit('TDCC_CANONICAL_SHA_MISSING')
          payload=root/'payloads'/f'{sha}.csv'
          first=root/'first_observed'/f'{sha}.json'
          if not payload.exists() or not first.exists():
              raise SystemExit('TDCC_CANONICAL_IMMUTABLE_EVIDENCE_MISSING')
          if hashlib.sha256(payload.read_bytes()).hexdigest()!=sha:
              raise SystemExit('TDCC_CANONICAL_PAYLOAD_HASH_MISMATCH')
          meta=json.loads(first.read_text(encoding='utf-8'))
          if meta.get('payload_sha256')!=sha:
              raise SystemExit('TDCC_FIRST_OBSERVED_HASH_MISMATCH')
          if current.get('provenance_source_authority')!='CANONICAL_VESSEL_RESPONSE_ONLY':
              raise SystemExit('TDCC_PROVENANCE_SOURCE_NOT_CANONICAL')
          if current.get('network_fetch_count_for_this_payload')!=1:
              raise SystemExit('TDCC_DUPLICATE_FETCH_GUARD_FAILED')
          if current.get('ownership_and_provenance_share_exact_response_bytes') is not True:
              raise SystemExit('TDCC_RESPONSE_BYTES_NOT_SHARED')
          if current.get('official_published_at') is not None or meta.get('official_published_at') is not None:
              raise SystemExit('TDCC_OFFICIAL_PUBLISHED_AT_IMPROPERLY_INFERRED')
          if current.get('historical_latency_status')!='DATA_BLOCKED':
              raise SystemExit('TDCC_HISTORICAL_LATENCY_STATUS_CHANGED')
          if current.get('prospective_live_latency_status')!='COLLECTING':
              raise SystemExit('TDCC_PROSPECTIVE_LATENCY_STATUS_CHANGED')

          proof_path=root/'schedule_proofs'/'first_verified_high_frequency_schedule.json'
          if proof_path.exists():
              proof=json.loads(proof_path.read_text(encoding='utf-8'))
              if proof.get('github_event_name')!='schedule':
                  raise SystemExit('TDCC_SCHEDULE_PROOF_EVENT_INVALID')
              if proof.get('provenance_source_authority')!='CANONICAL_VESSEL_RESPONSE_ONLY':
                  raise SystemExit('TDCC_SCHEDULE_PROOF_SOURCE_INVALID')
              if proof.get('network_fetch_count_for_this_payload')!=1:
                  raise SystemExit('TDCC_SCHEDULE_PROOF_DUPLICATE_FETCH_GUARD_FAILED')
              print('TDCC_CANONICAL_PROVENANCE_VALID_SCHEDULE_PROOF_PRESENT',sha,proof.get('github_run_id'))
          else:
              print('TDCC_CANONICAL_PROVENANCE_VALID_SCHEDULE_PROOF_PENDING',sha)
          PY
