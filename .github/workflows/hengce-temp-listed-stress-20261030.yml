name: HENGCE TEMP Full Listed Stress 20261030

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-temp-listed-stress-20261030.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze verified HENGCE original-vessel price leg only
        shell: bash
        run: |
          python - <<'PY'
          import csv, glob, json, math, re, statistics
          from pathlib import Path

          rows=[]
          for fn in sorted(glob.glob('eod/20261030/price_*.csv')):
              with open(fn,encoding='utf-8-sig',newline='') as f:
                  rows.extend(csv.DictReader(f))

          def fnum(x):
              try: return float(str(x).replace(',',''))
              except: return None

          out=[]
          for r in rows:
              t=(r.get('Ticker') or '').strip()
              # TWSE listed-company common-stock research universe: 4-digit numeric company codes >=1000.
              # Excludes ETF/ETN/warrant/bond style codes and non-numeric preferred/special classes.
              if not (len(t)==4 and t.isdigit() and int(t)>=1000):
                  continue
              o,h,l,c=map(fnum,[r.get('Open'),r.get('High'),r.get('Low'),r.get('Close')])
              ch=fnum(r.get('Change'))
              vol=fnum(r.get('VolumeShares')) or 0
              val=fnum(r.get('TurnoverTWD')) or 0
              sign=r.get('ChangeSign') or ''
              if None in (o,h,l,c,ch) or c<=0: continue
              # Ex-right/ex-dividend rows are not comparable on raw reference-price return.
              if '>X<' in sign or sign.strip()=='X':
                  raw_ret=None; prev=None; corp_action=True
              else:
                  corp_action=False
                  s=-1 if 'green' in sign else (1 if 'red' in sign else 0)
                  prev=c-s*ch
                  raw_ret=(c/prev-1) if prev and prev>0 else None
              close_loc=(c-l)/(h-l) if h>l else 0.5
              open_to_close=c/o-1 if o and o>0 else None
              recovery=c/l-1 if l and l>0 else None
              out.append({
                'ticker':t,'name':r.get('Name'),'close':c,'prev_close':prev,'ret':raw_ret,
                'open':o,'high':h,'low':l,'close_loc':close_loc,'open_to_close':open_to_close,
                'recovery_from_low':recovery,'turnover':val,'volume':vol,'corp_action':corp_action
              })

          comparable=[x for x in out if x['ret'] is not None]
          rets=[x['ret'] for x in comparable]
          med=statistics.median(rets)
          mean=statistics.fmean(rets)
          up=sum(x>0 for x in rets); flat=sum(x==0 for x in rets); down=sum(x<0 for x in rets)
          for x in comparable: x['rel_vs_median']=x['ret']-med

          # Raw full-universe extremes; no model promotion.
          strongest=sorted(comparable,key=lambda x:(x['ret'],x['close_loc'],x['turnover']),reverse=True)[:20]
          weakest=sorted(comparable,key=lambda x:(x['ret'],x['close_loc'],x['turnover']))[:20]

          # Liquid stress view only for usability, not a model threshold: >= NT$20m turnover.
          liquid=[x for x in comparable if x['turnover']>=20_000_000]
          liquid_strong=sorted(liquid,key=lambda x:(x['ret'],x['close_loc'],x['turnover']),reverse=True)[:20]
          liquid_weak=sorted(liquid,key=lambda x:(x['ret'],x['close_loc'],x['turnover']))[:20]

          watch=['6278','3029','2493']
          risk=['8213','2851','7730']
          by={x['ticker']:x for x in comparable}
          prior={t:by.get(t) for t in watch+risk}

          def clean(x):
              if not x: return None
              return {k:(round(v,6) if isinstance(v,float) and math.isfinite(v) else v) for k,v in x.items()}
          result={
            'artifact':'HENGCE_TEMP_FULL_LISTED_CRASH_STRESS_20261030',
            'authority':'RESEARCH_DIAGNOSTIC_ONLY_PRICE_LEG',
            'source':'HENGCE_EOD_ORIGINAL_VESSEL/eod/20261030/price_*.csv',
            'input_rows':len(rows),'listed_company_rows':len(out),'comparable_rows':len(comparable),
            'market':{'median_return':round(med,6),'mean_return':round(mean,6),'up':up,'flat':flat,'down':down},
            'strongest_raw':[clean(x) for x in strongest],
            'weakest_raw':[clean(x) for x in weakest],
            'strongest_liquid_20m':[clean(x) for x in liquid_strong],
            'weakest_liquid_20m':[clean(x) for x in liquid_weak],
            'prior_formal_snapshot_checks':{t:clean(prior[t]) for t in prior},
            'notes':['No institutional leg used','No margin leg used','No TDCC state changed','No BUY/SELL authority created','Ex-right/ex-dividend X rows excluded from comparable return ranking']
          }
          print('HENGCE_STRESS_RESULT_BEGIN')
          print(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          print('HENGCE_STRESS_RESULT_END')
          PY
