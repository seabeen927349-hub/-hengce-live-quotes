name: HENGCE Ranking V20 Staggered Cohorts

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v20_staggered_cohorts.py'
      - '.github/workflows/hengce-ranking-v20-staggered.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hengce-ranking-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V20 staggered cohorts
        run: PYTHONPATH=. python -u research/codex_full_reset_20261023/ranking_v20_staggered_cohorts.py
      - name: Print result
        if: always()
        run: cat research/codex_full_reset_20261023/ranking_v20_staggered_cohorts_result.json 2>/dev/null || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v20-staggered
          path: |
            research/codex_full_reset_20261023/ranking_v20_staggered_cohorts_result.json
            research/codex_full_reset_20261023/ranking_v20_champion_events.jsonl
          if-no-files-found: warn
          retention-days: 30
