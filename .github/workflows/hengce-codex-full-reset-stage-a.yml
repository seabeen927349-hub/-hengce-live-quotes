name: HENGCE Codex Full Reset Stage A

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/stage_a_data_audit.py'
      - 'research/codex_full_reset_20261023/stage_a_round2_reconstruction.py'
      - 'research/codex_full_reset_20261023/RESET_AUTHORIZATION.json'
      - 'research/codex_full_reset_20261023/CORPUS_MANIFEST.json'
      - '.github/workflows/hengce-codex-full-reset-stage-a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hengce-codex-full-reset-stage-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Stage A audits
        run: |
          python -m py_compile research/codex_full_reset_20261023/stage_a_data_audit.py
          python -m py_compile research/codex_full_reset_20261023/stage_a_round2_reconstruction.py

      - name: Run Stage A corpus audit
        run: python research/codex_full_reset_20261023/stage_a_data_audit.py

      - name: Reconstruct Round-2 payload using original semantics
        id: round2
        continue-on-error: true
        run: python research/codex_full_reset_20261023/stage_a_round2_reconstruction.py

      - name: Require explicit Round-2 evidence record
        if: always()
        run: |
          test -s research/codex_full_reset_20261023/results/ROUND2_RECONSTRUCTION.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/codex_full_reset_20261023/results/ROUND2_RECONSTRUCTION.json')
          d=json.loads(p.read_text())
          assert d['authority']['capital_authority_twd'] == 0
          assert d['authority']['broker_order_execution'] is False
          assert d['research_interpretation'] in {
              'ROUND2_SHOCK_PAYLOAD_RECOVERED_AND_USABLE_AS_EXPOSED_HISTORY',
              'ROUND2_SHOCK_PAYLOAD_NOT_PROVEN_USABLE',
          }
          print('ROUND2_EVIDENCE_RETAINED', d['research_interpretation'])
          PY

      - name: Print Stage A evidence
        if: always()
        run: |
          echo '--- STAGE_A_SUMMARY.md ---'
          cat research/codex_full_reset_20261023/results/STAGE_A_SUMMARY.md 2>/dev/null || true
          echo '--- DATA_QUALITY_FAILURES.json ---'
          cat research/codex_full_reset_20261023/results/DATA_QUALITY_FAILURES.json 2>/dev/null || true
          echo '--- ROUND2_RECONSTRUCTION.json ---'
          cat research/codex_full_reset_20261023/results/ROUND2_RECONSTRUCTION.json 2>/dev/null || true

      - name: Upload Stage A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-codex-full-reset-stage-a
          path: research/codex_full_reset_20261023/results/
          if-no-files-found: warn
          retention-days: 90
