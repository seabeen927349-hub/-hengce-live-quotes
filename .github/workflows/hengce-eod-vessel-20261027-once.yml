name: HENGCE EOD Vessel 20261027 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-eod-vessel-20261027-once.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Vessel self-test
        run: python scripts/hengce_eod_incremental_ingest.py --mode self-test
      - name: Ingest official 2026-10-27 through original vessel
        run: python scripts/hengce_eod_incremental_ingest.py --mode ingest --date 2026-10-27
      - name: Persist original eod tree
        run: |
          git config user.name "hengce-vessel-bot"
          git config user.email "hengce-vessel-bot@users.noreply.github.com"
          git add eod/20261027
          if git diff --cached --quiet; then
            echo "No EOD changes"
          else
            git commit -m "Persist 2026-10-27 official EOD through original vessel"
            git push origin HEAD:main
          fi
