name: HENGCE Fugle Permission Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hengce-fugle-permission-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - name: Probe Fugle endpoint permissions
        shell: bash
        run: |
          set -uo pipefail
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          key = os.environ.get('FUGLE_API_KEY')
          if not key:
              print('PROBE FUGLE_API_KEY_MISSING')
              raise SystemExit(1)

          headers = {'X-API-KEY': key, 'Accept': 'application/json', 'User-Agent': 'HENGCE-FUGLE-PERMISSION-PROBE/1.0'}
          endpoints = [
              ('tickers', 'https://api.fugle.tw/marketdata/v1.0/stock/intraday/tickers?type=EQUITY&exchange=TWSE&market=TSE'),
              ('quote_2330', 'https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330'),
              ('snapshot_common', 'https://api.fugle.tw/marketdata/v1.0/stock/snapshot/quotes/TSE?type=COMMONSTOCK'),
          ]

          failures = 0
          for name, url in endpoints:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      obj = json.loads(raw.decode('utf-8'))
                      data = obj.get('data')
                      count = len(data) if isinstance(data, list) else None
                      print(f'PROBE {name} HTTP={r.status} date={obj.get("date")} time={obj.get("time")} market={obj.get("market")} exchange={obj.get("exchange")} rows={count}')
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace')[:300]
                  print(f'PROBE {name} HTTP={e.code} body={body}')
                  failures += 1
              except Exception as e:
                  print(f'PROBE {name} ERROR={type(e).__name__}:{e}')
                  failures += 1

          raise SystemExit(0 if failures == 0 else 2)
          PY
