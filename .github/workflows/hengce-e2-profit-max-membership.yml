name: HENGCE E2 Profit Max PIT Electronics Membership

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/e2_profit_max/acquire_pit_electronics_membership.py'
      - '.github/workflows/hengce-e2-profit-max-membership.yml'

permissions:
  contents: write

jobs:
  build-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Acquire point-in-time TWSE electronics membership
        run: python research/e2_profit_max/acquire_pit_electronics_membership.py --start 2023-01-01 --end 2026-10-19 --workers 6
      - name: Validate no non-electronics backfill policy drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('research/e2_profit_max/membership')
          rec=json.loads((root/'membership_receipt.json').read_text())
          assert rec['hard_gate']=='PASS',rec
          assert rec['policy']=='POINT_IN_TIME_OBSERVED_ON_DATE_NO_CURRENT_CONSTITUENT_BACKFILL'
          assert rec['review_days']==0 and rec['error_days']==0
          for y in (2023,2024,2025,2026):
              p=root/f'twse_electronics_membership_{y}.csv'; assert p.exists()
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f); rows=list(r)
              assert rows and all(len(x['Ticker'])==4 and x['Ticker'].isdigit() for x in rows)
          print('PASS E2_PROFIT_MAX_PIT_ELECTRONICS_MEMBERSHIP_GUARD')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e2-profit-max-pit-electronics-membership
          path: research/e2_profit_max/membership/
          if-no-files-found: error
      - name: Commit membership archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-e2-research-bot'
          git config user.email 'hengce-e2-research-bot@users.noreply.github.com'
          git add research/e2_profit_max/membership/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HENGCE E2 profit-max PIT electronics membership 2023-2026'
          python scripts/hengce_publish.py --profile conservative-all

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
