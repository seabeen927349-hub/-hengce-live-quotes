name: HENGCE V43 Daily Independent Screening

on:
  workflow_dispatch:
    inputs:
      through_date:
        description: 'Optional YYYY-MM-DD; default Asia/Taipei today'
        required: false
        default: ''
  push:
    branches:
      - main
      - feature/hengce-v43-daily-engine-v2
    paths:
      - 'scripts/hengce_v43_daily_screen.py'
      - 'scripts/hengce_v43_history_sync.py'
      - 'scripts/hengce_v43_publish.py'
      - '.github/workflows/hengce-v43-daily-screen.yml'
  schedule:
    # 18:10 Asia/Taipei, Monday-Friday. Runs after the HENGCE post-close lanes.
    - cron: '10 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-v43-daily-independent-screen
  cancel-in-progress: false

env:
  V43_CANONICAL_COMMIT: 959f96831fdea65f32bed65ca11011d67328f695
  V43_CORE_BLOB: 584acac7a78d11440ba08a6c7fcf11cd3293d79a
  V43_HIST_BLOB: 9fde5eebeec06ef0782bd9150f1f3d1174aed1e3
  V43_BOOTSTRAP_BLOB: b84c642f262fdcb7ba68018548f4d90b1ff41b9e

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve frozen V43 core and research history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hengce-v43
          git fetch --no-tags --depth=50 origin research/v43-clean-prospective-observer
          git cat-file -e "${V43_CANONICAL_COMMIT}^{commit}"
          git show "${V43_CANONICAL_COMMIT}:research/codex_full_reset_20261023/ranking_v43_clean_prospective_observer.py" > /tmp/hengce-v43/v43_core.py
          git show "${V43_CANONICAL_COMMIT}:research/codex_full_reset_20261023/results/stage_b/TWSE_ELECTRONICS_DAILY_2023_2025.csv.gz" > /tmp/hengce-v43/history_2023_2025.csv.gz
          test "$(git hash-object /tmp/hengce-v43/v43_core.py)" = "$V43_CORE_BLOB"
          test "$(git hash-object /tmp/hengce-v43/history_2023_2025.csv.gz)" = "$V43_HIST_BLOB"

      - name: One-time independent V43 history bootstrap when absent
        shell: bash
        run: |
          set -euo pipefail
          BOOT=''
          if [[ ! -f hengce/v43_daily/data/twse_electronics_history_2026.csv ]]; then
            git fetch --no-tags origin main
            git show origin/main:hengce/q017_radar/data/twse_electronics_history_2026.csv > /tmp/hengce-v43/bootstrap_2026.csv
            test "$(git hash-object /tmp/hengce-v43/bootstrap_2026.csv)" = "$V43_BOOTSTRAP_BLOB"
            BOOT='--bootstrap /tmp/hengce-v43/bootstrap_2026.csv'
          fi
          THROUGH='${{ github.event.inputs.through_date }}'
          if [[ -z "$THROUGH" ]]; then THROUGH="$(TZ=Asia/Taipei date '+%Y-%m-%d')"; fi
          python scripts/hengce_v43_history_sync.py \
            --history hengce/v43_daily/data/twse_electronics_history_2026.csv \
            --through-date "$THROUGH" \
            $BOOT

      - name: Generate independent daily V43 report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_v43_daily_screen.py \
            --core /tmp/hengce-v43/v43_core.py \
            --historical-gz /tmp/hengce-v43/history_2023_2025.csv.gz \
            --current-csv hengce/v43_daily/data/twse_electronics_history_2026.csv \
            --out-dir hengce/v43_daily

      - name: Enforce V43 isolation and parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('hengce/v43_daily/latest.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['system']=='HENGCE'
          assert x['engine']=='HENGCE_V43_DAILY'
          assert x['lane']=='INDEPENDENT_DAILY_SCREENING_ENGINE'
          assert x['authority']['capital_authority_twd']==0
          assert x['authority']['broker_order_execution'] is False
          assert x['authority']['q017_engine_integration'] is False
          assert x['authority']['q017_write'] is False
          assert x['data']['q017_runtime_dependency'] is False
          assert x['integrity']['historical_parity_verified'] is True
          assert x['integrity']['rebuilt_event_count']==30
          assert x['integrity']['rebuilt_events_sha256']=='ed5b0c4caff523525ecafb303e04dc82bc07d7d2fe706733edf4ce0180ecfd6e'
          assert len(x['screen']['top3'])==3
          assert x['schedule']['daily_watchlist_does_not_increment_validation_baskets'] is True
          print('PASS_V43_DAILY_ENGINE_ISOLATION_AND_PARITY')
          PY

      - name: Commit V43 namespace only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-v43-daily-bot'
          git config user.email 'hengce-v43-daily-bot@users.noreply.github.com'
          git add -A -- hengce/v43_daily
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'V43_NO_REPORT_CHANGES'
          else
            git commit -m "HENGCE V43 daily independent screen $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish feature-branch validation output
        if: steps.commit.outputs.changed == 'true' && github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish main output with V43-only lease
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        run: python scripts/hengce_v43_publish.py --target main

      - name: Upload daily report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-v43-daily-${{ github.run_id }}
          path: |
            hengce/v43_daily/latest.json
            hengce/v43_daily/LATEST_REPORT.md
            hengce/v43_daily/data_sync_latest.json
          if-no-files-found: warn
