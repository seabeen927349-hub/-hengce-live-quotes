name: HENGCE V43 Latest Signal Snapshot
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/v43_latest_signal_snapshot.py'
      - '.github/workflows/hengce-v43-latest-signal-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fixed V43 latest signal snapshot
        run: PYTHONPATH=. python research/codex_full_reset_20261023/v43_latest_signal_snapshot.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-v43-latest-signal-snapshot
          path: research/codex_full_reset_20261023/v43_latest_signal_snapshot_result.json
