name: HENGCE Recovery Fault Safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 openpyxl==3.1.5 PyYAML==6.0.3
      - name: Exact-base inventory and operational hard-lock integration
        run: |
          python -B tests/engineering/test_recovery_workflows.py
          python -B tests/engineering/test_q017_operational_boundary.py
      - name: Reproduce pinned pre-hardening gaps offline
        run: |
          set -euo pipefail
          python -B tests/engineering/test_recovery_base_characterization.py 2>&1 | tee "$RUNNER_TEMP/recovery-base-characterization.txt"
      - name: Twenty synthetic fault scenarios and existing safe publication
        run: |
          set -euo pipefail
          python -B tests/engineering/test_recovery_faults.py 2>&1 | tee "$RUNNER_TEMP/recovery-fault-scenarios.txt"
      - name: Preserve synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-recovery-fault-evidence
          path: |
            ${{ runner.temp }}/recovery-base-characterization.txt
            ${{ runner.temp }}/recovery-fault-scenarios.txt
          if-no-files-found: error
