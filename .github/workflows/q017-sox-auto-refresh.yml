name: Q017 SOX daily auto refresh

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-sox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - name: Refresh SOX and verify freshness
        run: python research/q017_sox_tw_electronics/refresh_sox_2026.py
      - name: Commit refreshed SOX only if changed
        run: |
          git config user.name 'hengce-sox-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/archive_2026/sox_2026.csv \
                  research/q017_sox_tw_electronics/archive_2026/nasdaq_sox_2026_raw.bin \
                  research/q017_sox_tw_electronics/archive_2026/sox_refresh_status.json
          if git diff --cached --quiet; then
            echo 'SOX unchanged'
          else
            git commit -m 'Auto refresh SOX 2026'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
