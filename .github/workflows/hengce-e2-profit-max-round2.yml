name: HENGCE E2 Profit Max Round2 Finite Search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/e2_profit_max/round2/run_round2_finite.py'
      - 'research/e2_profit_max/round2/input_shock/**'
      - 'research/e2_profit_max/macro/**'
      - '.github/workflows/hengce-e2-profit-max-round2.yml'

permissions:
  contents: write

jobs:
  finite-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and stage exact frozen payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          root=Path('research/e2_profit_max/round2/input_shock')
          p=root/'payload.json.gz.b64'
          b=p.read_bytes().strip()
          assert hashlib.sha256(b).hexdigest()=='e98cd47b64dc6df50ee3abd8b74b6ff8ae558a153581aeaca84148cc0da79d6d'
          raw=gzip.decompress(base64.b64decode(b))
          assert hashlib.sha256(raw).hexdigest()=='2a30a234a6370c4c93a5a9534485b33224cc53b547493b35390acc416842b2b8'
          obj=json.loads(raw); assert len(obj['r'])==152 and obj['core']=='rev1_no_teacher_K25_Top1'
          # Re-create the runner's three chunks from this verified single source.
          s=b.decode('ascii')
          for q in root.glob('r2shock_*.txt'): q.unlink()
          pieces=[s[:7000],s[7000:14000],s[14000:]]
          assert len(pieces)==3 and ''.join(pieces)==s
          for i,x in enumerate(pieces,1): (root/f'r2shock_{i:02}.txt').write_text(x,encoding='ascii')
          print('PASS ROUND2_PAYLOAD_SHA256 rows=152')
          PY
      - name: Run exactly 80 frozen combinations
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python research/e2_profit_max/round2/run_round2_finite.py | tee /tmp/e2_round2.log
          RC=${PIPESTATUS[0]}
          set -e
          test -s research/e2_profit_max/round2/round2_result.json
          test -s research/e2_profit_max/round2/train_grid_80.csv
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('research/e2_profit_max/round2')
          r=json.loads((p/'round2_result.json').read_text())
          assert r['search_space']['count']==80
          assert r['search_space']['frozen_signal_core']=='rev1_no_teacher_K25_Top1'
          assert r['search_space']['dynamic_exit_has_no_hard_max'] is True
          assert r['search_space']['macro_thresholds_not_optimized']=={'sox1_max':0.0,'sox5_max':-0.03,'dxy5_min':-0.005}
          assert r['capital_authority_twd']==0 and r['q017_mutated'] is False
          rows=list(csv.DictReader((p/'train_grid_80.csv').open()))
          assert len(rows)==80, len(rows)
          print('PASS E2_PROFIT_MAX_ROUND2_FINITE_GRID_80')
          print(json.dumps({'status':r['status'],'robust_count':r['robust_count'],'winner':r['winner'],'validation':r['validation'] and {k:v for k,v in r['validation'].items() if k!='events'}},ensure_ascii=False,indent=2))
          PY
          echo "research_rc=$RC (0=robust found, 2=no robust is a valid research outcome)"
      - name: Commit immutable research outputs
        shell: bash
        run: |
          set -euo pipefail
          # Discard the ephemeral re-split chunks; payload is the sole staged source.
          git checkout -- research/e2_profit_max/round2/input_shock/r2shock_01.txt research/e2_profit_max/round2/input_shock/r2shock_02.txt research/e2_profit_max/round2/input_shock/r2shock_03.txt
          git config user.name 'hengce-e2-research-bot'
          git config user.email 'hengce-e2-research-bot@users.noreply.github.com'
          git add research/e2_profit_max/round2/train_grid_80.csv research/e2_profit_max/round2/round2_result.json
          if [ -f research/e2_profit_max/round2/winner_validation_events.csv ]; then git add research/e2_profit_max/round2/winner_validation_events.csv; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HENGCE E2 profit-max round2 finite 80-combination result'
          python scripts/hengce_publish.py --profile conservative-all
      - uses: actions/upload-artifact@v4
        with:
          name: e2-profit-max-round2-finite-results
          path: |
            research/e2_profit_max/round2/train_grid_80.csv
            research/e2_profit_max/round2/round2_result.json
            research/e2_profit_max/round2/winner_validation_events.csv
          if-no-files-found: error

# manual trigger 2026-10-19: execute the already-frozen 80-combination round; no model changes.

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
