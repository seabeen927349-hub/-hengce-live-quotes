name: HENGCE TDCC OpenData Date Fast Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hengce-tdcc-opendata-date-fast-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fast official TDCC OpenData requested-date authenticity probe
        shell: python
        run: |
          import csv,hashlib,io,json,requests
          base='https://opendata.tdcc.com.tw/getOD.ashx'
          dates=['20250103','20250425','20250801','20251023','20251031','20251226','20260102']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 HENGCE-TDCC-FAST-DATE-PROBE/1.0'})
          for d in dates:
            for ticker in ('1101','2330'):
              try:
                r=s.get(base,params={'id':'1-5','dataDate':d,'securityId':ticker},timeout=20)
                raw=r.content
                rec={'requested':d,'ticker':ticker,'http':r.status_code,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'content_type':r.headers.get('content-type')}
                text=raw.decode('utf-8-sig',errors='strict')
                rows=list(csv.DictReader(io.StringIO(text)))
                keys=list(rows[0].keys()) if rows else []
                dk=next((k for k in keys if '資料日期' in k),None)
                sk=next((k for k in keys if '證券代號' in k),None)
                dates_ret=sorted({(x.get(dk) or '').strip() for x in rows}) if dk else []
                secs=sorted({(x.get(sk) or '').strip() for x in rows}) if sk else []
                rec.update({'rows':len(rows),'returned_dates':dates_ret,'returned_securities':secs,'date_exact':dates_ret==[d],'security_exact':secs==[ticker]})
              except Exception as e:
                rec={'requested':d,'ticker':ticker,'error':f'{type(e).__name__}:{e}'}
              print('FAST_DATE_PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
