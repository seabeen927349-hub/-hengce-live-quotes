name: HENGCE Nextday P90 Fixed Logit
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_p90_fixed_logit.py'
      - '.github/workflows/hengce-nextday-p90-fixed-logit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fixed P90 OOS next-day test
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_p90_fixed_logit.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/nextday_p90_fixed_logit_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-p90-fixed-logit
          path: |
            research/codex_full_reset_20261023/nextday_p90_fixed_logit_result.json
            research/codex_full_reset_20261023/nextday_p90_events.jsonl
