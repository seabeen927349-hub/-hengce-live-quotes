name: HENGCE Silergy 6415 Three-Year Validation

on:
  push:
    paths:
      - 'research/silergy_6415/**'
      - '.github/workflows/hengce-silergy-6415-3y.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run 6415 validation
        run: python research/silergy_6415/silergy_6415_sell_state_v1.py
      - name: Commit research outputs
        run: |
          git config user.name 'hengce-bot'
          git config user.email 'hengce-bot@users.noreply.github.com'
          git add research/silergy_6415/output_sell_v1
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'research: record 6415 three-year sell-state outputs'
            git push
          fi
