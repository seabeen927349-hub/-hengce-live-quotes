name: HENGCE Repricing State Novelty Static Tests

on:
  push:
    paths:
      - '.github/workflows/hengce-repricing-state-novelty-static-test.yml'
      - 'research/selection_core_rebuild/repricing_state_novelty_no_forward.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scipy==1.14.1
      - name: Compile and run synthetic no-forward unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/selection_core_rebuild/repricing_state_novelty_no_forward.py
          python - <<'PY'
          import hashlib, importlib.util, json, pathlib, sys
          p=pathlib.Path('research/selection_core_rebuild/repricing_state_novelty_no_forward.py')
          spec=importlib.util.spec_from_file_location('rsn',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)

          assert m.K == 5
          assert m.V43_CORR_FAIL == 0.90
          assert m.LEGACY_R2_FAIL == 0.80
          assert m.LEGACY_TURN_MIN == 20_000_000.0
          assert m.LEGACY_JUMP == 0.15
          assert m.FACTORS == ['resid_rev','mom20','skip5_60','liquidity','lowvol']

          r=m.midrank_open({'1001':1.0,'1002':1.0,'1003':3.0,'1004':4.0})
          assert 0 < min(r.values()) and max(r.values()) < 1
          assert r['1001'] == r['1002']
          assert r['1003'] < r['1004']

          pr=m.pct_rank_legacy({'1001':1.0,'1002':1.0,'1003':3.0})
          assert pr['1001'] == pr['1002'] and pr['1003'] == 1.0

          t86_obj={
            'stat':'OK',
            'fields':['證券代號','三大法人買賣超股數'],
            'data':[['2330','-1,234'],['2317','567']]
          }
          t86,meta=m.parse_t86_obj(t86_obj)
          assert t86 == {'2330':-1234.0,'2317':567.0}
          assert meta['value_field']=='三大法人買賣超股數'

          margin_obj={
            'stat':'OK',
            'fields':['股票代號','融資今日餘額'],
            'data':[['2330','1,234'],['2317','0']]
          }
          mg,meta2=m.parse_margin_obj(margin_obj)
          assert mg == {'2330':1234.0,'2317':0.0}
          assert meta2['value_field']=='融資今日餘額'

          src=p.read_text(encoding='utf-8')
          assert 'P97' not in src and 'P90' not in src and 'Bridge' not in src and 'Controlled Re-Leverage' not in src
          assert 'V43_CORR_FAIL = 0.90' in src
          assert 'LEGACY_R2_FAIL = 0.80' in src
          assert 'new_rs_forward_returns_opened' in src

          print(json.dumps({
            'status':'PASS',
            'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'synthetic_only':True,
            'forward_return_data_accessed':False,
            'constants':{'K':m.K,'v43_corr_fail':m.V43_CORR_FAIL,'legacy_r2_fail':m.LEGACY_R2_FAIL}
          },indent=2))
          PY
