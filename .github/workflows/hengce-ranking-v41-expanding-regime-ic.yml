name: HENGCE Ranking V41 Expanding Regime IC
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v41_expanding_regime_ic.py'
      - '.github/workflows/hengce-ranking-v41-expanding-regime-ic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V41 expanding regime IC
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v41_expanding_regime_ic.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v41_expanding_regime_ic_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v41-expanding-regime-ic
          path: |
            research/codex_full_reset_20261023/ranking_v41_expanding_regime_ic_result.json
            research/codex_full_reset_20261023/ranking_v41_events.jsonl
