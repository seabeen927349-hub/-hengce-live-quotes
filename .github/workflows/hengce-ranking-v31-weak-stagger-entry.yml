name: HENGCE Ranking V31 Weak Stagger Entry

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v31_weak_stagger_entry.py'
      - '.github/workflows/hengce-ranking-v31-weak-stagger-entry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V31 weak stagger entry
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v31_weak_stagger_entry.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v31_weak_stagger_entry_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v31-weak-stagger-entry
          path: |
            research/codex_full_reset_20261023/ranking_v31_weak_stagger_entry_result.json
            research/codex_full_reset_20261023/ranking_v31_events.jsonl
          if-no-files-found: error
