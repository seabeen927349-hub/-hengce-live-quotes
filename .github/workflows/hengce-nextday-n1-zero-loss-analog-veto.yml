name: HENGCE Nextday N1 Zero Loss Analog Veto
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_n1_zero_loss_analog_veto.py'
      - '.github/workflows/hengce-nextday-n1-zero-loss-analog-veto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run N1 zero-loss next-day analog veto
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_n1_zero_loss_analog_veto.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/nextday_n1_zero_loss_analog_veto_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-n1-zero-loss-analog-veto
          path: |
            research/codex_full_reset_20261023/nextday_n1_zero_loss_analog_veto_result.json
            research/codex_full_reset_20261023/nextday_n1_events.jsonl
