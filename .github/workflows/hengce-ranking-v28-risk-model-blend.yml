name: HENGCE Ranking V28 Risk Model Blend

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v28_risk_model_blend.py'
      - '.github/workflows/hengce-ranking-v28-risk-model-blend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V28 risk-model blend
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v28_risk_model_blend.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v28_risk_model_blend_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v28-risk-model-blend
          path: |
            research/codex_full_reset_20261023/ranking_v28_risk_model_blend_result.json
            research/codex_full_reset_20261023/ranking_v28_events.jsonl
          if-no-files-found: error
