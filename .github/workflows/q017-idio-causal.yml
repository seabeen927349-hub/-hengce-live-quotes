name: Q017 idio causal validation

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/idio_causal_2026.py'
      - '.github/workflows/q017-idio-causal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archives
        run: |
          test -s research/q017_sox_tw_electronics/archive_2026/twse_electronics_membership_2026.csv
          test -s research/q017_sox_tw_electronics/archive_2026/sox_2026.csv
          test -s research/q017_sox_tw_electronics/archive_2026/dxy_2026.csv
      - name: Run causal idio validation
        run: python research/q017_sox_tw_electronics/idio_causal_2026.py
      - name: Commit results
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/idio_causal_2026
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Validate Q017 idio filter causally'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
