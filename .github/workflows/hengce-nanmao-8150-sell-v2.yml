name: HENGCE Nanmao 8150 SELL State V2

on:
  push:
    paths:
      - 'research/nanmao_8150/nanmao_8150_sell_state_v2.py'
      - '.github/workflows/hengce-nanmao-8150-sell-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-sell-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run BUY-independent SELL validation
        run: python research/nanmao_8150/nanmao_8150_sell_state_v2.py
      - name: Commit research outputs
        run: |
          git config user.name 'hengce-bot'
          git config user.email 'hengce-bot@users.noreply.github.com'
          git add research/nanmao_8150/output_sell_v2
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'research: record 8150 sell-state v2 outputs'
            git push
          fi
