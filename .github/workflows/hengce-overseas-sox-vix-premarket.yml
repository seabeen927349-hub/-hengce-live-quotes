name: HENGCE Governed SOX VIX Premarket EOD

"on":
  pull_request:
    paths:
      - 'scripts/hengce_overseas_sox_vix_premarket_v1.py'
      - 'scripts/hengce_finmind_premarket_bridge.py'
      - 'tests/engineering/test_hengce_overseas_sox_vix_premarket.py'
      - 'tests/engineering/test_hengce_finmind_premarket_bridge.py'
      - '.github/workflows/hengce-overseas-sox-vix-premarket.yml'
      - '.github/workflows/hengce-finmind-premarket-shadow-bridge.yml'
  # Reuse already governed workflows as independent preopen wake-ups.
  # This adds no collector, market universe or data source.
  workflow_run:
    workflows:
      - HENGCE original EOD ingest
      - HENGCE HBA Daily Surveillance Research Sidecar
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = official-source download without publication; run = preopen governed publish'
        type: choice
        default: probe
        options:
          - probe
          - run
  schedule:
    # Use this original source workflow only. Early retries mitigate observed
    # 3h+ GitHub schedule latency; never waive the actual preopen/PIT guard.
    # If promptly executed before the latest US EOD is published, fail closed.
    - cron: '10 21 * * 0-4'  # Taipei 05:10 (earlier scheduled retry)
    - cron: '25 21 * * 0-4'  # Taipei 05:25 (earlier scheduled retry)
    - cron: '35 21 * * 0-4'  # Taipei 05:35 (earlier scheduled retry)
    - cron: '45 21 * * 0-4'  # Taipei 05:45
    - cron: '15 22 * * 0-4'  # Taipei 06:15
    - cron: '47 22 * * 0-4'  # Taipei 06:47 independent offset
    - cron: '15 23 * * 0-4'  # Taipei 07:15
    - cron: '39 23 * * 0-4'  # Taipei 07:39 independent offset
    - cron: '4 0 * * 1-5'    # Taipei 08:04
    - cron: '10 0 * * 1-5'   # Taipei 08:10
    - cron: '19 0 * * 1-5'   # Taipei 08:19 independent offset
    - cron: '30 0 * * 1-5'   # Taipei 08:30
    - cron: '41 0 * * 1-5'   # Taipei 08:41 final bounded retry

permissions:
  contents: write

concurrency:
  group: hengce-overseas-premarket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  overseas-eod:
    # workflow_run must come from an independent trusted main-branch schedule.
    # Never give a PR-triggered upstream run repository write privileges.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - name: Guard real Taipei preopen time and idempotent same-day receipt
        id: preopen_gate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'run')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os, sys
          sys.path.insert(0, "scripts")
          from hengce_overseas_sox_vix_premarket_v1 import MODEL, SOX_URL, VIX_URL, canonical
          now = datetime.now(ZoneInfo("Asia/Taipei"))
          # Delayed GitHub schedule events may observe official index closes
          # but MUST NOT backdate a preopen forecast.
          if now.weekday() >= 5:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("produce=false\nsource_only=false\n")
              print("NON_TW_TRADING_WEEKDAY_SKIP", now.isoformat())
              raise SystemExit(0)
          if now.hour >= 9:
              source = Path("overseas_premarket/source_status_postopen_latest.json")
              try:
                  obj = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {}
                  proof = obj.get("source_observation_sha256")
                  signed = canonical({k:v for k,v in obj.items() if k!="source_observation_sha256"})
                  done = (obj.get("target_tw_date")==now.date().isoformat()
                          and obj.get("observation_window")=="POST_OPEN_SOURCE_ONLY"
                          and obj.get("status")=="OFFICIAL_SOURCES_OBSERVED_NO_MODEL_AUTHORITY"
                          and obj.get("composite_forecast_emitted") is False
                          and obj.get("trading_authority") is False
                          and obj.get("capital_authority") is False and signed==proof)
              except (OSError,ValueError,TypeError,AttributeError):
                  done = False
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("produce=false\nsource_only="+("false" if done else "true")+"\n")
              print("POSTOPEN_SOURCE_ALREADY_VERIFIED" if done else
                    "POSTOPEN_OFFICIAL_SOURCE_CAPTURE_ONLY_NOT_FORECAST", now.isoformat())
              raise SystemExit(0)
          p = Path("overseas_premarket/latest.json")
          try:
              obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
              created = datetime.fromisoformat(obj["generated_at_taipei"]).astimezone(ZoneInfo("Asia/Taipei"))
              sources = obj["sources"]
              valid = (
                  obj.get("status") == "PASS_VERIFIED_VENDOR_EOD"
                  and obj.get("model") == MODEL
                  and obj.get("target_tw_date") == now.date().isoformat()
                  and created.date() == now.date() and created.hour < 9
                  and obj.get("packet_sha256") == canonical({k: v for k, v in obj.items() if k != "packet_sha256"})
                  and sources["sox"]["publisher"] == "Nasdaq"
                  and str(sources["sox"]["url"]).startswith(SOX_URL + "?")
                  and sources["vix"]["publisher"] == "Cboe"
                  and sources["vix"]["url"] == VIX_URL
              )
          except (OSError, ValueError, KeyError, TypeError, AttributeError):
              valid = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("produce=false\nsource_only=false\n" if valid else
                       "produce=true\nsource_only=false\n")
          print("ALREADY_PUBLISHED_VERIFIED_PREOPEN_PACKET" if valid else "PREOPEN_SOURCE_CAPTURE_ALLOWED", now.isoformat())
          PY
      - uses: actions/setup-python@v5
        if: steps.preopen_gate.outputs.produce != 'false' || steps.preopen_gate.outputs.source_only == 'true'
        with:
          python-version: '3.12'
      - name: Install vendor XLSX reader
        if: steps.preopen_gate.outputs.produce != 'false' || steps.preopen_gate.outputs.source_only == 'true'
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Regression, parser and PIT tests
        if: steps.preopen_gate.outputs.produce != 'false' || steps.preopen_gate.outputs.source_only == 'true'
        run: |
          python -m py_compile scripts/hengce_overseas_sox_vix_premarket_v1.py scripts/hengce_finmind_premarket_bridge.py
          python -m unittest discover -s tests/engineering -p 'test_hengce_overseas_sox_vix_premarket.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_finmind_premarket_bridge.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_two_time_scale_environment_display.py' -v
      - name: Verify both actual official vendor download endpoints
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        run: |
          python scripts/hengce_overseas_sox_vix_premarket_v1.py --mode probe
      - name: Produce current preopen vendor-verified packet
        if: steps.preopen_gate.outputs.produce == 'true'
        run: |
          python scripts/hengce_overseas_sox_vix_premarket_v1.py --mode run --out /tmp/hengce_sox_vix_premarket.json --observations-out /tmp/hengce_official_source_observations.json
      - name: Capture late official EOD sources without issuing a preopen forecast
        if: steps.preopen_gate.outputs.source_only == 'true'
        run: |
          python scripts/hengce_overseas_sox_vix_premarket_v1.py --mode late-source --observations-out /tmp/hengce_postopen_source_observations.json
      - name: Publish delayed independent official source observations on original governed route
        if: always() && github.ref == 'refs/heads/main' && steps.preopen_gate.outputs.source_only == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          src="/tmp/hengce_postopen_source_observations.json"
          if [ ! -s "$src" ]; then
            echo 'No verified postopen source observation was produced'
            exit 2
          fi
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json,sys
          sys.path.insert(0,"scripts")
          from hengce_overseas_sox_vix_premarket_v1 import canonical
          p=Path('/tmp/hengce_postopen_source_observations.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          signature=obj.get('source_observation_sha256')
          signed={k:v for k,v in obj.items() if k!='source_observation_sha256'}
          taipei=ZoneInfo('Asia/Taipei')
          now=datetime.now(taipei)
          stamp=datetime.fromisoformat(obj['observed_at_taipei']).astimezone(taipei)
          assert obj['schema']=='HENGCE_OVERSEAS_SOURCE_OBSERVATION_V1'
          assert obj['status']=='OFFICIAL_SOURCES_OBSERVED_NO_MODEL_AUTHORITY'
          assert obj['observation_window']=='POST_OPEN_SOURCE_ONLY'
          assert obj['composite_readiness']=='POST_OPEN_SOURCE_ONLY_NO_PREOPEN_FORECAST'
          assert signature==canonical(signed)
          assert obj['target_tw_date']==now.date().isoformat()
          assert stamp.date()==now.date() and stamp.hour>=9
          assert obj['composite_forecast_emitted'] is False
          assert obj['trading_authority'] is False and obj['capital_authority'] is False
          for key,publisher in (('sox','Nasdaq'),('vix','Cboe')):
              leg=obj['sources'][key]
              assert leg['publisher']==publisher
              assert leg['latest_close']>0 and leg['prior_close']>0
              assert len(leg['raw_sha256'])==64
          root=Path('overseas_premarket')
          root.mkdir(parents=True,exist_ok=True)
          out=root/'source_status_postopen_latest.json'
          hist=root/'history'/'source_observation_postopen'/f"{now:%Y%m%d}_{signature[:16]}.json"
          hist.parent.mkdir(parents=True,exist_ok=True)
          raw=p.read_bytes()
          if hist.exists():
              assert hist.read_bytes()==raw,'IMMUTABLE_POSTOPEN_SOURCE_OBSERVATION_CONFLICT'
          else:
              hist.write_bytes(raw)
          out.write_bytes(raw)
          Path('/tmp/hengce_postopen_source_history_path').write_text(str(hist))
          PY
          git config user.name 'hengce-overseas-eod-bot'
          git config user.email 'hengce-overseas-eod-bot@users.noreply.github.com'
          git add overseas_premarket/source_status_postopen_latest.json "$(cat /tmp/hengce_postopen_source_history_path)"
          if git diff --cached --quiet; then
            echo 'No changed postopen source observation'
            exit 0
          fi
          git commit -m 'data(shadow): late independent official SOX/VIX closes without forecast'
          python scripts/hengce_publish.py --profile conservative-all --report-dir "${RUNNER_TEMP}/hengce-publication"
      - name: Publish overseas shadow with exact lease
        if: github.ref == 'refs/heads/main' && steps.preopen_gate.outputs.produce == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/hengce_sox_vix_premarket.json ]; then
            echo 'BLOCKED: no valid overseas packet to publish'
            exit 2
          fi
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/hengce_sox_vix_premarket.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          assert obj['status']=='PASS_VERIFIED_VENDOR_EOD'
          target=obj['target_tw_date'].replace('-','')
          rec=obj['packet_sha256'][:16]
          out=Path('overseas_premarket/latest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(p.read_bytes())
          hist=Path('overseas_premarket/history')/f'{target}_{rec}.json'
          hist.parent.mkdir(parents=True,exist_ok=True)
          if hist.exists():
              assert hist.read_bytes()==p.read_bytes(), 'IMMUTABLE_OVERSEAS_RECEIPT_CONFLICT'
          else:
              hist.write_bytes(p.read_bytes())
          Path('/tmp/hengce_overseas_history_path').write_text(str(hist))
          PY
          git config user.name 'hengce-overseas-eod-bot'
          git config user.email 'hengce-overseas-eod-bot@users.noreply.github.com'
          git add overseas_premarket/latest.json "$(cat /tmp/hengce_overseas_history_path)"
          if git diff --cached --quiet; then
            echo 'Identical packet: no publication'
            exit 0
          fi
          git commit -m 'data(shadow): governed SOX/VIX official-source EOD preopen packet'
          python scripts/hengce_publish.py --profile conservative-all --report-dir "${RUNNER_TEMP}/hengce-publication"
      - name: Preserve independent official SOX and VIX preopen observations
        # Even when the combined predictor is blocked by a delayed VIX file,
        # show the verified individual vendor download dates and index closes.
        # Preserve failed producer status (not a successful composite signal).
        if: always() && github.ref == 'refs/heads/main' && steps.preopen_gate.outputs.produce == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          src="/tmp/hengce_official_source_observations.json"
          if [ ! -s "$src" ]; then
            echo "No official-source observation receipt captured"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import hashlib,json,sys
          sys.path.insert(0, "scripts")
          from hengce_overseas_sox_vix_premarket_v1 import canonical
          obj=json.loads(Path('/tmp/hengce_official_source_observations.json').read_text())
          check=dict(obj);signature=check.pop('source_observation_sha256',None)
          now=datetime.now(ZoneInfo("Asia/Taipei"))
          observed=datetime.fromisoformat(obj['observed_at_taipei']).astimezone(ZoneInfo("Asia/Taipei"))
          assert obj.get('schema')=='HENGCE_OVERSEAS_SOURCE_OBSERVATION_V1'
          assert obj.get('status')=='OFFICIAL_SOURCES_OBSERVED_NO_MODEL_AUTHORITY'
          assert signature==canonical(check)
          assert obj.get('target_tw_date')==now.date().isoformat()
          assert observed.date()==now.date() and observed.hour<9
          assert obj.get('trading_authority') is False and obj.get('capital_authority') is False
          assert obj.get('composite_forecast_emitted') is False
          for key,publisher in (('sox','Nasdaq'),('vix','Cboe')):
              leg=obj['sources'][key]
              assert leg['publisher']==publisher and len(leg['raw_sha256'])==64
              assert leg['latest_close']>0 and leg['prior_close']>0
          root=Path('overseas_premarket')
          root.mkdir(parents=True,exist_ok=True)
          latest=root/'source_status_latest.json'
          hist=root/'history'/'source_observation'/f"{now.strftime('%Y%m%d')}_{signature[:16]}.json"
          hist.parent.mkdir(parents=True,exist_ok=True)
          raw=Path('/tmp/hengce_official_source_observations.json').read_bytes()
          if hist.exists():
              assert hist.read_bytes()==raw,'IMMUTABLE_SOURCE_OBSERVATION_CONFLICT'
          else:
              hist.write_bytes(raw)
          latest.write_bytes(raw)
          Path('/tmp/hengce_official_source_observation_hist').write_text(str(hist))
          PY
          git config user.name 'hengce-overseas-eod-bot'
          git config user.email 'hengce-overseas-eod-bot@users.noreply.github.com'
          git add overseas_premarket/source_status_latest.json "$(cat /tmp/hengce_official_source_observation_hist)"
          if git diff --cached --quiet; then
            echo 'Unchanged official source observations'
            exit 0
          fi
          git commit -m 'data(shadow): source-aligned SOX and VIX individual official EOD observations'
          python scripts/hengce_publish.py --profile conservative-all --report-dir "${RUNNER_TEMP}/hengce-publication"
      - name: Save guarded publisher receipts
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hengce-sox-vix-source-publication
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
          retention-days: 10
