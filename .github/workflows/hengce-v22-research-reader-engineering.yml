name: HENGCE V2.2 research receipt reader engineering safety
"on":
  pull_request:
    paths:
      - 'scripts/hengce_scan_once_router.py'
      - 'scripts/hengce_v22d_daily_reader.py'
      - 'research/retail_top5/HENGCE_V22D_ORIGINAL_MODEL_CHECKPOINT_PROVENANCE_20261111.json'
      - 'research/retail_top5/v22d_atr_historical_replay_20261111.json'
      - 'tests/engineering/test_hengce_v22d_checkpoint_provenance.py'
      - 'scripts/hengce_v22d_max5_operations.py'
      - 'scripts/hengce_v22d_existing_canonical_atr.py'
      - 'tests/engineering/test_hengce_v22d_existing_canonical_atr.py'
      - 'tests/engineering/test_hengce_v22d_max5_operations.py'
      - 'hengce/HENGCE_SELECTION_MODEL_CHOICE_LATEST.json'
      - 'research/retail_top5/v22d_historical_20261105.json'
      - 'tests/engineering/test_hengce_v22d_primary_switch.py'
      - 'scripts/hengce_v22_max5_atr_price_plan.py'
      - 'governance/HENGCE_V22_ATR_MAX5_PRICE_PLAN_RESEARCH_v1_20261111.json'
      - 'tests/engineering/test_hengce_v22_max5_atr_price_plan.py'
      - 'scripts/hengce_scan_consistency.py'
      - 'governance/HENGCE_SCAN_ONCE_CONSISTENCY_LOCK_v1_0_20261111.json'
      - 'tests/engineering/test_hengce_scan_consistency.py'
      - 'tests/fixtures/v22_screen_replay_20261106_historical_no_authority.json'
      - 'tests/engineering/test_hengce_v22_scan_research_observation.py'
      - '.github/workflows/hengce-v22-research-reader-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reader-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test replay provenance and fail-closed scan with research-only publication
        run: |
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22_scan_research_observation.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22_max5_atr_price_plan.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22d_primary_switch.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22d_checkpoint_provenance.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22d_max5_operations.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_v22d_existing_canonical_atr.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_retail_top5_readiness.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_scan_consistency.py' -v
          python -m py_compile scripts/hengce_scan_once_router.py scripts/hengce_scan_consistency.py scripts/hengce_v22_max5_atr_price_plan.py scripts/hengce_v22d_daily_reader.py scripts/hengce_v22d_max5_operations.py scripts/hengce_v22d_existing_canonical_atr.py
      - name: Check formal scan no-signal boundary with historical or weekly research receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from scripts.hengce_scan_once_router import report
          result=report(datetime(2026,11,10,21,29,tzinfo=ZoneInfo('Asia/Taipei')),Path('.'))
          assert result['status']=='NO_ACTIVE_SELECTION_STRATEGY'
          assert result['rows']==[] and result['reporting']['top10']==[]
          assert result['broker_order_execution'] is False
          assert result['reporting']['action_card']['status']=='NO_BUY'
          observation=result['reporting']['v22_research_top5']
          assert observation['status'] in (
              'HISTORICAL_RESEARCH_TOP5_VERIFIED',
              'WEEKLY_RESEARCH_TOP5_READY',
              'STALE_WEEKLY_RESEARCH_TOP5',
              'NO_QUALIFIED_WEEKLY_RESEARCH_STOCKS',
          )
          assert len(observation['top5'])<=5 and observation['authorized_lots']==0
          assert observation['formal_selection_authority'] is False
          assert observation['buy_signal'] is False and observation['broker_execution'] is False
          print('RESEARCH_VIEWER_READS_EXISTING_RESEARCH_WITH_NO_TRADING_AUTHORITY_PASS')
          PY
