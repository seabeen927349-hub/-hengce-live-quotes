name: HENGCE E2 Round2 Macro Flags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-e2-round2-macro-flags.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build causal macro flags for frozen 152 dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from datetime import datetime
          from pathlib import Path
          dates='''2023-03-13,2023-03-14,2023-03-16,2023-04-21,2023-04-25,2023-05-11,2023-05-15,2023-06-27,2023-07-12,2023-07-24,2023-08-08,2023-08-09,2023-08-10,2023-08-14,2023-09-21,2023-09-26,2023-10-18,2023-10-20,2023-10-23,2023-10-31,2023-12-21,2024-01-08,2024-01-09,2024-01-10,2024-03-08,2024-03-13,2024-03-14,2024-04-15,2024-04-16,2024-04-18,2024-04-19,2024-04-22,2024-06-05,2024-06-11,2024-07-19,2024-07-22,2024-07-26,2024-07-29,2024-08-02,2024-08-05,2024-08-06,2024-08-08,2024-09-04,2024-09-05,2024-09-10,2024-10-04,2024-10-08,2024-10-09,2024-10-11,2024-10-29,2024-10-30,2024-11-04,2024-11-13,2024-11-14,2024-11-18,2024-11-20,2024-11-28,2024-12-11,2024-12-12,2024-12-13,2024-12-16,2024-12-19,2025-01-02,2025-01-03,2025-01-09,2025-01-10,2025-01-13,2025-01-15,2025-03-03,2025-03-06,2025-03-07,2025-03-11,2025-03-13,2025-03-27,2025-03-28,2025-03-31,2025-04-07,2025-04-08,2025-04-09,2025-04-22,2025-05-07,2025-05-28,2025-06-02,2025-06-19,2025-06-20,2025-06-23,2025-07-08,2025-07-10,2025-08-20,2025-08-22,2025-09-02,2025-09-15,2025-09-26,2025-10-01,2025-10-02,2025-10-14,2025-10-17,2025-10-30,2025-11-04,2025-11-05,2025-11-07,2025-11-10,2025-11-17,2025-11-18,2025-11-19,2025-11-21,2026-01-30,2026-02-02,2026-02-05,2026-02-06,2026-03-04,2026-03-09,2026-03-23,2026-03-24,2026-03-26,2026-03-27,2026-03-31,2026-04-02,2026-04-24,2026-04-27,2026-05-14,2026-05-15,2026-05-19,2026-06-08,2026-06-10,2026-06-11,2026-06-16,2026-06-26,2026-07-01,2026-07-07,2026-07-08,2026-07-09,2026-07-13,2026-07-14,2026-07-16,2026-07-17,2026-07-20,2026-07-23,2026-07-28,2026-07-29,2026-07-30,2026-08-18,2026-08-19,2026-08-21,2026-08-24,2026-09-03,2026-09-08,2026-09-11,2026-09-14,2026-09-15,2026-10-13,2026-10-15'''.split(',')
          assert len(dates)==152 and len(set(dates))==152
          root=Path('research/e2_profit_max/macro')
          def load(p):
              z=[]
              with p.open(encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      z.append((r['date'],float(r['ret1']) if r['ret1'] else None,float(r['ret5']) if r['ret5'] else None))
              return z
          sox=load(root/'sox_daily_202212_202610.csv'); dxy=load(root/'dxy_exact_DX-Y.NYB_202212_202610.csv')
          def prior(arr,ds):
              q=None
              for r in arr:
                  if r[0]>=ds: break
                  q=r
              return q
          out=Path('/tmp/e2_round2_macro_flags.csv')
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['signal_date','sox_session','sox1','sox5','dxy_session','dxy5','sox1_ok','sox5_ok','dxy5_ok'])
              for ds in dates:
                  s=prior(sox,ds); x=prior(dxy,ds)
                  assert s and x and s[0]<ds and x[0]<ds
                  w.writerow([ds,s[0],s[1],s[2],x[0],x[2],int(s[1] is not None and s[1]<=0),int(s[2] is not None and s[2]<=-0.03),int(x[2] is not None and x[2]>=-0.005)])
          print('PASS rows=152')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e2-round2-macro-flags
          path: /tmp/e2_round2_macro_flags.csv
          if-no-files-found: error
