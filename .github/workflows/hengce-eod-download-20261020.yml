name: HENGCE EOD download 20261020

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-eod-download-20261020.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Self-test original-vessel ingest
        run: |
          set -euo pipefail
          python scripts/hengce_eod_incremental_ingest.py --mode self-test
          python scripts/test_hengce_eod_original_vessel_incremental.py

      - name: Download official 2026-10-20 three-leg data
        run: |
          set -euo pipefail
          python scripts/hengce_eod_incremental_ingest.py --mode ingest --date 2026-10-20 | tee /tmp/eod_20261020.json
          cat eod/20261020/status.json

      - name: Upload downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-eod-20261020-three-leg
          path: eod/20261020/
          if-no-files-found: error
          retention-days: 30

      - name: Commit original-vessel EOD data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-eod-bot'
          git config user.email 'hengce-eod-bot@users.noreply.github.com'
          git add eod/20261020/ || true
          if git diff --cached --quiet; then
            echo 'No EOD changes to commit.'
            exit 0
          fi
          git commit -m 'HENGCE EOD 2026-10-20 original-vessel incremental ingest'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
