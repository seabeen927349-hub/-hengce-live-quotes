name: HENGCE E2 Profit Max Live

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Optional Taipei trade date YYYY-MM-DD; blank = current Taipei date'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_e2_live.py'
      - 'scripts/hengce_dual_engine_display.py'
      - 'scripts/test_hengce_e2_no_fill.py'
      - 'scripts/test_hengce_e2_morning_release.py'
      - 'hengce/e2_live/execution_override.json'
      - 'hengce/E2_PROFIT_MAX_DISPLAY_EXECUTION_LOCK_v1_0_20261019.json'
      - '.github/workflows/hengce-e2-profit-max-live.yml'
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '10 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-e2-profit-max-live
  cancel-in-progress: false

jobs:
  e2-postclose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Resolve Taipei trade date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.trade_date || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE="$(TZ=Asia/Taipei date +%F)"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "TARGET_DATE=$TARGET_DATE"

      - name: E2 profit-max self-test
        run: python scripts/hengce_e2_live.py --mode self-test --date '${{ steps.date.outputs.target_date }}'

      - name: E2 no-fill execution-state regressions
        run: |
          PYTHONPATH=scripts python scripts/test_hengce_e2_no_fill.py
          PYTHONPATH=scripts python scripts/test_hengce_e2_morning_release.py

      - name: Recovery admission from clean current remote
        env:
          HENGCE_REQUEST_DATE: ${{ inputs.trade_date || '' }}
          HENGCE_REQUEST_MODE: postclose
        run: python scripts/hengce_recovery_transaction.py prepare --lane e2-postclose --mode "$HENGCE_REQUEST_MODE"

      - name: Refresh E2 profit-max postclose state
        run: |
          python scripts/hengce_recovery_transaction.py fence --scope e2-postclose
          python scripts/hengce_e2_live.py --mode postclose --date '${{ steps.date.outputs.target_date }}'

      - name: Validate E2 display output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('hengce/e2_live/state_latest.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['module']=='E2_PROFIT_MAX_STATE', x
          assert x['engine']=='E2_PROFIT_MAX', x
          assert x['binding_status']=='PASS', x
          assert x['engine_status'] in {'ON','OFF','HOLDING','EXIT','NO_FILL'}, x
          assert x['authority']=='VALIDATED_RESEARCH_SIGNAL_DISPLAY', x
          assert x['capital_authority_twd']==0, x
          assert x['broker_order_execution'] is False, x
          assert x['rules']['K']==25.0 and x['rules']['top_n']==1, x
          assert x['rules']['hold_intervals']==20 and x['rules']['dxy_used'] is False, x
          assert x['rules']['no_fill_policy']=='EXPLICIT_MATCHED_OVERRIDE_RELEASES_NEXT_SESSION_SLOT_NO_SAME_SESSION_HINDSIGHT', x
          assert 'local_gate' in x and 'macro_gate' in x and 'strict' in x and 'position_state' in x, x
          if x['engine_status']=='NO_FILL':
              assert x['paper_position']['state']=='NO_FILL', x
              assert x['paper_position']['slot_released'] is True, x
              assert x['position_state']['occupied_next_session']==0, x
              assert x['position_state']['free_slots_next_session']==1, x
          print('PASS E2_PROFIT_MAX_LIVE_DISPLAY', x['signal_asof'], x['engine_status'], x['action'])
          if x.get('top1'):
              t=x['top1']; print('TOP1',t['ticker'],t.get('name',''),'score=',t['score'],'residual=',t['residual'])
          print('LOCAL_GATE',x['local_gate'])
          print('MACRO_GATE',x['macro_gate'])
          print('PAPER_POSITION',x['paper_position'])
          print('EXECUTION_OVERRIDE',x.get('execution_override'))
          PY

      - name: Build unified Q017 plus E2 display
        run: |
          python scripts/hengce_recovery_transaction.py fence --scope display
          python scripts/hengce_dual_engine_display.py

      - name: Validate dual-engine display
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('hengce/dual_engine/latest.json'))
          assert x['architecture']=='DUAL_ENGINE'
          assert x['rankings_separate'] is True
          assert x['q017']['engine']=='Q017'
          assert x['e2']['engine']=='E2_PROFIT_MAX'
          assert x['e2']['research_capital_twd']==3000000
          assert x['e2']['broker_order_execution'] is False
          print('PASS HENGCE_DUAL_ENGINE_DISPLAY', x['q017']['status'], x['e2']['status'], x['e2']['action'])
          PY

      - name: Commit E2 state and required causal data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-e2-live-bot'
          git config user.email 'hengce-e2-live-bot@users.noreply.github.com'
          git add -A hengce/e2_live/ hengce/dual_engine/
          for p in \
            hengce/q017_radar/data/twse_electronics_history_2026.csv \
            hengce/q017_radar/data/sox_2026.csv \
            hengce/q017_radar/data/sox_status.json \
            hengce/q017_radar/data/data_status.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo 'E2 and dual-engine display already current.'
            exit 0
          fi
          python scripts/hengce_recovery_transaction.py stage
          git commit -m "HENGCE E2 profit-max postclose ${{ steps.date.outputs.target_date }}"
          python scripts/hengce_publish.py --profile conservative-all --transaction-lane e2-postclose

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
