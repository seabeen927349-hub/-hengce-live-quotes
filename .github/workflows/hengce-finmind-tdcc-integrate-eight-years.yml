name: HENGCE TDCC 2018-2025 FinMind Big400 Big1000 Weekly Research Panel
"on":
  push:
    branches: [research/tdcc-finmind-historical-backfill-20261107]
    paths: [.github/workflows/hengce-finmind-tdcc-integrate-eight-years.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-weekly-research-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch checksum-verified year 2018 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2018
          run-id: 42361237687
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2018
      - name: Fetch checksum-verified year 2019 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2019
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2019
      - name: Fetch checksum-verified year 2020 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2020
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2020
      - name: Fetch checksum-verified year 2021 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2021
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2021
      - name: Fetch checksum-verified year 2022 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2022
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2022
      - name: Fetch checksum-verified year 2023 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2023-repair
          run-id: 42362132686
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2023
      - name: Fetch checksum-verified year 2024 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2024
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2024
      - name: Fetch checksum-verified year 2025 (research artifact)
        uses: actions/download-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2025
          run-id: 42361361615
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/hengce-finmind-yearly/2025
      - name: Compile historical tier panel builder
        run: python -m py_compile scripts/hengce_finmind_tdcc_consolidate_history.py
      - name: Validate source manifests and build 2018-2025 Big400 / Big1000 weekly panel
        run: |
          python scripts/hengce_finmind_tdcc_consolidate_history.py \
            --input-root /tmp/hengce-finmind-yearly \
            --out /tmp/hengce-tdcc-weekly-2018-2025
      - name: Preserve licensed aggregate only for private Library import
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-tdcc-eight-year-research-panel
          path: /tmp/hengce-tdcc-weekly-2018-2025/
          retention-days: 1
          if-no-files-found: error
