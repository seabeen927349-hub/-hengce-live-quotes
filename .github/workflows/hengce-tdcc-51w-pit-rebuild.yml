name: HENGCE TDCC 51W PIT rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-tdcc-51w-pit-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-tdcc-51w:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone public TDCC raw archive
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/wirelessr/tdcc-opendata-archive.git /tmp/tdcc-archive
      - name: Collect and validate requested 51 weeks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, hashlib, json, shutil, zipfile
          from pathlib import Path

          DATES='''20261008 20261002 20260924 20260918 20260911 20260904 20260828 20260821 20260814 20260807 20260731 20260724 20260717 20260709 20260703 20260626 20260618 20260612 20260605 20260529 20260522 20260515 20260508 20260430 20260424 20260417 20260410 20260402 20260327 20260320 20260313 20260306 20260226 20260213 20260206 20260130 20260123 20260116 20260109 20260102 20251226 20251219 20251212 20251205 20251128 20251121 20251114 20251107 20251031 20251023 20251017'''.split()
          assert len(DATES)==51 and len(set(DATES))==51
          SRC=Path('/tmp/tdcc-archive/snapshots')
          OUT=Path('tdcc_51w_raw'); OUT.mkdir(exist_ok=True)
          required=['資料日期','證券代號','持股分級','人數','股數','占集保庫存數比例%']
          weeks=[]; missing=[]; invalid=[]
          for d in DATES:
              iso=f'{d[:4]}-{d[4:6]}-{d[6:8]}'
              p=SRC/d[:4]/f'{iso}.csv'
              if not p.exists():
                  missing.append(d); continue
              try:
                  with p.open('r',encoding='utf-8-sig',newline='') as f:
                      r=csv.DictReader(f)
                      if r.fieldnames!=required:
                          raise ValueError(f'BAD_HEADER:{r.fieldnames}')
                      rows=list(r)
                  if len(rows)<5000: raise ValueError(f'ROW_COUNT_TOO_SMALL:{len(rows)}')
                  dates={str(x['資料日期']).strip() for x in rows}
                  if dates!={d}: raise ValueError(f'DATE_MISMATCH:{sorted(dates)[:5]}')
                  levels={int(str(x['持股分級']).strip()) for x in rows if str(x['持股分級']).strip().isdigit()}
                  if not set(range(1,16)).issubset(levels): raise ValueError(f'LEVELS_INCOMPLETE:{sorted(levels)}')
                  if min(levels)<1 or max(levels)>17: raise ValueError(f'LEVEL_RANGE:{min(levels)}..{max(levels)}')
                  dst=OUT/f'{d}.csv'; shutil.copy2(p,dst)
                  sha=hashlib.sha256(dst.read_bytes()).hexdigest()
                  tickers=len({str(x['證券代號']).strip() for x in rows})
                  weeks.append({'date':d,'rows':len(rows),'tickers':tickers,'levels':sorted(levels),'sha256':sha,'source_repo':'wirelessr/tdcc-opendata-archive','source_path':str(p.relative_to('/tmp/tdcc-archive'))})
                  print(f'{d} OK rows={len(rows)} tickers={tickers} sha={sha[:12]}')
              except Exception as e:
                  invalid.append({'date':d,'error':f'{type(e).__name__}:{e}'})
                  print(f'{d} INVALID {type(e).__name__}:{e}')
          status='COMPLETE' if len(weeks)==51 and not missing and not invalid else 'PARTIAL_VERIFIED'
          manifest={'system':'HENGCE','artifact':'TDCC_51W_PIT_RAW_ARCHIVE_COLLECT','status':status,'required_week_count':51,'verified_week_count':len(weeks),'missing_dates':missing,'invalid_dates':invalid,'requested_dates':DATES,'weeks':weeks,'policy':'PARTIAL_MAY_BE_USED_FOR_RESEARCH_EXPANSION__FULL_YEAR_COMPLETION_REQUIRES_51_OF_51','source':'https://github.com/wirelessr/tdcc-opendata-archive'}
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with zipfile.ZipFile('tdcc-51w-archive-collect.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(OUT.iterdir()): z.write(p,p.as_posix())
          print(json.dumps({'status':status,'verified':len(weeks),'missing':len(missing),'invalid':len(invalid)},ensure_ascii=False))
          PY
      - name: Upload verified archive collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdcc-51w-archive-collect
          path: |
            tdcc-51w-archive-collect.zip
            tdcc_51w_raw/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Full-year completion gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('tdcc_51w_raw/manifest.json',encoding='utf-8'))
          if x['status']!='COMPLETE':
              raise SystemExit(f"FULL_YEAR_INCOMPLETE verified={x['verified_week_count']}/51 missing={len(x['missing_dates'])} invalid={len(x['invalid_dates'])}")
          print('FULL_YEAR_COMPLETE 51/51')
          PY
