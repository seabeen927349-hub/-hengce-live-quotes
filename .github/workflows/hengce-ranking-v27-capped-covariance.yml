name: HENGCE Ranking V27 Capped Covariance

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v27_capped_covariance.py'
      - '.github/workflows/hengce-ranking-v27-capped-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V27 capped covariance
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v27_capped_covariance.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v27_capped_covariance_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v27-capped-covariance
          path: |
            research/codex_full_reset_20261023/ranking_v27_capped_covariance_result.json
            research/codex_full_reset_20261023/ranking_v27_champion_events.jsonl
          if-no-files-found: error
