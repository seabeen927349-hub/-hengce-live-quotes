name: HENGCE TDCC FinMind Full-Market 2023 Validated Repair
"on":
  push:
    branches: [research/tdcc-finmind-historical-backfill-20261107]
    paths: [.github/workflows/hengce-finmind-tdcc-fullmarket-2023-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rearchive-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify research collector and strict tier validation
        run: python -m py_compile scripts/hengce_finmind_tdcc_historical_backfill.py scripts/hengce_finmind_tdcc_marketwide_year.py
      - name: Recover all 2023 FinMind TDCC weekly snapshots with non-tier metadata separated
        run: |
          python scripts/hengce_finmind_tdcc_marketwide_year.py \
            --year 2023 \
            --out /tmp/hengce-tdcc-finmind-2023-repair
      - name: Save complete verified output for private Library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-2023-repair
          path: /tmp/hengce-tdcc-finmind-2023-repair/
          if-no-files-found: error
          retention-days: 1
