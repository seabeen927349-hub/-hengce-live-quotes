name: HENGCE Ranking V29 Prior Vol Target

on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v29_prior_vol_target.py'
      - '.github/workflows/hengce-ranking-v29-prior-vol-target.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V29 prior-only vol target
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v29_prior_vol_target.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v29_prior_vol_target_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v29-prior-vol-target
          path: |
            research/codex_full_reset_20261023/ranking_v29_prior_vol_target_result.json
            research/codex_full_reset_20261023/ranking_v29_events.jsonl
          if-no-files-found: error
