name: HENGCE TDCC 2026 Jan-Apr Full-Market Backfill

on:
  push:
    paths:
      - '.github/workflows/hengce-tdcc-2026-jan-apr-backfill-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hengce-tdcc-2026-jan-apr-backfill-fast-v2
  cancel-in-progress: true

jobs:
  fetch:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        refdate:
          - '20260102'
          - '20260109'
          - '20260116'
          - '20260123'
          - '20260130'
          - '20260206'
          - '20260213'
          - '20260226'
          - '20260306'
          - '20260313'
          - '20260320'
          - '20260327'
          - '20260402'
          - '20260410'
          - '20260417'
          - '20260424'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas lxml
      - name: Run full-market validated HENGCE TDCC historical vessel
        run: python scripts/hengce_tdcc_2026_jan_apr_backfill.py --date '${{ matrix.refdate }}' --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdcc-full-${{ matrix.refdate }}
          path: ownership/tdcc/backfill_candidate/full_market_2026_jan_apr/${{ matrix.refdate }}/
          retention-days: 30

  promote:
    needs: fetch
    if: ${{ always() && needs.fetch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tdcc-full-*
          path: ownership/tdcc/backfill_candidate/full_market_2026_jan_apr
      - name: Normalize artifact directories
        shell: bash
        run: |
          set -euo pipefail
          for p in ownership/tdcc/backfill_candidate/full_market_2026_jan_apr/tdcc-full-*; do
            [ -d "$p" ] || continue
            d="${p##*-}"
            mkdir -p "ownership/tdcc/backfill_candidate/full_market_2026_jan_apr/$d"
            cp -a "$p"/. "ownership/tdcc/backfill_candidate/full_market_2026_jan_apr/$d/"
            rm -rf "$p"
          done
      - name: Full-market integrity gate and aggregate
        shell: python
        run: |
          import csv,hashlib,json,pathlib,sys
          root=pathlib.Path('ownership/tdcc/backfill_candidate/full_market_2026_jan_apr')
          dates=['20260102','20260109','20260116','20260123','20260130','20260206','20260213','20260226','20260306','20260313','20260320','20260327','20260402','20260410','20260417','20260424']
          rows=[]; date_counts={}; no_data_counts={}; bad=[]
          for d in dates:
              p=root/d/'manifest.json'
              if not p.exists():
                  bad.append([d,'MISSING_MANIFEST']); continue
              m=json.loads(p.read_text())
              if m.get('status')!='COMPLETE' or m.get('candidate_rows')!=3091 or m.get('resolved_candidates')!=3091 or m.get('invalid_rows')!=0:
                  bad.append([d,'MANIFEST_GATE',m]); continue
              with (root/d/'tdcc_ownership_4d.csv').open(encoding='utf-8',newline='') as f:
                  x=list(csv.DictReader(f))
              with (root/d/'explicit_no_data.csv').open(encoding='utf-8',newline='') as f:
                  nd=list(csv.DictReader(f))
              if len(x)!=m['valid_rows'] or len(nd)!=m['explicit_no_data_rows'] or len(x)+len(nd)!=3091:
                  bad.append([d,'ROW_COUNT_GATE',len(x),len(nd),m]); continue
              seen={r['Ticker'] for r in x}|{r['Ticker'] for r in nd}
              if len(seen)!=3091:
                  bad.append([d,'CANDIDATE_RESOLUTION_DUP_OR_MISSING',len(seen)]); continue
              for r in x:
                  try:
                      b400=float(r['Big400Pct']); b1000=float(r['Big1000Pct'])
                  except Exception:
                      bad.append([d,'BAD_PCT_PARSE',r.get('Ticker')]); break
                  if not (0<=b1000<=b400<=100):
                      bad.append([d,'BAD_PCT_RANGE',r.get('Ticker'),b400,b1000]); break
              else:
                  date_counts[d]=len(x); no_data_counts[d]=len(nd); rows.extend(x); continue
              continue
          if bad:
              print(json.dumps(bad,ensure_ascii=False,indent=2)); sys.exit(2)
          keys={(r['SnapshotDate'],r['Ticker']) for r in rows}
          if len(keys)!=len(rows): raise SystemExit('DUPLICATE_SNAPSHOT_TICKER_KEYS')
          out=root/'tdcc_2026_jan_apr_full_market_backfill.csv'
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          receipt={
              'system':'HENGCE',
              'artifact':'TDCC_2026_JAN_APR_FULL_MARKET_BACKFILL_RECEIPT',
              'status':'COMPLETE',
              'dates':dates,
              'snapshot_count':len(dates),
              'candidate_universe_rows':3091,
              'resolved_candidate_queries':3091*len(dates),
              'invalid_queries':0,
              'rows':len(rows),
              'unique_keys':len(keys),
              'date_counts':date_counts,
              'explicit_no_data_counts':no_data_counts,
              'summary_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
              'source':'TDCC_OFFICIAL_HISTORICAL_STOCK_DATE_QUERY',
              'candidate_source':'HENGCE_VALIDATED_TDCC_HISTORICAL_UNION_3091',
              'fresh_token_per_query':True,
              'authority':'RESEARCH_BACKFILL_CANDIDATE_NO_CANONICAL_AUTHORITY',
              'pit_authority':'HISTORICAL_PIT_PROXY_RESEARCH_ONLY',
              'no_forward_fill':True,
              'no_reconstruction':True,
              'technical_fallback':'PROHIBITED'
          }
          (root/'manifest.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit completed HENGCE full-market 2026 gap vessel
        shell: bash
        run: |
          git config user.name 'hengce-tdcc-backfill'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc/backfill_candidate/full_market_2026_jan_apr
          git commit -m 'data: complete full-market 2026 Jan-Apr TDCC weekly backfill'
          git push origin HEAD:main
