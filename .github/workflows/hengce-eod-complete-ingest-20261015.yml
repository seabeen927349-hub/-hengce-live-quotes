name: HENGCE EOD complete ingest 20261015

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-eod-complete-ingest-20261015.yml'

permissions:
  contents: write

jobs:
  fetch-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and normalize official TWSE price institutional margin legs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, json, re, urllib.request
          from pathlib import Path

          DATE='20261015'; ISO='2026-10-15'; OUT=Path('eod')/DATE; OUT.mkdir(parents=True, exist_ok=True)
          PRICE_URL=f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={DATE}&type=ALLBUT0999&response=json'
          INST_URL=f'https://www.twse.com.tw/rwd/zh/fund/T86?date={DATE}&selectType=ALLBUT0999&response=json'
          MARGIN_URL=f'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={DATE}&selectType=ALL&response=json'

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 HENGCE-EOD/1.0','Accept':'application/json','Referer':'https://www.twse.com.tw/'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          def clean(x): return '' if x is None else str(x).replace(',','').strip()

          # PRICE
          p=get_json(PRICE_URL)
          if str(p.get('stat'))!='OK' or str(p.get('date'))!=DATE:
              raise SystemExit(f'PRICE_NOT_READY stat={p.get("stat")} date={p.get("date")}')
          pt=None
          for t in p.get('tables') or []:
              fs=t.get('fields') or []
              if '證券代號' in fs and '收盤價' in fs and ('成交股數' in fs or '成交量' in fs): pt=t; break
          if pt is None: raise SystemExit('PRICE_STOCK_TABLE_NOT_FOUND')
          pf=pt.get('fields') or []; pd=pt.get('data') or pt.get('records') or []; pi={f:i for i,f in enumerate(pf)}
          def pv(row,*names):
              for n in names:
                  if n in pi and pi[n] < len(row): return clean(row[pi[n]])
              return ''
          pcols=['Date','Ticker','Name','VolumeShares','Trades','TurnoverTWD','Open','High','Low','Close','ChangeSign','Change','LastBid','LastBidVolume','LastAsk','LastAskVolume','PE','Source']
          pb={str(i):[] for i in range(1,10)}
          for r in pd:
              ticker=pv(r,'證券代號')
              if not re.fullmatch(r'[1-9]\d{3}',ticker): continue
              pb[ticker[0]].append({'Date':ISO,'Ticker':ticker,'Name':pv(r,'證券名稱'),'VolumeShares':pv(r,'成交股數','成交量'),'Trades':pv(r,'成交筆數'),'TurnoverTWD':pv(r,'成交金額'),'Open':pv(r,'開盤價'),'High':pv(r,'最高價'),'Low':pv(r,'最低價'),'Close':pv(r,'收盤價'),'ChangeSign':pv(r,'漲跌(+/-)','漲跌'),'Change':pv(r,'漲跌價差'),'LastBid':pv(r,'最後揭示買價'),'LastBidVolume':pv(r,'最後揭示買量'),'LastAsk':pv(r,'最後揭示賣價'),'LastAskVolume':pv(r,'最後揭示賣量'),'PE':pv(r,'本益比'),'Source':PRICE_URL})
          for k,rs in pb.items():
              if rs:
                  with (OUT/f'price_{k}.csv').open('w',encoding='utf-8-sig',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=pcols); w.writeheader(); w.writerows(rs)
          price_rows=sum(map(len,pb.values()))

          # INSTITUTIONAL
          q=get_json(INST_URL)
          if str(q.get('stat'))!='OK' or str(q.get('date'))!=DATE:
              raise SystemExit(f'INST_NOT_READY stat={q.get("stat")} date={q.get("date")}')
          qf=q.get('fields') or []; qd=q.get('data') or q.get('records') or []
          if not qd and isinstance(q.get('tables'),list):
              for t in q['tables']:
                  fs=t.get('fields') or []
                  if '證券代號' in fs and any('外陸資買賣超股數' in str(x) for x in fs): qf=fs; qd=t.get('data') or t.get('records') or []; break
          qi={f:i for i,f in enumerate(qf)}
          def qv(row,exact=None,contains=None):
              if exact and exact in qi and qi[exact] < len(row): return clean(row[qi[exact]])
              if contains:
                  for f,i in qi.items():
                      if contains in f and i < len(row): return clean(row[i])
              return ''
          icols=['Date','Ticker','Name','ForeignBuy','ForeignSell','ForeignNet','ForeignDealerBuy','ForeignDealerSell','ForeignDealerNet','TrustBuy','TrustSell','TrustNet','DealerNet','DealerProprietaryBuy','DealerProprietarySell','DealerProprietaryNet','DealerHedgeBuy','DealerHedgeSell','DealerHedgeNet','TotalNet','Source']
          ib={str(i):[] for i in range(1,10)}
          for r in qd:
              ticker=qv(r,exact='證券代號')
              if not re.fullmatch(r'[1-9]\d{3}',ticker): continue
              ib[ticker[0]].append({'Date':ISO,'Ticker':ticker,'Name':qv(r,exact='證券名稱'),'ForeignBuy':qv(r,contains='外陸資買進股數(不含外資自營商)'),'ForeignSell':qv(r,contains='外陸資賣出股數(不含外資自營商)'),'ForeignNet':qv(r,contains='外陸資買賣超股數(不含外資自營商)'),'ForeignDealerBuy':qv(r,exact='外資自營商買進股數'),'ForeignDealerSell':qv(r,exact='外資自營商賣出股數'),'ForeignDealerNet':qv(r,exact='外資自營商買賣超股數'),'TrustBuy':qv(r,exact='投信買進股數'),'TrustSell':qv(r,exact='投信賣出股數'),'TrustNet':qv(r,exact='投信買賣超股數'),'DealerNet':qv(r,exact='自營商買賣超股數'),'DealerProprietaryBuy':qv(r,exact='自營商買進股數(自行買賣)'),'DealerProprietarySell':qv(r,exact='自營商賣出股數(自行買賣)'),'DealerProprietaryNet':qv(r,exact='自營商買賣超股數(自行買賣)'),'DealerHedgeBuy':qv(r,exact='自營商買進股數(避險)'),'DealerHedgeSell':qv(r,exact='自營商賣出股數(避險)'),'DealerHedgeNet':qv(r,exact='自營商買賣超股數(避險)'),'TotalNet':qv(r,exact='三大法人買賣超股數'),'Source':INST_URL})
          for k,rs in ib.items():
              if rs:
                  with (OUT/f'institutional_{k}.csv').open('w',encoding='utf-8-sig',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=icols); w.writeheader(); w.writerows(rs)
          institutional_rows=sum(map(len,ib.values()))

          # MARGIN
          m=get_json(MARGIN_URL)
          if str(m.get('stat'))!='OK' or str(m.get('date'))!=DATE:
              raise SystemExit(f'MARGIN_NOT_READY stat={m.get("stat")} date={m.get("date")}')
          candidates=[]
          if isinstance(m.get('tables'),list): candidates += m['tables']
          if isinstance(m.get('fields'),list) and isinstance(m.get('data'),list): candidates += [{'fields':m['fields'],'data':m['data']}]
          for k,v in m.items():
              mm=re.fullmatch(r'fields(\d+)',str(k))
              if mm and isinstance(v,list) and isinstance(m.get('data'+mm.group(1)),list): candidates += [{'fields':v,'data':m['data'+mm.group(1)]}]
          mt=None
          for t in candidates:
              fs=[clean(x).replace(' ','') for x in (t.get('fields') or [])]
              data=t.get('data') or t.get('records') or []
              if len(fs)>=15 and len(data)>=500 and any('現金償還' in x for x in fs) and any('現券償還' in x for x in fs) and sum('今日餘額' in x for x in fs)>=2:
                  mt=(t.get('fields') or [],data); break
          if mt is None: raise SystemExit('MARGIN_TABLE_NOT_FOUND')
          mf,md=mt
          mcols=['Date','Ticker','Name','MarginBuy','MarginSell','MarginCashRepayment','MarginPreviousBalance','MarginBalance','MarginNextDayLimit','ShortBuy','ShortSell','ShortStockRepayment','ShortPreviousBalance','ShortBalance','ShortNextDayLimit','Offset','Note','Source']
          mb={str(i):[] for i in range(1,10)}
          for r in md:
              if not isinstance(r,(list,tuple)) or len(r)<15: continue
              ticker=clean(r[0]).replace('=','').replace('"','')
              if not re.fullmatch(r'[1-9]\d{3}',ticker): continue
              mb[ticker[0]].append({'Date':ISO,'Ticker':ticker,'Name':clean(r[1]),'MarginBuy':clean(r[2]),'MarginSell':clean(r[3]),'MarginCashRepayment':clean(r[4]),'MarginPreviousBalance':clean(r[5]),'MarginBalance':clean(r[6]),'MarginNextDayLimit':clean(r[7]),'ShortBuy':clean(r[8]),'ShortSell':clean(r[9]),'ShortStockRepayment':clean(r[10]),'ShortPreviousBalance':clean(r[11]),'ShortBalance':clean(r[12]),'ShortNextDayLimit':clean(r[13]),'Offset':clean(r[14]),'Note':clean(r[15]) if len(r)>15 else '','Source':MARGIN_URL})
          for k,rs in mb.items():
              if rs:
                  with (OUT/f'margin_{k}.csv').open('w',encoding='utf-8-sig',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=mcols); w.writeheader(); w.writerows(rs)
          margin_rows=sum(map(len,mb.values()))

          status={'system':'HENGCE','artifact':'EOD_COMPLETE_LEG_INGEST','target_date':ISO,'price_status':'COMPLETE','price_date':ISO,'price_rows':price_rows,'institutional_status':'COMPLETE','institutional_date':ISO,'institutional_rows':institutional_rows,'margin_status':'COMPLETE','margin_date':ISO,'margin_rows':margin_rows,'policy':'THREE_LEG_COMPLETE_REQUIRED','price_source':PRICE_URL,'institutional_source':INST_URL,'margin_source':MARGIN_URL}
          (OUT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          if price_rows < 900 or institutional_rows < 900 or margin_rows < 500: raise SystemExit('ROW_COUNT_TOO_SMALL')
          PY
      - name: Upload EOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: hengce-eod-20261015
          path: eod/20261015/
          if-no-files-found: error
      - name: Commit EOD artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-eod-bot'
          git config user.email 'hengce-eod-bot@users.noreply.github.com'
          git add eod/20261015/
          if git diff --cached --quiet; then echo 'EOD artifacts already current.'; exit 0; fi
          git commit -m 'HENGCE EOD 2026-10-15 complete three-leg ingest'
          python scripts/hengce_publish.py

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
