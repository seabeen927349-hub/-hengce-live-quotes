name: HENGCE data vessel health

"on":
  pull_request:
    paths:
      - 'scripts/hengce_market_session_guard.py'
      - 'scripts/hengce_twse_calendar.py'
      - 'scripts/hengce_live_universe_guard.py'
      - 'scripts/hengce_full_market_shadow.py'
      - 'scripts/hengce_eod_incremental_ingest.py'
      - 'scripts/hengce_eod_broker_aux.py'
      - 'scripts/hengce_eod_guarded_ingest.py'
      - 'scripts/hengce_daily_command_center.py'
      - '.github/workflows/hengce-original-eod-ingest.yml'
      - '.github/workflows/hengce-data-vessel-health.yml'
      - '.github/workflows/hengce-broker-prospective-capture.yml'
      - '.github/workflows/hengce-broker-prospective-selection-input.yml'
      - 'hengce/calendar/**'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_eod_broker_aux.py'
      - '.github/workflows/hengce-original-eod-ingest.yml'
      - '.github/workflows/hengce-data-vessel-health.yml'
      - '.github/workflows/hengce-broker-prospective-capture.yml'
      - '.github/workflows/hengce-broker-prospective-selection-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-vessel-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Compile guarded runtime paths
        run: |
          python -m py_compile \
            scripts/hengce_twse_calendar.py \
            scripts/hengce_market_session_guard.py \
            scripts/hengce_live_universe_guard.py \
            scripts/hengce_full_market_shadow.py \
            scripts/hengce_eod_incremental_ingest.py \
            scripts/hengce_eod_broker_aux.py \
            scripts/hengce_eod_guarded_ingest.py \
            scripts/hengce_daily_command_center.py

      - name: Effective-calendar regression
        run: python scripts/hengce_market_session_guard.py --self-test

      - name: Live quote session regression
        run: python scripts/hengce_live_universe_guard.py --mode self-test

      - name: EOD three-leg closure no-network regression
        run: python scripts/hengce_eod_guarded_ingest.py --mode self-test

      - name: Broker same-vessel governance regression
        run: python scripts/hengce_eod_broker_aux.py --mode self-test

      - name: Command-center closure regression
        run: python scripts/hengce_daily_command_center.py --mode self-test

      - name: Assert Broker is attached to original vessel only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('scripts/hengce_eod_incremental_ingest.py').read_text(encoding='utf-8')
          broker = Path('scripts/hengce_eod_broker_aux.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/hengce-original-eod-ingest.yml').read_text(encoding='utf-8')

          # Existing formal EOD/mother geometry must remain the original three legs.
          assert "LEGS=('price','institutional','margin')" in core

          # Broker is a research-only auxiliary bound to the existing eod/YYYYMMDD vessel.
          for needle in (
              'ALL_NEW_DATA_ATTACH_TO_EXISTING_GOVERNED_HENGCE_VESSEL_NO_PARALLEL_COLLECTOR',
              'FORWARD_COLLECTED_VENDOR_SNAPSHOT',
              'same_vessel_path',
              'blocks_core_three_leg_or_mother',
              'raw_broker_rows_persisted',
              'model_authority_created',
              'trading_authority_created',
              'capital_authority_created',
          ):
              assert needle in broker, f'BROKER_GOVERNANCE_MISSING:{needle}'

          # The only operational Broker entry is the already-existing original EOD workflow.
          assert 'python scripts/hengce_eod_broker_aux.py' in workflow
          assert '--eod-dir' in workflow
          assert "eod/${{ steps.target.outputs.compact }}" in workflow

          # The two former parallel operational workflows are forbidden.
          for path in (
              '.github/workflows/hengce-broker-prospective-capture.yml',
              '.github/workflows/hengce-broker-prospective-selection-input.yml',
          ):
              assert not Path(path).exists(), f'PARALLEL_BROKER_WORKFLOW_PRESENT:{path}'

          print('BROKER_ORIGINAL_VESSEL_ONLY_PASS')
          PY

      - name: Verify 2026-10-23 cannot become download-ready
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python scripts/hengce_eod_guarded_ingest.py --mode ingest --date 2026-10-23)"
          printf '%s\n' "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          x=json.loads(sys.argv[1])
          assert x['status']=='SKIP_NONTRADING'
          assert x['market_calendar_trading_day'] is False
          assert x['network_access_attempted'] is False
          assert x['delegated_to_pinned_ingest'] is False
          assert x['three_leg_complete'] is False
          assert x['formal_complete_day'] is False
          assert x['downstream_ready'] is False
          assert x['capital_authority'] is False
          assert x['broker_order_execution'] is False
          PY
          test ! -d eod/20261023
