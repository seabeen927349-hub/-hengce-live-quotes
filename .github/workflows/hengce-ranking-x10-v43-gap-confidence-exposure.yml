name: HENGCE Ranking X10 V43 Gap Confidence Exposure
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x10_v43_gap_confidence_exposure.py'
      - '.github/workflows/hengce-ranking-x10-v43-gap-confidence-exposure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X10 V43 gap confidence exposure
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x10_v43_gap_confidence_exposure.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x10_v43_gap_confidence_exposure_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x10-v43-gap-confidence-exposure
          path: |
            research/codex_full_reset_20261023/ranking_x10_v43_gap_confidence_exposure_result.json
            research/codex_full_reset_20261023/ranking_x10_events.jsonl
