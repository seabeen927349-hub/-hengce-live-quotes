name: HENGCE Ranking X9 Two Period Rank Maximin
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x9_two_period_rank_maximin.py'
      - '.github/workflows/hengce-ranking-x9-two-period-rank-maximin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X9 two-period rank maximin
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x9_two_period_rank_maximin.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x9_two_period_rank_maximin_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x9-two-period-rank-maximin
          path: |
            research/codex_full_reset_20261023/ranking_x9_two_period_rank_maximin_result.json
            research/codex_full_reset_20261023/ranking_x9_events.jsonl
