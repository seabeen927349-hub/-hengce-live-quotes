name: HENGCE Ranking X2 Residual LCB Router
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x2_resid_lcb_router.py'
      - '.github/workflows/hengce-ranking-x2-resid-lcb-router.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X2 residual LCB router
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x2_resid_lcb_router.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x2_resid_lcb_router_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x2-resid-lcb-router
          path: |
            research/codex_full_reset_20261023/ranking_x2_resid_lcb_router_result.json
            research/codex_full_reset_20261023/ranking_x2_events.jsonl
