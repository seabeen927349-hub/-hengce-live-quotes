name: HENGCE IF07 EBook Year Scope Probe No Returns

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_ebook_year_scope_probe.py'
      - '.github/workflows/hengce-if07-ebook-year-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Probe blank-year vs explicit-year electronic-book queries — no returns
        run: python research/selection_core_rebuild/if07_ebook_year_scope_probe.py
      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_EBOOK_YEAR_SCOPE_PROBE.json
      - uses: actions/upload-artifact@v4
        with:
          name: if07-ebook-year-scope-probe
          path: research/selection_core_rebuild/generated/IF07_EBOOK_YEAR_SCOPE_PROBE.json
          if-no-files-found: error
