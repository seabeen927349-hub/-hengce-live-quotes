name: HENGCE Nextday O2 Reversal Analog Tailrisk
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk.py'
      - '.github/workflows/hengce-nextday-o2-reversal-analog-tailrisk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O2 strict-nextday reversal analog tailrisk
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk.py
      - name: Print result
        if: always()
        run: test -f research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk_result.json && cat research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk_result.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-o2-reversal-analog-tailrisk
          path: |
            research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk_result.json
            research/codex_full_reset_20261023/nextday_o2_reversal_analog_tailrisk_events.jsonl
          if-no-files-found: ignore
