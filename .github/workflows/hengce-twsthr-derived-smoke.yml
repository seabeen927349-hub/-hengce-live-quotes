name: HENGCE TWSTHR Derived Smoke

on:
  push:
    paths:
      - '.github/workflows/hengce-twsthr-derived-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/hengce_twsthr_derived_backfill.py --symbols 6415,6782 --sleep 1 --chunk-size 200
      - name: Commit smoke data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-tdcc-backfill'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc/backfill_candidate/twsthr_derived
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'smoke test twsthr derived holder history'
          git push origin HEAD:main
