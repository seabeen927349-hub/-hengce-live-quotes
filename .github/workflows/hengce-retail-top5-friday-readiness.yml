name: HENGCE V2.2 Friday EOD-TDCC readiness (research data only)
"on":
  pull_request:
    paths:
      - 'scripts/hengce_retail_top5_readiness.py'
      - 'tests/engineering/test_hengce_retail_top5_readiness.py'
      - '.github/workflows/hengce-retail-top5-friday-readiness.yml'
  workflow_dispatch:
    inputs:
      decision:
        description: 'Friday YYYY-MM-DD; blank = most recent Friday in Taipei'
        type: string
        required: false
  schedule:
    # 00:25 Taiwan Saturday: after the existing 23:00 Friday original EOD job.
    - cron: '25 16 * * 5'

permissions:
  contents: read

jobs:
  verify-existing-vessels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout HENGCE original repo without writing to mother
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 21-session continuity, TDCC PIT and zero authority
        run: |
          python -m unittest discover -s tests/engineering -p 'test_hengce_retail_top5_readiness.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_retail_top5_vessel_bridge.py' -v
      - name: Audit canonical EOD/TDCC and materialize only verified input files
        env:
          DECISION_INPUT: ${{ inputs.decision }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/hengce_retail_top5_readiness"
          if [[ -n "$DECISION_INPUT" ]]; then
            [[ "$DECISION_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            python scripts/hengce_retail_top5_readiness.py --decision "$DECISION_INPUT" --output "$DEST"
          else
            python scripts/hengce_retail_top5_readiness.py --output "$DEST"
          fi
          python - "$DEST" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=json.loads((p/'readiness.json').read_text())
          assert s['mode']=='DATA_PREPARATION_ONLY_NO_SELECTION'
          assert s['selection_attempted'] is False and s['top5']==[]
          assert s['broker_execution'] is False and s['authorized_lots']==0
          if s['source_status'] != 'SOURCE_DATA_PREPARED_RESEARCH_ONLY':
              assert not (p/'verified_daily_input.csv').exists()
              assert not (p/'verified_tdcc_input.csv').exists()
          print('HENGCE RESEARCH READINESS:',s['source_status'])
          print('DECISION:',s['decision'])
          print('MISSING EOD SESSIONS:',s['missing_eod_sessions'])
          print('BLOCKERS:',s['blockers'])
          PY
      - name: Publish provenance and explicit block report (never selection or orders)
        uses: actions/upload-artifact@v4
        with:
          name: retail-top5-weekly-original-vessel-readiness
          path: ${{ runner.temp }}/hengce_retail_top5_readiness/
          if-no-files-found: error
