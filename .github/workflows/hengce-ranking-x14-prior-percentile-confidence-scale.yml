name: HENGCE Ranking X14 Prior Percentile Confidence Scale
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x14_prior_percentile_confidence_scale.py'
      - '.github/workflows/hengce-ranking-x14-prior-percentile-confidence-scale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X14 prior-percentile confidence scale
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x14_prior_percentile_confidence_scale.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x14_prior_percentile_confidence_scale_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x14-prior-percentile-confidence-scale
          path: |
            research/codex_full_reset_20261023/ranking_x14_prior_percentile_confidence_scale_result.json
            research/codex_full_reset_20261023/ranking_x14_events.jsonl
