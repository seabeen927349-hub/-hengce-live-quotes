name: HENGCE Q017 SOX TW Electronics Archive

on:
  push:
    branches: [ main ]
    paths:
      - 'research/q017_sox_tw_electronics/acquire_official_pit.py'
      - '.github/workflows/hengce-q017-sox-tw-electronics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Acquire official PIT archives
        run: python research/q017_sox_tw_electronics/acquire_official_pit.py
      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-q017-sox-tw-electronics-archive
          path: research/q017_sox_tw_electronics/archive/
          if-no-files-found: error
      - name: Persist PASS archive to repository
        if: success()
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/archive
          if git diff --cached --quiet; then
            echo 'No archive changes to commit.'
          else
            git commit -m 'Q017: persist official 2024-2025 SOX/TW electronics PIT archive'
            git push
          fi
