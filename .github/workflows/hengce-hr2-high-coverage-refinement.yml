name: HENGCE HR2 High-Coverage Refinement
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/hr2_high_coverage_refinement.py'
      - '.github/workflows/hengce-hr2-high-coverage-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run HR2 high-coverage refinement
        run: PYTHONPATH=. python research/codex_full_reset_20261023/hr2_high_coverage_refinement.py
      - name: Upload HR2 result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-hr2-high-coverage-refinement
          path: |
            research/codex_full_reset_20261023/HR2_HIGH_COVERAGE_RESULT_20261025.json
            research/codex_full_reset_20261023/hr2_high_coverage_champion_events.jsonl
