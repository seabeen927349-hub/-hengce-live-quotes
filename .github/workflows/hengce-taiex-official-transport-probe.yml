name: HENGCE TAIEX Official Transport Probe

on:
  push:
    paths:
      - '.github/workflows/hengce-taiex-official-transport-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe official TWSE historical index transports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, hashlib

          urls = [
            'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?response=json&date=20230101',
            'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?date=20230101&response=json',
            'https://www.twse.com.tw/exchangeReport/MI_5MINS_HIST?response=json&date=20230101',
            'https://www.twse.com.tw/exchangeReport/MI_5MINS_HIST?date=20230101&response=json',
            'https://www.twse.com.tw/exchangeReport/FMTQIK?response=json&date=20230103',
            'https://www.twse.com.tw/exchangeReport/FMTQIK?date=20230103&response=json',
            'https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20230103&response=json',
            'https://www.twse.com.tw/rwd/zh/indicesReport/MI_5MINS_HIST?date=20230101&response=json',
          ]
          headers={
            'User-Agent':'Mozilla/5.0 HENGCE-TAIEX-Probe/1.0',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://www.twse.com.tw/zh/indices/taiex/mi-5min-hist'
          }
          out=[]
          for url in urls:
              rec={'url':url}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      rec.update({'http_status':getattr(r,'status',None),'content_type':r.headers.get('content-type'),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'prefix_utf8':raw[:240].decode('utf-8','replace').replace('\n',' ')})
                  try:
                      obj=json.loads(raw.decode('utf-8-sig'))
                      rec['json_parse']=True
                      rec['top_keys']=sorted(obj.keys()) if isinstance(obj,dict) else None
                      rec['stat']=obj.get('stat') if isinstance(obj,dict) else None
                      rec['date']=obj.get('date') if isinstance(obj,dict) else None
                      rec['fields']=obj.get('fields') if isinstance(obj,dict) else None
                      rec['data_rows']=len(obj.get('data') or []) if isinstance(obj,dict) else None
                  except Exception as e:
                      rec['json_parse']=False
                      rec['json_error']=repr(e)
              except Exception as e:
                  rec['transport_error']=repr(e)
              out.append(rec)
              print(json.dumps(rec,ensure_ascii=False),flush=True)
          pathlib.Path('probe.json').write_text(json.dumps({'artifact':'HENGCE_TAIEX_OFFICIAL_TRANSPORT_PROBE','authority':'TRANSPORT_ONLY_NO_MODEL_OR_OUTCOME_ACCESS','date_probed':'2023-01','results':out,'new_rs_forward_returns_opened':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HENGCE_TAIEX_OFFICIAL_TRANSPORT_PROBE
          path: probe.json
          retention-days: 7
