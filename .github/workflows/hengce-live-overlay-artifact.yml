name: HENGCE Live Overlay Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-live-overlay-artifact.yml'
      - 'scripts/**'
      - 'hengce/**'
      - 'eod/20261016/**'
      - 'receipts/HENGCE_Q017_HYPOTHETICAL_OPEN_RECONSTRUCTION_20261019.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build pinned overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overlay
          cp -a scripts overlay/
          mkdir -p overlay/.github
          cp -a .github/workflows overlay/.github/
          cp -a hengce overlay/
          mkdir -p overlay/eod
          cp -a eod/20261016 overlay/eod/
          mkdir -p overlay/receipts
          cp receipts/HENGCE_Q017_HYPOTHETICAL_OPEN_RECONSTRUCTION_20261019.json overlay/receipts/
          printf '%s\n' "$GITHUB_SHA" > overlay/LIVE_OVERLAY_GITHUB_SHA.txt
          find overlay -type f -print0 | sort -z | xargs -0 sha256sum > overlay/LIVE_OVERLAY_SHA256_MANIFEST.txt
          tar -C overlay -czf "HENGCE_LIVE_OVERLAY_${GITHUB_SHA}.tar.gz" .
          sha256sum "HENGCE_LIVE_OVERLAY_${GITHUB_SHA}.tar.gz" > "HENGCE_LIVE_OVERLAY_${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hengce-live-overlay-${{ github.sha }}
          path: |
            HENGCE_LIVE_OVERLAY_${{ github.sha }}.tar.gz
            HENGCE_LIVE_OVERLAY_${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
