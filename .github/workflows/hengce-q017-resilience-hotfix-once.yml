name: HENGCE Q017 Resilience Hotfix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-q017-resilience-hotfix-once.yml'

permissions:
  contents: write

concurrency:
  group: hengce-q017-resilience-hotfix-once
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Apply exact resilience hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          snap = Path('scripts/hengce_q017_premarket_snapshot_v1.py')
          s = snap.read_text(encoding='utf-8')
          old = """    if payload.get('authority') != AUTHORITY or int(payload.get('formal_buy_count') or -1) != 0:\n        return False, 'SNAPSHOT_AUTHORITY_INVALID'\n"""
          new = """    try:\n        formal_buy_count = int(payload['formal_buy_count'])\n    except (KeyError, TypeError, ValueError):\n        return False, 'SNAPSHOT_AUTHORITY_INVALID'\n    if payload.get('authority') != AUTHORITY or formal_buy_count != 0:\n        return False, 'SNAPSHOT_AUTHORITY_INVALID'\n"""
          if old not in s:
              if "formal_buy_count = int(payload['formal_buy_count'])" not in s:
                  raise SystemExit('SNAPSHOT_ZERO_AUTHORITY_PATTERN_NOT_FOUND_AND_NOT_FIXED')
          else:
              s = s.replace(old, new, 1)
              snap.write_text(s, encoding='utf-8')

          v2 = Path('scripts/hengce_q017_observer_supervisor_v2.py')
          t = v2.read_text(encoding='utf-8')
          old2 = "        prepared, fingerprint = v1.prewarm_and_freeze(lane, trade_date, attempts)\n"
          new2 = "        prepared, fingerprint, _ = v1.prewarm_and_freeze(lane, trade_date, attempts)\n"
          if old2 not in t:
              if new2 not in t:
                  raise SystemExit('V2_FALLBACK_RETURN_CONTRACT_PATTERN_NOT_FOUND_AND_NOT_FIXED')
          else:
              t = t.replace(old2, new2, 1)
              v2.write_text(t, encoding='utf-8')

          test = Path('scripts/test_hengce_q017_observer_resilience_v1.py')
          u = test.read_text(encoding='utf-8')
          marker = "    must(s2, 'v1.prewarm_and_freeze', 'V2_BOUNDED_V1_FALLBACK')\n"
          guards = (
              "    must_not(s2, 'prepared, fingerprint = v1.prewarm_and_freeze', 'V2_OLD_TWO_VALUE_FALLBACK_UNPACK_FORBIDDEN')\n"
              "    must(s2, 'prepared, fingerprint, _ = v1.prewarm_and_freeze', 'V2_THREE_VALUE_FALLBACK_CONTRACT')\n"
          )
          if guards not in u:
              if marker not in u:
                  raise SystemExit('HARDLOCK_V2_MARKER_NOT_FOUND')
              u = u.replace(marker, marker + guards, 1)
              test.write_text(u, encoding='utf-8')
          PY

      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/hengce_q017_macro_cache_v1.py \
            scripts/hengce_q017_premarket_snapshot_v1.py \
            scripts/hengce_q017_observer_supervisor_v1.py \
            scripts/hengce_q017_observer_supervisor_v2.py \
            scripts/test_hengce_q017_observer_resilience_v1.py
          python scripts/hengce_q017_macro_cache_v1.py --mode self-test
          python scripts/hengce_q017_premarket_snapshot_v1.py --mode self-test
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v1.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v2.py --mode self-test
          python scripts/test_hengce_q017_observer_resilience_v1.py

      - name: Commit only verified hotfixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-resilience-hotfix-bot'
          git config user.email 'hengce-resilience-hotfix-bot@users.noreply.github.com'
          git add \
            scripts/hengce_q017_premarket_snapshot_v1.py \
            scripts/hengce_q017_observer_supervisor_v2.py \
            scripts/test_hengce_q017_observer_resilience_v1.py
          if git diff --cached --quiet; then
            echo 'HOTFIX_ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'HENGCE fix Q017 snapshot zero-authority validation and v2 fallback contract'
          git pull --rebase origin main
          git push origin HEAD:main
