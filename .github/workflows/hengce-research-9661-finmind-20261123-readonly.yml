name: HENGCE research-only 9661 FinMind day comparison 20261123
# One-time read-only broker branch analysis. Canonical EOD, mother, models and orders untouched.
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-research-9661-finmind-20261123-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Query paid FinMind broker-branch 9661 with existing token, publish aggregates to run log only
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.parse,urllib.request,datetime,collections,concurrent.futures,decimal
          D=decimal.Decimal
          token=os.environ.get('FINMIND_TOKEN','').strip()
          if not token: raise RuntimeError('FINMIND_TOKEN_UNAVAILABLE')
          dates='2026-09-01 2026-09-02 2026-09-03 2026-09-04 2026-09-07 2026-09-08 2026-09-09 2026-09-10 2026-09-11 2026-09-14 2026-09-15 2026-09-16 2026-09-17 2026-09-18 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-29 2026-09-30 2026-10-01 2026-10-02 2026-10-05 2026-10-06 2026-10-07 2026-10-08 2026-10-12 2026-10-13 2026-10-14 2026-10-15 2026-10-16 2026-10-19 2026-10-20 2026-10-21 2026-10-22 2026-10-27 2026-10-28 2026-10-29 2026-10-30 2026-11-02 2026-11-03 2026-11-04 2026-11-05 2026-11-06 2026-11-09 2026-11-10 2026-11-11 2026-11-12 2026-11-13 2026-11-16 2026-11-17 2026-11-18 2026-11-19 2026-11-20 2026-11-23 2026-11-24'.split()
          def fetch(day):
              try:
                  params=urllib.parse.urlencode({'securities_trader_id':'9661','date':day})
                  req=urllib.request.Request('https://api.finmindtrade.com/api/v4/taiwan_stock_trading_daily_report?'+params,headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'HENGCE-RESEARCH-9661-READ-ONLY/1.0'})
                  with urllib.request.urlopen(req,timeout=80) as response:
                      result=json.loads(response.read(30000000))
                  rows=result.get('data',[])
                  if str(result.get('status'))!='200' or not rows or any(str(x.get('date',''))[:10]!=day or str(x.get('securities_trader_id','')).upper()!='9661' for x in rows): raise RuntimeError('STATUS_DATE_BRANCH_OR_EMPTY')
                  totals=collections.defaultdict(lambda:[0,0,D(0),D(0)])
                  for x in rows:
                      k=str(x['stock_id']); p=D(str(x['price'])); b=int(x.get('buy') or 0); s=int(x.get('sell') or 0)
                      v=totals[k]; v[0]+=b; v[1]+=s; v[2]+=p*b; v[3]+=p*s
                  return day,len(rows),dict(totals),None
              except Exception as exc: return day,0,{},type(exc).__name__+':'+str(exc)[:150]
          def rank(totals):
              return sorted([[k,v[0],v[1],str(v[2]),str(v[3]),str(v[2]-v[3])] for k,v in totals.items()],key=lambda x:D(x[5]),reverse=True)
          periods=collections.defaultdict(lambda:collections.defaultdict(lambda:[0,0,D(0),D(0)]))
          history=collections.defaultdict(list)
          daily=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for day,n,t,e in pool.map(fetch,dates):
                  if e:
                      daily.append([day,0,e]); print('HENGCE_9661_DAY_ERROR '+json.dumps([day,e]),flush=True); continue
                  b=sum(v[2] for v in t.values()); s=sum(v[3] for v in t.values())
                  daily.append([day,n,len(t),str(b),str(s),str(b-s)])
                  print('HENGCE_9661_DAY '+json.dumps(daily[-1]),flush=True)
                  for k,v in t.items():
                      history[k].append([day,v[0],v[1],str(v[2]),str(v[3])])
                      for p in (day[:7],'ALL',('NOV_EARLY' if day<'2026-11-12' else 'NOV_REBOUND' if day<'2026-11-16' else 'NOV_CRASH' if day<'2026-11-23' else 'NOV_LATEST')) if day.startswith('2026-11') else (day[:7],'ALL'):
                          z=periods[p][k]
                          for i in range(4): z[i]+=v[i]
                  if day=='2026-11-24': print('HENGCE_9661_TODAY '+json.dumps(rank(t)),flush=True)
          selected={'3042','2379'}
          for p,t in periods.items():
              r=rank(t); top=r[:20]; bottom=r[-20:][::-1]
              selected.update(x[0] for x in top[:8]+bottom[:8])
              print('HENGCE_9661_PERIOD '+json.dumps({'period':p,'stocks':len(t),'buy':str(sum(v[2] for v in t.values())),'sell':str(sum(v[3] for v in t.values())),'top':top,'bottom':bottom,'focus':[x for x in r if x[0] in ('3042','2379')]}),flush=True)
          for k in sorted(selected):
              print('HENGCE_9661_HISTORY '+json.dumps({'stock':k,'days':history[k]}),flush=True)
          print('HENGCE_9661_COVERAGE '+json.dumps({'expected':len(dates),'successful':sum(len(x)==6 for x in daily),'daily':daily}),flush=True)
          PY
