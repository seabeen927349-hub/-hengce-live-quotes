name: HENGCE Nanmao 8150 Three-Year Validation

on:
  push:
    paths:
      - 'research/nanmao_8150/**'
      - '.github/workflows/hengce-nanmao-8150-3y.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Run bounded three-year validation
        run: python research/nanmao_8150/nanmao_8150_3y.py
      - name: Commit immutable research outputs
        run: |
          git config user.name 'hengce-bot'
          git config user.email 'hengce-bot@users.noreply.github.com'
          git add research/nanmao_8150/output
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'research: record 8150 three-year validation outputs'
            git push
          fi
