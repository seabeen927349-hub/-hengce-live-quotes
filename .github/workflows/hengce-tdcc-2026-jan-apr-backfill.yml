name: HENGCE TDCC 2026 Jan-Apr Backfill

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hengce_tdcc_2026_jan_apr_backfill.py'
      - '.github/workflows/hengce-tdcc-2026-jan-apr-backfill.yml'

permissions:
  contents: write

concurrency:
  group: hengce-tdcc-2026-jan-apr-backfill-v1
  cancel-in-progress: false

jobs:
  fetch:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        refdate:
          - '20260102'
          - '20260109'
          - '20260116'
          - '20260123'
          - '20260130'
          - '20260206'
          - '20260213'
          - '20260226'
          - '20260306'
          - '20260313'
          - '20260320'
          - '20260327'
          - '20260402'
          - '20260410'
          - '20260417'
          - '20260424'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas lxml
      - name: Run validated HENGCE TDCC historical vessel
        run: python scripts/hengce_tdcc_2026_jan_apr_backfill.py --date '${{ matrix.refdate }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdcc-${{ matrix.refdate }}
          path: ownership/tdcc/backfill_candidate/twse_2026_jan_apr/${{ matrix.refdate }}/
          retention-days: 30

  promote:
    needs: fetch
    if: ${{ always() && needs.fetch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tdcc-*
          path: ownership/tdcc/backfill_candidate/twse_2026_jan_apr
      - name: Integrity gate and aggregate
        shell: python
        run: |
          import csv,hashlib,json,pathlib,sys
          root=pathlib.Path('ownership/tdcc/backfill_candidate/twse_2026_jan_apr')
          dates=['20260102','20260109','20260116','20260123','20260130','20260206','20260213','20260226','20260306','20260313','20260320','20260327','20260402','20260410','20260417','20260424']
          rows=[]; date_counts={}; bad=[]
          for d in dates:
              p=root/d/'manifest.json'
              if not p.exists(): bad.append([d,'MISSING_MANIFEST']); continue
              m=json.loads(p.read_text())
              if m.get('status')!='COMPLETE' or m.get('valid_rows')!=m.get('universe_rows') or m.get('invalid_rows')!=0:
                  bad.append([d,m]); continue
              with (root/d/'tdcc_ownership_4d.csv').open(encoding='utf-8',newline='') as f:
                  x=list(csv.DictReader(f))
              if len(x)!=m['valid_rows']: bad.append([d,'CSV_ROW_MISMATCH']); continue
              date_counts[d]=len(x); rows.extend(x)
          if bad:
              print(json.dumps(bad,ensure_ascii=False,indent=2)); sys.exit(2)
          keys={(r['ReferenceDate'],r['Ticker']) for r in rows}
          if len(keys)!=len(rows): raise SystemExit('DUPLICATE_REFERENCE_TICKER_KEYS')
          out=root/'tdcc_2026_jan_apr_backfill.csv'
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          receipt={'system':'HENGCE','artifact':'TDCC_2026_JAN_APR_BACKFILL_RECEIPT','status':'COMPLETE','dates':dates,'snapshot_count':len(dates),'rows':len(rows),'unique_keys':len(keys),'date_counts':date_counts,'summary_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'authority':'RESEARCH_BACKFILL_CANDIDATE_NO_CANONICAL_AUTHORITY','pit_authority':'HISTORICAL_PIT_PROXY_RESEARCH_ONLY','no_forward_fill':True,'no_reconstruction':True,'technical_fallback':'PROHIBITED'}
          (root/'manifest.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit completed HENGCE 2026 gap vessel
        shell: bash
        run: |
          git config user.name 'hengce-tdcc-backfill'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc/backfill_candidate/twse_2026_jan_apr
          git commit -m 'data: complete 2026 Jan-Apr TDCC weekly backfill'
          git push origin HEAD:main
