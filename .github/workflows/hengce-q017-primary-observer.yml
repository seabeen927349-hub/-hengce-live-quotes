name: HENGCE Q017 Primary Observer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | observe'
        required: false
        default: 'self-test'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_observer_supervisor_v1.py'
      - 'scripts/hengce_q017_authority_guard_v5.py'
      - 'scripts/hengce_dual_engine_display.py'
      - '.github/workflows/hengce-q017-primary-observer.yml'
  schedule:
    # Asia/Taipei 07:45 Monday-Friday = UTC 23:45 Sunday-Thursday.
    # Start far ahead of 09:01 and remain alive through transient preflight failures.
    - cron: '45 23 * * 0-4'

permissions:
  contents: write

concurrency:
  group: hengce-q017-primary-observer
  cancel-in-progress: false

jobs:
  primary-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            python -m pip install --disable-pip-version-check requests openpyxl && exit 0
            echo "pip install attempt ${n} failed"
            sleep $((n*5))
          done
          exit 2

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then MODE='observe'; fi
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then MODE='${{ inputs.mode }}'; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test causal observation and supervisor lanes
        if: steps.mode.outputs.mode == 'self-test'
        run: |
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v1.py --mode self-test
          python scripts/hengce_q017_authority_guard_v5.py --mode self-test

      - name: Capture canonical immutable 09:01 observation through resilient supervisor
        id: primary_observe
        if: steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: python scripts/hengce_q017_observer_supervisor_v1.py --mode observe --lane primary

      - name: Persist canonical evidence and supervisor diagnostics before computation
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-primary-observer-bot'
          git config user.email 'hengce-primary-observer-bot@users.noreply.github.com'
          git add \
            hengce/q017_radar/observations/ \
            hengce/q017_radar/observation_latest.json \
            hengce/q017_radar/history/ \
            hengce/q017_radar/decision_attempts/ \
            hengce/q017_radar/decision_attempt_latest.json \
            hengce/q017_radar/latest.json \
            hengce/q017_radar/observer_supervisor_primary_status.json \
            hengce/q017_radar/observer_supervisor_attempts/ || true
          if git diff --cached --quiet; then
            echo 'No primary evidence/diagnostic changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 primary 09:01 evidence/status ${TS}"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Refresh checkout after immutable evidence persistence
        if: steps.mode.outputs.mode == 'observe' && steps.primary_observe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Compute only from persisted canonical 09:01 observation
        id: primary_compute
        if: steps.mode.outputs.mode == 'observe' && steps.primary_observe.outcome == 'success'
        continue-on-error: true
        run: python scripts/hengce_q017_observation_lock_v5.py --mode compute

      - name: Enforce schema-v5 authority
        id: primary_guard
        if: steps.mode.outputs.mode == 'observe' && steps.primary_compute.outcome == 'success'
        continue-on-error: true
        run: python scripts/hengce_q017_authority_guard_v5.py --mode check-and-repair

      - name: Refresh dual-engine display
        if: always() && steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: python scripts/hengce_dual_engine_display.py

      - name: Persist decision, authority and display
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-primary-observer-bot'
          git config user.email 'hengce-primary-observer-bot@users.noreply.github.com'
          git add \
            hengce/q017_radar/decision/ \
            hengce/q017_radar/decision_latest.json \
            hengce/q017_radar/latest.json \
            hengce/q017_radar/history/ \
            hengce/q017_radar/signal_ledger.jsonl \
            hengce/dual_engine/latest.json || true
          if git diff --cached --quiet; then
            echo 'No primary decision/display changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 primary decision/display ${TS}"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Primary observer health
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          echo "observe=${{ steps.primary_observe.outcome }} compute=${{ steps.primary_compute.outcome }} guard=${{ steps.primary_guard.outcome }}"
          if [[ '${{ steps.primary_observe.outcome }}' != 'success' ]]; then
            echo 'PRIMARY_0901_OBSERVATION_FAIL_CLOSED'
            exit 2
          fi
          if [[ '${{ steps.primary_compute.outcome }}' != 'success' || '${{ steps.primary_guard.outcome }}' != 'success' ]]; then
            echo 'PRIMARY_0901_EVIDENCE_EXISTS_BUT_DECISION_OR_GUARD_FAILED'
            exit 2
          fi
          echo 'PRIMARY_0901_OBSERVATION_AND_DECISION_PASS'
