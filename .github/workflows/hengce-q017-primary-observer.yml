name: HENGCE Q017 Primary Observer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test | observe'
        required: false
        default: 'self-test'
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_macro_cache_v1.py'
      - 'scripts/hengce_q017_premarket_snapshot_v1.py'
      - 'scripts/hengce_q017_observer_supervisor_v1.py'
      - 'scripts/hengce_q017_observer_supervisor_v2.py'
      - 'scripts/test_hengce_q017_observer_resilience_v1.py'
      - 'scripts/hengce_q017_authority_guard_v5.py'
      - 'scripts/hengce_dual_engine_display.py'
      - '.github/workflows/hengce-q017-primary-observer.yml'
  schedule:
    # Asia/Taipei 07:45 Monday-Friday = UTC 23:45 Sunday-Thursday.
    # Starts far ahead of 09:01. Normal path reads the already-persisted morning macro cache.
    - cron: '45 23 * * 0-4'

permissions:
  contents: write

concurrency:
  group: hengce-q017-primary-observer
  cancel-in-progress: false

jobs:
  primary-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            python -m pip install --disable-pip-version-check requests openpyxl && exit 0
            echo "pip install attempt ${n} failed"
            sleep $((n*5))
          done
          exit 2

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE='self-test'
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then MODE='observe'; fi
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then MODE='${{ inputs.mode }}'; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test causal observation and cache-first supervisor lanes
        if: steps.mode.outputs.mode == 'self-test'
        run: |
          python scripts/hengce_q017_observation_lock_v5.py --mode self-test
          python scripts/hengce_q017_macro_cache_v1.py --mode self-test
          python scripts/hengce_q017_premarket_snapshot_v1.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v1.py --mode self-test
          python scripts/hengce_q017_observer_supervisor_v2.py --mode self-test
          python scripts/test_hengce_q017_observer_resilience_v1.py
          python scripts/hengce_q017_authority_guard_v5.py --mode self-test

      - name: Sync latest persisted morning inputs before observer starts
        if: steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Capture canonical immutable 09:01 observation through macro-cache-first supervisor
        id: primary_observe
        if: steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: python scripts/hengce_q017_observer_supervisor_v2.py --mode observe --lane primary

      - name: Persist canonical evidence and supervisor diagnostics before computation
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-primary-observer-bot'
          git config user.email 'hengce-primary-observer-bot@users.noreply.github.com'

          paths=(
            hengce/q017_radar/observations/
            hengce/q017_radar/observation_latest.json
            hengce/q017_radar/history/
            hengce/q017_radar/decision_attempts/
            hengce/q017_radar/decision_attempt_latest.json
            hengce/q017_radar/latest.json
            hengce/q017_radar/observer_supervisor_primary_status.json
            hengce/q017_radar/observer_supervisor_attempts/
          )
          for p in "${paths[@]}"; do
            if [[ -e "$p" ]]; then
              git add -A -- "$p"
            fi
          done

          OBS="hengce/q017_radar/observations/$(TZ=Asia/Taipei date '+%Y%m%d')_0901_observation.json"
          if [[ '${{ steps.primary_observe.outcome }}' == 'success' ]]; then
            [[ -f "$OBS" ]] || { echo "PRIMARY_CANONICAL_OBSERVATION_MISSING_BEFORE_PERSIST:$OBS"; exit 2; }
            git add -- "$OBS"
          fi

          if git diff --cached --quiet; then
            echo 'No primary evidence/diagnostic changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 primary 09:01 evidence/status ${TS}"
            python scripts/hengce_publish.py
          fi

      - name: Verify canonical observation is persisted in Git HEAD before computation
        id: primary_evidence
        if: steps.mode.outputs.mode == 'observe' && steps.primary_observe.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Verify the exact accepted proposal; no post-computation pull/rebase.
          OBS="hengce/q017_radar/observations/$(TZ=Asia/Taipei date '+%Y%m%d')_0901_observation.json"
          git cat-file -e "HEAD:$OBS"
          git show "HEAD:$OBS" > /tmp/q017_canonical_observation.json
          python - /tmp/q017_canonical_observation.json <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          o = json.loads(p.read_text(encoding='utf-8'))
          assert o.get('schema_version') == 5
          assert o.get('module') == 'Q017_0901_OBSERVATION_LOCK'
          assert o.get('binding_status') == 'PASS'
          lock = o.get('observation_lock') or {}
          assert lock.get('cutoff_label') == '09:01'
          assert lock.get('window_valid') is True
          assert lock.get('immutable') is True
          h = o.get('observation_snapshot_sha256')
          payload = {k: v for k, v in o.items() if k != 'observation_snapshot_sha256'}
          exp = hashlib.sha256(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert h and h == exp
          print('PASS PRIMARY_CANONICAL_OBSERVATION_PERSISTED_AND_HASH_VALID')
          PY

      - name: Compute only from persisted canonical 09:01 observation
        id: primary_compute
        if: steps.mode.outputs.mode == 'observe' && steps.primary_observe.outcome == 'success' && steps.primary_evidence.outcome == 'success'
        continue-on-error: true
        run: python scripts/hengce_q017_observation_lock_v5.py --mode compute

      - name: Enforce schema-v5 authority
        id: primary_guard
        if: steps.mode.outputs.mode == 'observe' && steps.primary_compute.outcome == 'success'
        continue-on-error: true
        run: python scripts/hengce_q017_authority_guard_v5.py --mode check-and-repair

      - name: Refresh dual-engine display
        if: always() && steps.mode.outputs.mode == 'observe'
        continue-on-error: true
        run: python scripts/hengce_dual_engine_display.py

      - name: Persist decision, authority and display
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-primary-observer-bot'
          git config user.email 'hengce-primary-observer-bot@users.noreply.github.com'
          paths=(
            hengce/q017_radar/decision/
            hengce/q017_radar/decision_latest.json
            hengce/q017_radar/latest.json
            hengce/q017_radar/history/
            hengce/q017_radar/signal_ledger.jsonl
            hengce/dual_engine/latest.json
          )
          for p in "${paths[@]}"; do
            if [[ -e "$p" ]]; then
              git add -A -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No primary decision/display changes to persist.'
          else
            TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "HENGCE Q017 primary decision/display ${TS}"
            python scripts/hengce_publish.py
          fi

      - name: Primary observer health
        if: always() && steps.mode.outputs.mode == 'observe'
        shell: bash
        run: |
          set -euo pipefail
          echo "observe=${{ steps.primary_observe.outcome }} evidence=${{ steps.primary_evidence.outcome }} compute=${{ steps.primary_compute.outcome }} guard=${{ steps.primary_guard.outcome }}"
          if [[ '${{ steps.primary_observe.outcome }}' != 'success' ]]; then
            echo 'PRIMARY_0901_OBSERVATION_FAIL_CLOSED'
            exit 2
          fi
          if [[ '${{ steps.primary_evidence.outcome }}' != 'success' ]]; then
            echo 'PRIMARY_0901_OBSERVATION_NOT_PERSISTED_TO_GIT_HEAD_FAIL_CLOSED'
            exit 2
          fi
          if [[ '${{ steps.primary_compute.outcome }}' != 'success' || '${{ steps.primary_guard.outcome }}' != 'success' ]]; then
            echo 'PRIMARY_0901_EVIDENCE_EXISTS_BUT_DECISION_OR_GUARD_FAILED'
            exit 2
          fi
          echo 'PRIMARY_0901_OBSERVATION_PERSISTED_AND_DECISION_PASS'

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
