name: HENGCE intraday action board test

on:
  push:
    paths:
      - 'scripts/hengce_intraday_action_board.py'
      - 'hengce/HENGCE_INTRADAY_ACTION_BOARD_CONTRACT_v1_0_20261015.json'
      - '.github/workflows/hengce-intraday-action-board-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/hengce_intraday_action_board.py
      - name: Self test
        run: python scripts/hengce_intraday_action_board.py --self-test
