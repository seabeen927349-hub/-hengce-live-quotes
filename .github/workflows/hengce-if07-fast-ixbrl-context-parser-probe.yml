name: HENGCE IF07 Fast iXBRL Context Parser Probe No Returns

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_fast_ixbrl_context_parser_probe.py'
      - '.github/workflows/hengce-if07-fast-ixbrl-context-parser-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests lxml
      - name: Run fast parser control proof — no returns
        run: python research/selection_core_rebuild/if07_fast_ixbrl_context_parser_probe.py
      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_FAST_IXBRL_CONTEXT_PARSER_PROBE.json
      - uses: actions/upload-artifact@v4
        with:
          name: if07-fast-ixbrl-context-parser-probe
          path: research/selection_core_rebuild/generated/IF07_FAST_IXBRL_CONTEXT_PARSER_PROBE.json
          if-no-files-found: error
