name: HENGCE margin compact rescue 20261014

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-margin-compact-rescue-20261014.yml'

permissions:
  contents: write

jobs:
  compact-margin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact canonical margin balance from committed official leg
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, json
          from pathlib import Path
          src = Path('eod/20261014')
          rows = []
          for p in sorted(src.glob('margin_[1-9].csv')):
              with p.open('r', encoding='utf-8-sig', newline='') as f:
                  for r in csv.DictReader(f):
                      if r.get('Date') == '2026-10-14' and r.get('Ticker') and r.get('MarginBalance') not in (None, ''):
                          rows.append((r['Date'], r['Ticker'], r.get('Name',''), r['MarginBalance']))
          rows = sorted({(d,t):(d,t,n,b) for d,t,n,b in rows}.values(), key=lambda x:x[1])
          if len(rows) < 500:
              raise SystemExit(f'COMPACT_MARGIN_ROWS_TOO_SMALL:{len(rows)}')
          out = src / 'margin_balance_compact.csv'
          with out.open('w', encoding='utf-8', newline='') as f:
              w=csv.writer(f); w.writerow(['Date','Ticker','Name','MarginBalance']); w.writerows(rows)
          mapping={t:int(float(b)) for _,t,_,b in rows}
          (src/'margin_balance_map.json').write_text(json.dumps(mapping,separators=(',',':')),encoding='utf-8')
          for digit in '123456789':
              m={k:v for k,v in mapping.items() if k.startswith(digit)}
              (src/f'margin_balance_map_{digit}.json').write_text(json.dumps(m,separators=(',',':')),encoding='utf-8')
          print('rows',len(rows))
          PY
      - name: Commit compact rescue artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-eod-bot'
          git config user.email 'hengce-eod-bot@users.noreply.github.com'
          git add eod/20261014/margin_balance_compact.csv eod/20261014/margin_balance_map*.json
          if git diff --cached --quiet; then echo 'Compact artifacts already current.'; exit 0; fi
          git commit -m 'HENGCE EOD 2026-10-14 split compact margin maps'
          python scripts/hengce_publish.py --profile conservative-all

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
