name: HENGCE Q017 DXY Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/hengce_q017_decision_lock.py'
      - 'scripts/hengce_q017_decision_lock_v4.py'
      - '.github/workflows/hengce-q017-dxy-source-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Verify exact DXY source and completed-session calculation via schema-v4 route
        run: python scripts/hengce_q017_decision_lock_v4.py --mode dxy-smoke
