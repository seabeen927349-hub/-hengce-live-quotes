name: HENGCE TDCC Build Consolidated Candidate

on:
  push:
    paths:
      - 'scripts/hengce_tdcc_build_consolidated_candidate.py'
      - '.github/workflows/hengce-tdcc-build-consolidated-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build best-available fourth leg
        run: python scripts/hengce_tdcc_build_consolidated_candidate.py
      - name: Commit consolidated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-tdcc-backfill'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc/consolidated_candidate
          if ! git diff --cached --quiet; then
            git commit -m 'build consolidated best-available TDCC fourth-leg candidate'
            git push origin HEAD:main
          fi
      - name: Export consolidated fourth leg artifact
        uses: actions/upload-artifact@v4
        with:
          name: hengce-tdcc-fourth-leg-consolidated
          path: |
            ownership/tdcc/consolidated_candidate/tdcc_fourth_leg_best_available.csv.gz
            ownership/tdcc/consolidated_candidate/MANIFEST.json
            ownership/tdcc/consolidated_candidate/dates.json
          if-no-files-found: error
          retention-days: 30
