name: HENGCE Ranking X13 Median Confidence Full Exposure
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x13_median_confidence_full_exposure.py'
      - '.github/workflows/hengce-ranking-x13-median-confidence-full-exposure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X13 median-confidence exposure tier
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x13_median_confidence_full_exposure.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x13_median_confidence_full_exposure_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x13-median-confidence-full-exposure
          path: |
            research/codex_full_reset_20261023/ranking_x13_median_confidence_full_exposure_result.json
            research/codex_full_reset_20261023/ranking_x13_events.jsonl
