name: HENGCE Broker Prospective U100 Pre-Outcome Input Freeze

"on":
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'
    - cron: '30 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: hengce-broker-prospective-u100-input-freeze
  cancel-in-progress: false

env:
  RESEARCH_BRANCH: research/broker-prospective-validation-20261103

jobs:
  freeze-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Checkout isolated prospective research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Syntax check prospective input freezer
        run: python -m py_compile research/broker_prospective_20261103/capture_selection_inputs.py

      - name: Freeze date-correct U100 and pre-outcome controls
        id: freeze
        continue-on-error: true
        run: python research/broker_prospective_20261103/capture_selection_inputs.py

      - name: Commit immutable pre-outcome input evidence if produced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-broker-prospective-bot'
          git config user.email 'hengce-broker-prospective-bot@users.noreply.github.com'
          git add research/broker_prospective_20261103/captures/
          if git diff --cached --quiet; then
            echo 'No new selection-input evidence to commit.'
            exit 0
          fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "research(broker): freeze prospective U100 inputs ${TS}"
          if ! git push origin HEAD:${RESEARCH_BRANCH}; then
            git pull --rebase origin ${RESEARCH_BRANCH}
            git push origin HEAD:${RESEARCH_BRANCH}
          fi

      - name: Preserve fail-closed status
        if: steps.freeze.outcome != 'success'
        run: |
          echo 'Prospective input freezer did not pass. Evidence was retained if produced; no judge authority granted.'
          exit 1
