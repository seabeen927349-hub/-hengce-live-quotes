name: HENGCE E2 Profit Max Macro
on:
  push:
    branches: [main]
    paths:
      - 'research/e2_profit_max/acquire_macro_q017_sources.py'
      - '.github/workflows/hengce-e2-profit-max-macro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python research/e2_profit_max/acquire_macro_q017_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: e2-profit-max-macro
          path: research/e2_profit_max/macro/
          if-no-files-found: error
      - name: Commit macro archive
        run: |
          git config user.name hengce-e2-research-bot
          git config user.email hengce-e2-research-bot@users.noreply.github.com
          git add research/e2_profit_max/macro/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HENGCE E2 profit-max macro archive refresh'
          python scripts/hengce_publish.py

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
