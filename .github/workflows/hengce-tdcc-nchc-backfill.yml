name: HENGCE TDCC NCHC Legacy Backfill

on:
  push:
    paths:
      - 'scripts/hengce_tdcc_nchc_backfill.py'
      - '.github/workflows/hengce-tdcc-nchc-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download all valid legacy NCHC TDCC CSV resources
        run: python scripts/hengce_tdcc_nchc_backfill.py
      - name: Commit research backfill only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-tdcc-backfill'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc/backfill_candidate/nchc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'collect downloadable NCHC TDCC legacy snapshots'
          git push origin HEAD:main
