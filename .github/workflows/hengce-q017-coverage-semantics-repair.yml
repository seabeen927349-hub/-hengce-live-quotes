name: HENGCE Q017 Coverage Semantics Repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_20261019_q017_coverage_semantics_repair.py'
      - '.github/workflows/hengce-q017-coverage-semantics-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Apply coverage semantics repair
        run: python scripts/apply_20261019_q017_coverage_semantics_repair.py
      - name: Compile repaired Q017 components
        run: python -m py_compile scripts/hengce_q017_observation_lock_v5.py scripts/hengce_q017_backup_observer_v5.py scripts/test_hengce_q017_resilience_v5.py
      - name: Run schema-v5 observation self-test
        run: python scripts/hengce_q017_observation_lock_v5.py --mode self-test
      - name: Run recovery resilience test
        run: python scripts/test_hengce_q017_resilience_v5.py
      - name: Run independent authority guard self-test
        run: python scripts/hengce_q017_authority_guard_v5.py --mode self-test
      - name: Assert E2 prior-session lock remains coherent
        run: python scripts/hengce_e2_live.py --mode morning
      - name: Commit repaired production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-q017-coverage-repair-bot'
          git config user.email 'hengce-q017-coverage-repair-bot@users.noreply.github.com'
          git add scripts/hengce_q017_observation_lock_v5.py scripts/hengce_q017_backup_observer_v5.py scripts/test_hengce_q017_resilience_v5.py hengce/e2_live/morning_latest.json
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
          else
            git commit -m 'HENGCE harden Q017 quote versus opened coverage semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
