name: HENGCE Engineering Replay

on:
  # Deliberately unfiltered: scripts-only and workflow-only PRs must run too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: python -m pip install requests==2.32.5 openpyxl==3.1.5 PyYAML==6.0.3
      - name: Synthetic scripts-only PR trigger regression
        run: python -B tests/engineering/test_replay_workflow.py
      - name: Offline historical before and after replay
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || 'cc7d4cac9d389107ac2d9caa95ec662ae23cfdf7' }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -B tests/engineering/replay_equivalence_single_hengce.py
          --before "$BEFORE_SHA"
          --after "$AFTER_SHA"
          --report "$RUNNER_TEMP/hengce-replay.json"
      - name: Verify STOP-on-difference detector
        run: python -B tests/engineering/replay_equivalence_single_hengce.py --self-test
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-engineering-replay
          path: ${{ runner.temp }}/hengce-replay.json
          if-no-files-found: error
