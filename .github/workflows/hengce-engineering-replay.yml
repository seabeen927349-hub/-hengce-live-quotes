name: HENGCE Engineering Replay

on:
  # Deliberately unfiltered: scripts-only and workflow-only PRs must run too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: python -m pip install requests==2.32.5 openpyxl==3.1.5 PyYAML==6.0.3
      - name: Synthetic scripts-only PR trigger regression
        run: python -B tests/engineering/test_replay_workflow.py
      - name: Verify current Q017 retirement and live research monitoring
        run: python -B tests/engineering/test_current_retirement_monitoring.py
      - name: Replay frozen pre-retirement single-HENGCE baseline (historical only)
        run: >-
          python -B tests/engineering/run_retired_suite.py
          --suite replay --report "$RUNNER_TEMP/hengce-replay.json"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-engineering-replay
          path: ${{ runner.temp }}/hengce-replay.json
          if-no-files-found: error
