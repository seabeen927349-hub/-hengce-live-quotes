name: HENGCE Retail Top5 research regression
on:
  pull_request:
    paths:
      - 'research/selection_models/retail_top5_v2_2/**'
      - '.github/workflows/hengce-retail-top5-research.yml'
  push:
    paths:
      - 'research/selection_models/retail_top5_v2_2/**'
      - '.github/workflows/hengce-retail-top5-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
        working-directory: research/selection_models/retail_top5_v2_2
      - run: python -m unittest discover -s tests -v
        working-directory: research/selection_models/retail_top5_v2_2
