name: HENGCE authoritative live-universe handoff

"on":
  workflow_dispatch:
    inputs:
      handoff_path:
        description: 'Repo-relative path to authoritative handoff JSON'
        required: true
        default: 'handoff/live_universe_authoritative_handoff.json'
      expected_trade_date:
        description: 'Exact target trade date YYYY-MM-DD'
        required: true

permissions:
  contents: write

concurrency:
  group: hengce-live-universe-authoritative-handoff
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "HANDOFF_APPLY_MAIN_ONLY"
            exit 2
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate trade date format
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.expected_trade_date }}' =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "BAD_EXPECTED_TRADE_DATE_FORMAT"
            exit 2
          }

      - name: Pin Q017 and E2 isolation before handoff
        id: before
        shell: bash
        run: |
          set -euo pipefail
          Q017="$(git hash-object scripts/hengce_q017_observation_lock_v5.py)"
          E2="$(git hash-object scripts/hengce_e2_live.py)"
          test "$Q017" = "c2b44d56844fd496445220e6c55b9a031c547c4e" || {
            echo "Q017_CORE_SHA_DRIFT:$Q017"
            exit 2
          }
          test "$E2" = "ced2331486ef93a15075aaef5c6f6405461c1be4" || {
            echo "E2_CORE_SHA_DRIFT:$E2"
            exit 2
          }
          echo "q017=$Q017" >> "$GITHUB_OUTPUT"
          echo "e2=$E2" >> "$GITHUB_OUTPUT"

      - name: Self-test handoff consumer
        run: python3 scripts/hengce_live_universe_handoff.py --mode self-test

      - name: Self-test universe guard
        run: python3 scripts/hengce_live_universe_guard.py --mode self-test

      - name: Validate explicit authoritative handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hengce_live_universe_handoff.py \
            --mode validate \
            --handoff '${{ inputs.handoff_path }}' \
            --expected-trade-date '${{ inputs.expected_trade_date }}'

      - name: Apply validated universe membership only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hengce_live_universe_handoff.py \
            --mode apply \
            --handoff '${{ inputs.handoff_path }}' \
            --expected-trade-date '${{ inputs.expected_trade_date }}'

      - name: Revalidate Q017 and E2 isolation after handoff
        shell: bash
        run: |
          set -euo pipefail
          Q017_AFTER="$(git hash-object scripts/hengce_q017_observation_lock_v5.py)"
          E2_AFTER="$(git hash-object scripts/hengce_e2_live.py)"
          test "$Q017_AFTER" = '${{ steps.before.outputs.q017 }}'
          test "$E2_AFTER" = '${{ steps.before.outputs.e2 }}'
          git diff --exit-code -- scripts/hengce_q017_observation_lock_v5.py scripts/hengce_e2_live.py

      - name: Verify only membership authority was introduced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          u = json.loads(Path("hengce/live_universe.json").read_text())
          assert u["target_date"] == "${{ inputs.expected_trade_date }}"
          assert u["policy"] == "AUTHORITATIVE_HANDOFF_SYMBOL_SET_HARD_BIND"
          assert u["membership_handoff"]["validated"] is True
          assert u["authority"] == {
              "membership": True,
              "ranking": False,
              "signal": False,
              "capital": False,
              "broker_execution": False,
          }
          assert u["membership_handoff"]["automatic_rebuild"] is False
          assert len(u["symbols"]) == u["requested_count"] == len(set(u["symbols"]))
          print("PASS MEMBERSHIP_ONLY_AUTHORITY")
          PY

      - name: Commit validated universe and receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-live-universe-handoff-bot'
          git config user.email 'hengce-live-universe-handoff-bot@users.noreply.github.com'
          git add hengce/live_universe.json receipts/HENGCE_LIVE_UNIVERSE_AUTHORITATIVE_HANDOFF_APPLY_*.json
          git diff --cached --quiet && {
            echo "NO_HANDOFF_CHANGES"
            exit 2
          }
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE authoritative live-universe handoff ${TS}"
          python scripts/hengce_publish.py

      - name: Preserve publication arbitration receipts and captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-publication-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hengce-publication
          if-no-files-found: ignore
