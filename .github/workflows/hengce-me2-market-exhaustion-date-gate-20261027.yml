name: HENGCE ME2 Market Exhaustion Date Gate 20261027

on:
  push:
    branches:
      - 'research/codex-full-reset-run-20261023'
    paths:
      - '.github/workflows/hengce-me2-market-exhaustion-date-gate-20261027.yml'
      - 'research/codex_full_reset_20261023/me2_market_exhaustion_date_gate_20261027.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Recover frozen historical electronics artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _frozen_artifacts/a11670479047 _frozen_artifacts/a11670339491
          for id in 11670479047 11670339491; do
            curl -L --fail --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "_frozen_artifacts/${id}.zip"
            unzip -q "_frozen_artifacts/${id}.zip" -d "_frozen_artifacts/a${id}"
          done

      - name: Run ME2 forensic and natural-gate validator
        run: python research/codex_full_reset_20261023/me2_market_exhaustion_date_gate_20261027.py

      - name: Upload ME2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-me2-market-exhaustion-date-gate-20261027
          path: research/codex_full_reset_20261023/results/me2_market_exhaustion_date_gate_20261027/
          if-no-files-found: warn
