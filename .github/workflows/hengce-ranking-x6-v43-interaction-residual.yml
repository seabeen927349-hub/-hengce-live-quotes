# retrigger after rank-helper fix 2026-10-25
name: HENGCE Ranking X6 V43 Interaction Residual
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x6_v43_interaction_residual.py'
      - '.github/workflows/hengce-ranking-x6-v43-interaction-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X6 V43 interaction residual
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x6_v43_interaction_residual.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x6_v43_interaction_residual_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x6-v43-interaction-residual
          path: |
            research/codex_full_reset_20261023/ranking_x6_v43_interaction_residual_result.json
            research/codex_full_reset_20261023/ranking_x6_events.jsonl
