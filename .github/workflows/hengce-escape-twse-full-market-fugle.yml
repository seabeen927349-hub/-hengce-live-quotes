name: HENGCE Escape Electronics100 Fugle Basic

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0-30/5 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hengce-escape-electronics100-fugle-basic
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current100 via free-tier Fugle single-symbol quotes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, random, re, time, urllib.error, urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          API_KEY=os.environ.get('FUGLE_API_KEY')
          if not API_KEY:
              raise SystemExit('FUGLE_API_KEY_MISSING')

          TZ=ZoneInfo('Asia/Taipei')
          CONFIG=Path('hengce/legacy/live_universe.json')
          OUT=Path('escape_live')
          OUT.mkdir(parents=True,exist_ok=True)
          BASE='https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/'

          # Free/basic plan is documented at 60 HTTP calls/minute.
          # 1.10 s nominal spacing is ~54.5 calls/min before request latency,
          # leaving headroom for rolling-window enforcement.
          MIN_CALL_SPACING_SECONDS=1.10
          MIN_SUCCESS_COUNT=95

          if not CONFIG.exists():
              raise SystemExit('ELECTRONICS100_UNIVERSE_MISSING')
          cfg=json.loads(CONFIG.read_text(encoding='utf-8'))
          if cfg.get('policy')!='TWSE_LISTED_ELECTRONICS_100_HARD_BIND':
              raise SystemExit('ELECTRONICS100_POLICY_MISMATCH')
          if cfg.get('scope')!='TWSE_LISTED_ELECTRONICS_ONLY':
              raise SystemExit('ELECTRONICS100_SCOPE_MISMATCH')
          symbols=[str(x).strip() for x in cfg.get('symbols',[])]
          if len(symbols)!=100 or len(set(symbols))!=100:
              raise SystemExit(f'ELECTRONICS100_COUNT_OR_DUPLICATE:{len(symbols)}')
          bad=[s for s in symbols if not re.fullmatch(r'[1-9]\d{3}',s)]
          if bad:
              raise SystemExit(f'ELECTRONICS100_BAD_SYMBOLS:{bad[:10]}')

          rows_by_symbol={str(r.get('Ticker')):r for r in cfg.get('rows',[])}
          if set(rows_by_symbol)!=set(symbols):
              raise SystemExit('ELECTRONICS100_ROWS_SYMBOL_SET_MISMATCH')

          def fetch_quote(symbol):
              req=urllib.request.Request(BASE+symbol,headers={
                  'X-API-KEY':API_KEY,
                  'Accept':'application/json',
                  'User-Agent':'HENGCE-ESCAPE-ELECTRONICS100-BASIC/1.0'
              })
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=15) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (401,403):
                          raise RuntimeError(f'AUTH_OR_PLAN_HTTP_{e.code}')
                      if e.code==429:
                          if attempt==3:
                              raise RuntimeError('RATE_LIMIT_HTTP_429')
                          wait=float(e.headers.get('Retry-After') or (4+4*attempt))
                          time.sleep(max(wait,4+4*attempt))
                          continue
                      if 500<=e.code<=599:
                          if attempt==3:
                              raise RuntimeError(f'SERVER_HTTP_{e.code}')
                          time.sleep(2**attempt)
                          continue
                      raise
                  except Exception:
                      if attempt==3:
                          raise
                      time.sleep((2**attempt)+random.uniform(0.2,0.6))

          now=datetime.now(TZ)
          data=[]
          failures=[]
          last_call_started=None

          for idx,symbol in enumerate(symbols):
              if last_call_started is not None:
                  elapsed=time.monotonic()-last_call_started
                  if elapsed<MIN_CALL_SPACING_SECONDS:
                      time.sleep(MIN_CALL_SPACING_SECONDS-elapsed)
              last_call_started=time.monotonic()

              try:
                  q=fetch_quote(symbol)
                  if not isinstance(q,dict):
                      raise RuntimeError('INVALID_RESPONSE_TYPE')
                  if str(q.get('symbol') or '')!=symbol:
                      raise RuntimeError(f'SYMBOL_MISMATCH:{q.get("symbol")}')
                  meta=rows_by_symbol[symbol]
                  total=q.get('total') or {}
                  last=q.get('lastTrade') or {}
                  bids=q.get('bids') if isinstance(q.get('bids'),list) else []
                  asks=q.get('asks') if isinstance(q.get('asks'),list) else []
                  rec={
                      'symbol':symbol,
                      'name':q.get('name') or meta.get('Name'),
                      'industry':meta.get('industry_code'),
                      'selection_rank':meta.get('selection_rank'),
                      'quote_date':q.get('date'),
                      'reference_price':q.get('referencePrice'),
                      'previous_close':q.get('previousClose'),
                      'open':q.get('openPrice'),
                      'high':q.get('highPrice'),
                      'low':q.get('lowPrice'),
                      'close':q.get('closePrice'),
                      'last_price':q.get('lastPrice'),
                      'avg_price':q.get('avgPrice'),
                      'change':q.get('change'),
                      'change_percent':q.get('changePercent'),
                      'trade_volume':total.get('tradeVolume'),
                      'trade_value':total.get('tradeValue'),
                      'transactions':total.get('transaction'),
                      'volume_at_bid':total.get('tradeVolumeAtBid'),
                      'volume_at_ask':total.get('tradeVolumeAtAsk'),
                      'last_trade_price':last.get('price'),
                      'last_trade_size':last.get('size'),
                      'last_trade_time':last.get('time'),
                      'bids':bids,
                      'asks':asks,
                      'best_bid':bids[0] if bids else None,
                      'best_ask':asks[0] if asks else None,
                      'last_updated':q.get('lastUpdated'),
                      'is_trial':q.get('isTrial'),
                      'is_delayed_open':q.get('isDelayedOpen'),
                      'is_delayed_close':q.get('isDelayedClose'),
                      'fetch_ok':True
                  }
                  data.append(rec)
              except Exception as e:
                  failures.append({'symbol':symbol,'error':str(e)})

          success_count=len(data)
          if success_count==0:
              first=failures[0]['error'] if failures else 'UNKNOWN'
              raise SystemExit(f'ELECTRONICS100_ALL_REQUESTS_FAILED:{first}')
          if success_count<MIN_SUCCESS_COUNT:
              raise SystemExit(f'ELECTRONICS100_TOO_MANY_FAILURES:{success_count}/100:{failures[:5]}')

          data_by_symbol={x['symbol']:x for x in data}
          ordered=[data_by_symbol[s] for s in symbols if s in data_by_symbol]
          universe_sha=hashlib.sha256(('\n'.join(symbols)+'\n').encode()).hexdigest()
          quote_dates=sorted({str(x.get('quote_date')) for x in ordered if x.get('quote_date')})
          stale_count=sum(1 for x in ordered if x.get('quote_date')!=now.date().isoformat())

          payload={
              'schema_version':2,
              'service':'HENGCE Escape Electronics100 Fugle Basic',
              'generated_at_taipei':now.isoformat(),
              'market':'TSE',
              'exchange':'TWSE',
              'security_scope':'TWSE_LISTED_ELECTRONICS_100_HARD_BIND',
              'tpex_included':False,
              'source':'Fugle MarketData intraday/quote/{symbol}',
              'requested_mode':'FREE_TIER_RATE_LIMITED_SINGLE_SYMBOL_QUOTES',
              'rate_limit_design':'1.10s nominal start-to-start spacing; <=60/min target',
              'universe_version':cfg.get('version'),
              'universe_sha256':universe_sha,
              'requested_count':100,
              'success_count':success_count,
              'failure_count':len(failures),
              'quote_dates':quote_dates,
              'stale_quote_count_vs_today':stale_count,
              'failures':failures,
              'authority':'SHADOW_INTRADAY_ESCAPE_RESEARCH_ONLY_NO_FORMAL_EOD_RANKING_OR_TRADING_AUTHORITY',
              'data':ordered
          }
          raw=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          payload['payload_sha256']=hashlib.sha256(raw).hexdigest()
          status={k:v for k,v in payload.items() if k!='data'}
          status['healthy_transport']=success_count>=MIN_SUCCESS_COUNT
          status['fresh_market_day']=stale_count==0

          (OUT/'electronics100_snapshot.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'electronics100_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HENGCE ELECTRONICS100 FUGLE BASIC',success_count,'/100','quote_dates=',quote_dates,'stale=',stale_count)
          PY

      - name: Validate fail-closed electronics100 scope
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,re
          from pathlib import Path
          cfg=json.loads(Path('hengce/legacy/live_universe.json').read_text(encoding='utf-8'))
          p=json.loads(Path('escape_live/electronics100_snapshot.json').read_text(encoding='utf-8'))
          if p.get('security_scope')!='TWSE_LISTED_ELECTRONICS_100_HARD_BIND':
              raise SystemExit('SCOPE_MISMATCH')
          if p.get('tpex_included') is not False:
              raise SystemExit('TPEX_MUST_BE_EXCLUDED')
          requested=[str(x) for x in cfg.get('symbols',[])]
          rows=p.get('data',[])
          returned=[str(x.get('symbol')) for x in rows]
          if len(requested)!=100 or len(set(requested))!=100:
              raise SystemExit('REQUESTED_UNIVERSE_INVALID')
          if len(returned)<95 or len(returned)!=len(set(returned)):
              raise SystemExit(f'RETURNED_SCOPE_OR_DUPLICATE:{len(returned)}')
          if not set(returned).issubset(set(requested)):
              raise SystemExit('RETURNED_SYMBOL_OUTSIDE_CURRENT100')
          bad=[s for s in returned if not re.fullmatch(r'[1-9]\d{3}',s)]
          if bad:
              raise SystemExit(f'BAD_SYMBOLS:{bad[:10]}')
          if p.get('authority')!='SHADOW_INTRADAY_ESCAPE_RESEARCH_ONLY_NO_FORMAL_EOD_RANKING_OR_TRADING_AUTHORITY':
              raise SystemExit('AUTHORITY_MISMATCH')
          print('HENGCE ELECTRONICS100 FREE-TIER SCOPE VERIFIED',len(returned))
          PY

      - name: Commit isolated electronics100 shadow snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-escape-live-bot'
          git config user.email 'hengce-escape-live-bot@users.noreply.github.com'
          git add escape_live/electronics100_snapshot.json escape_live/electronics100_status.json
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE escape electronics100 Fugle basic ${TS}"
          git push origin HEAD:${GITHUB_REF_NAME}
