name: HENGCE Escape TWSE Common Stock Whole-Market Fugle

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0-30/5 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hengce-escape-twse-common-fugle
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}

    steps:
      - name: Checkout event branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch TWSE common-stock whole-market snapshot
        id: collect
        shell: bash
        run: |
          set -uo pipefail
          python3 <<'PY'
          import hashlib, json, os, sys, urllib.error, urllib.parse, urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Asia/Taipei')
          OUT = Path('escape_live')
          OUT.mkdir(parents=True, exist_ok=True)
          STATUS_PATH = OUT / 'twse_common_status.json'
          SNAPSHOT_PATH = OUT / 'twse_common_snapshot.json'

          SNAPSHOT_URL = 'https://api.fugle.tw/marketdata/v1.0/stock/snapshot/quotes/TSE?type=COMMONSTOCK'
          TICKERS_URL = 'https://api.fugle.tw/marketdata/v1.0/stock/intraday/tickers?type=EQUITY&exchange=TWSE&market=TSE'
          AUTHORITY = 'INTRADAY_CONTEXT_ESCAPE_MONITOR_ONLY_NO_FORMAL_EOD_OR_SELECTION_AUTHORITY'
          SCOPE = 'ALL_TWSE_LISTED_COMMON_STOCKS'

          generated = datetime.now(TZ)
          api_key = os.environ.get('FUGLE_API_KEY')

          status = {
              'schema_version': 1,
              'service': 'HENGCE Escape TWSE Common Stock Whole-Market Fugle',
              'generated_at_taipei': generated.isoformat(),
              'state': 'FAIL_CLOSED',
              'healthy_transport': False,
              'fresh_market_day': False,
              'universe_pass': False,
              'snapshot_authorized': False,
              'monitoring_universe': SCOPE,
              'exchange': 'TWSE',
              'market': 'TSE',
              'security_scope': 'COMMONSTOCK',
              'tpex_included': False,
              'authority': AUTHORITY,
              'formal_eod_state_creation': False,
              'institutional_state_created': False,
              'margin_state_created': False,
              'tdcc_state_created': False,
              'snapshot_endpoint': SNAPSHOT_URL,
              'ticker_endpoint': TICKERS_URL,
              'errors': [],
          }

          def write_status():
              STATUS_PATH.write_text(json.dumps(status, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')

          def fail(msg, code=1):
              status['errors'].append(str(msg))
              status['state'] = 'FAIL_CLOSED'
              status['snapshot_authorized'] = False
              write_status()
              print('HENGCE TWSE COMMON FAIL_CLOSED:', msg)
              raise SystemExit(code)

          if not api_key:
              fail('FUGLE_API_KEY_MISSING')

          headers = {
              'X-API-KEY': api_key,
              'Accept': 'application/json',
              'User-Agent': 'HENGCE-ESCAPE-TWSE-COMMON/1.0-PIT'
          }

          def fetch_json(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw.decode('utf-8')), raw, {
                          'date': r.headers.get('Date'),
                          'etag': r.headers.get('ETag'),
                          'last_modified': r.headers.get('Last-Modified'),
                      }
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace')[:1000]
                  fail(f'HTTP_{e.code}:{url}:{body}')
              except Exception as e:
                  fail(f'FETCH_ERROR:{url}:{type(e).__name__}:{e}')

          snap, snap_raw, snap_headers = fetch_json(SNAPSHOT_URL)
          tickers, tick_raw, tick_headers = fetch_json(TICKERS_URL)

          if not isinstance(snap, dict) or not isinstance(snap.get('data'), list):
              fail('SNAPSHOT_RESPONSE_SHAPE_INVALID')
          if not isinstance(tickers, dict) or not isinstance(tickers.get('data'), list):
              fail('TICKERS_RESPONSE_SHAPE_INVALID')

          snap_rows = snap['data']
          ticker_rows = tickers['data']
          if not snap_rows:
              fail('SNAPSHOT_EMPTY')
          if not ticker_rows:
              fail('TICKERS_EMPTY')

          if str(snap.get('market')) != 'TSE':
              fail(f'SNAPSHOT_MARKET_MISMATCH:{snap.get("market")}')
          if str(tickers.get('exchange')) != 'TWSE':
              fail(f'TICKERS_EXCHANGE_MISMATCH:{tickers.get("exchange")}')
          if str(tickers.get('market')) != 'TSE':
              fail(f'TICKERS_MARKET_MISMATCH:{tickers.get("market")}')

          snapshot_symbols = [str(x.get('symbol') or '').strip() for x in snap_rows]
          ticker_symbols = [str(x.get('symbol') or '').strip() for x in ticker_rows]
          if any(not s for s in snapshot_symbols):
              fail('SNAPSHOT_EMPTY_SYMBOL')
          if len(snapshot_symbols) != len(set(snapshot_symbols)):
              fail('SNAPSHOT_DUPLICATE_SYMBOLS')
          if len(ticker_symbols) != len(set(ticker_symbols)):
              fail('TICKERS_DUPLICATE_SYMBOLS')

          non_equity = [str(x.get('symbol')) for x in snap_rows if str(x.get('type') or '').upper() != 'EQUITY']
          if non_equity:
              fail(f'SNAPSHOT_NON_EQUITY_ROWS:{non_equity[:20]}')

          ticker_map = {str(x.get('symbol')): x for x in ticker_rows if x.get('symbol') is not None}
          missing_in_tickers = [s for s in snapshot_symbols if s not in ticker_map]
          if missing_in_tickers:
              fail(f'SNAPSHOT_SYMBOLS_MISSING_FROM_TWSE_EQUITY_LIST:{missing_in_tickers[:20]}')

          snapshot_date = str(snap.get('date') or '')
          ticker_date = str(tickers.get('date') or '')
          today = generated.date().isoformat()
          fresh_market_day = snapshot_date == today and ticker_date == today
          if snapshot_date != ticker_date:
              fail(f'SOURCE_DATE_MISMATCH:snapshot={snapshot_date}:tickers={ticker_date}')

          normalized = []
          for row in snap_rows:
              symbol = str(row.get('symbol'))
              meta = ticker_map[symbol]
              normalized.append({
                  'symbol': symbol,
                  'name': row.get('name') or meta.get('name'),
                  'type': row.get('type'),
                  'industry': meta.get('industry'),
                  'open_price': row.get('openPrice'),
                  'high_price': row.get('highPrice'),
                  'low_price': row.get('lowPrice'),
                  'close_price': row.get('closePrice'),
                  'last_price': row.get('lastPrice'),
                  'change': row.get('change'),
                  'change_percent': row.get('changePercent'),
                  'trade_volume': row.get('tradeVolume'),
                  'trade_value': row.get('tradeValue'),
                  'last_updated': row.get('lastUpdated'),
              })

          normalized.sort(key=lambda x: x['symbol'])
          universe_sha = hashlib.sha256(('\n'.join(x['symbol'] for x in normalized) + '\n').encode('utf-8')).hexdigest()
          raw_snapshot_sha = hashlib.sha256(snap_raw).hexdigest()
          raw_tickers_sha = hashlib.sha256(tick_raw).hexdigest()

          payload = {
              'schema_version': 1,
              'service': 'HENGCE Escape TWSE Common Stock Whole-Market Fugle',
              'generated_at_taipei': generated.isoformat(),
              'source_date': snapshot_date,
              'source_time': snap.get('time'),
              'exchange': 'TWSE',
              'market': 'TSE',
              'security_scope': 'COMMONSTOCK',
              'monitoring_universe': SCOPE,
              'tpex_included': False,
              'authority': AUTHORITY,
              'source': 'Fugle MarketData snapshot/quotes/TSE?type=COMMONSTOCK + intraday/tickers TWSE/TSE EQUITY',
              'formal_eod_state_creation': False,
              'institutional_state_created': False,
              'margin_state_created': False,
              'tdcc_state_created': False,
              'row_count': len(normalized),
              'universe_sha256': universe_sha,
              'raw_snapshot_sha256': raw_snapshot_sha,
              'raw_tickers_sha256': raw_tickers_sha,
              'data': normalized,
          }
          payload_raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          payload['payload_sha256'] = hashlib.sha256(payload_raw).hexdigest()

          status.update({
              'source_date': snapshot_date,
              'source_time': snap.get('time'),
              'ticker_date': ticker_date,
              'row_count': len(normalized),
              'universe_sha256': universe_sha,
              'raw_snapshot_sha256': raw_snapshot_sha,
              'raw_tickers_sha256': raw_tickers_sha,
              'payload_sha256': payload['payload_sha256'],
              'healthy_transport': True,
              'fresh_market_day': fresh_market_day,
              'universe_pass': True,
              'snapshot_http': snap_headers,
              'tickers_http': tick_headers,
          })

          if not fresh_market_day:
              status['state'] = 'PENDING_OR_STALE_MARKET_DAY'
              status['snapshot_authorized'] = False
              write_status()
              print('HENGCE TWSE COMMON transport OK but stale/holiday:', snapshot_date, ticker_date, 'today=', today)
              raise SystemExit(2)

          SNAPSHOT_PATH.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          status['state'] = 'SUCCESS'
          status['snapshot_authorized'] = True
          write_status()
          print('HENGCE TWSE COMMON SUCCESS rows=', len(normalized), 'date=', snapshot_date, 'sha=', payload['payload_sha256'])
          PY

      - name: Commit runtime status and authorized snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hengce-escape-bot"
          git config user.email "hengce-escape-bot@users.noreply.github.com"
          git add escape_live/twse_common_status.json
          if [ -f escape_live/twse_common_snapshot.json ]; then
            git add escape_live/twse_common_snapshot.json
          fi
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "data(escape): refresh TWSE common-stock Fugle snapshot/status"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
          echo "Unable to persist runtime status/snapshot"
          exit 1
