name: Q017 2026 SOX x Taiwan electronics research

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/export_electronics_tickers_2026.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify electronics archive
        run: test -s research/q017_sox_tw_electronics/archive_2026/twse_electronics_membership_2026.csv
      - name: Export electronics universe
        run: python research/q017_sox_tw_electronics/export_electronics_tickers_2026.py
      - name: Commit electronics universe
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/factor_join_2026/electronics_tickers.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Export Q017 electronics ticker universe'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
