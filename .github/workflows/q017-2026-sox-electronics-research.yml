name: Q017 2026 SOX x Taiwan electronics research

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/acquire_ndx_2026.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install requests openpyxl
      - name: Acquire NDX 2026
        run: python research/q017_sox_tw_electronics/acquire_ndx_2026.py
      - name: Commit NDX archive
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/archive_2026/ndx_2026.csv research/q017_sox_tw_electronics/archive_2026/ndx_acquisition_status.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Archive 2026 NDX history for Q017'
            git pull --rebase origin q017-2026-sox-dxy-electronics
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
