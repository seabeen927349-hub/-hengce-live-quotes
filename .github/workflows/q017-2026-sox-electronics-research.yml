name: Q017 2026 SOX x Taiwan electronics research

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/dxy_rank_combo_screen_2026.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2026 SOX/DXY archives
        run: |
          test -s research/q017_sox_tw_electronics/archive_2026/twse_electronics_membership_2026.csv
          test -s research/q017_sox_tw_electronics/archive_2026/sox_2026.csv
          test -s research/q017_sox_tw_electronics/archive_2026/dxy_2026.csv
      - name: Run DXY ranking combination screen
        run: python research/q017_sox_tw_electronics/dxy_rank_combo_screen_2026.py
      - name: Commit DXY ranking results
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/dxy_rank_combo_screen_2026
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Screen Q017 DXY ranking combinations'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
