name: Q017 2026 SOX x Taiwan electronics research

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/test_2026_combined_gates.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2026 residual events
        run: test -s research/q017_sox_tw_electronics/residual_gate_2026/events.csv
      - name: Run 2026 combined gate screen
        run: python research/q017_sox_tw_electronics/test_2026_combined_gates.py
      - name: Commit 2026 combined results
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/combined_gate_2026
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Screen 2026 Q017 combined gates with 2M'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
