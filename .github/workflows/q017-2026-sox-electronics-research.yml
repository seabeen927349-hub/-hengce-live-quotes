name: Q017 2026 SOX x Taiwan electronics research

# Registered on main; this branch push starts the research vessel.
on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/acquire_2026_sox_dxy_pit.py'
      - 'research/q017_sox_tw_electronics/analyze_2026_sox_response.py'
      - 'research/q017_sox_tw_electronics/backtest_2m_capital.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl pandas numpy
      - name: Verify materialized PIT archive
        run: |
          test -s research/q017_sox_tw_electronics/archive_2026/twse_electronics_membership_2026.csv
          test -s research/q017_sox_tw_electronics/archive_2026/sox_2026.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/q017_sox_tw_electronics/archive_2026/acquisition_receipt_2026.json')
          r=json.loads(p.read_text())
          assert r['hard_gate']=='PASS', r
          assert r['twse']['errors']==0, r
          assert r['sox']['status']=='PASS', r
          print('MATERIALIZED_ARCHIVE_PASS')
          PY
      - name: Run 2M capital backtest
        run: python research/q017_sox_tw_electronics/backtest_2m_capital.py
      - name: Commit 2M backtest results
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/backtest_2m
          if git diff --cached --quiet; then
            echo 'No backtest changes'
          else
            git commit -m 'Backtest Q017 with 2M capital'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
