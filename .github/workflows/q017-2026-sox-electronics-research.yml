name: Q017 2026 SOX x Taiwan electronics research

# Registered on main; this branch push starts the research vessel.
on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/acquire_2026_sox_dxy_pit.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Acquire PIT archive
        run: python research/q017_sox_tw_electronics/acquire_2026_sox_dxy_pit.py
      - name: Commit research archive
        if: always()
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/archive_2026
          if git diff --cached --quiet; then
            echo 'No archive changes'
          else
            git commit -m 'Archive Q017 2026 SOX electronics PIT data'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
