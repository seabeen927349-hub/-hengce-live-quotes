name: Q017 2026 SOX x Taiwan electronics research

on:
  push:
    branches:
      - q017-2026-sox-dxy-electronics
    paths:
      - 'research/q017_sox_tw_electronics/overflow_score_gate_2026.py'
      - '.github/workflows/q017-2026-sox-electronics-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q017-2026-sox-dxy-electronics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify capacity-aware result
        run: test -s research/q017_sox_tw_electronics/capacity_aware_multistock_2026/summary.json
      - name: Run overflow score-ratio gates
        run: python research/q017_sox_tw_electronics/overflow_score_gate_2026.py
      - name: Commit overflow gate results
        run: |
          git config user.name 'hengce-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/q017_sox_tw_electronics/overflow_score_gate_2026
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Test Q017 overflow score-ratio gates'
            git push origin HEAD:q017-2026-sox-dxy-electronics
          fi
