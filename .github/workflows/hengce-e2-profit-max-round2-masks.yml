name: HENGCE E2 Profit Max Round2 Candidate Masks
on:
  push:
    branches: [main]
    paths:
      - 'research/e2_profit_max/round2/candidate_dates_localshock.csv'
      - 'research/e2_profit_max/round2/build_candidate_macro_masks.py'
      - '.github/workflows/hengce-e2-profit-max-round2-masks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python research/e2_profit_max/round2/build_candidate_macro_masks.py
      - name: Commit joined candidate masks
        run: |
          set -euo pipefail
          git config user.name hengce-e2-research-bot
          git config user.email hengce-e2-research-bot@users.noreply.github.com
          git add research/e2_profit_max/round2/candidate_macro_masks.csv research/e2_profit_max/round2/candidate_macro_masks_receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HENGCE E2 round2 candidate macro masks'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
