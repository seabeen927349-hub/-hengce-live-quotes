name: HENGCE TWSE Electronics 100 Live Quotes

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hengce/legacy/live_universe.json'
      - '.github/workflows/hengce-legacy-live-quotes.yml'
  schedule:
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0-30/5 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hengce-twse-electronics100-live-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch TWSE electronics100 Fugle quotes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, random, re, time, urllib.error, urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          API_KEY=os.environ.get('FUGLE_API_KEY')
          if not API_KEY:
              raise SystemExit('FUGLE_API_KEY_MISSING')

          TZ=ZoneInfo('Asia/Taipei')
          CACHE_TTL_SECONDS=600
          TRADE_IDLE_SECONDS=900
          REQUEST_GAP_SECONDS=1.20
          POLICY='TWSE_LISTED_ELECTRONICS_100_HARD_BIND'
          SCOPE='TWSE_LISTED_ELECTRONICS_ONLY'
          ALLOWED_INDUSTRY={'24','25','26','27','28','29','30','31'}
          UNIVERSE_PATH=Path('hengce/legacy/live_universe.json')
          OUT_ROOT=Path('legacy_live')
          QUOTE_DIR=OUT_ROOT/'quotes'
          OUT_ROOT.mkdir(parents=True,exist_ok=True)
          QUOTE_DIR.mkdir(parents=True,exist_ok=True)

          if not UNIVERSE_PATH.exists():
              raise SystemExit('LIVE_UNIVERSE_MISSING_FAIL_CLOSED')
          raw=UNIVERSE_PATH.read_bytes()
          universe=json.loads(raw.decode('utf-8'))
          if universe.get('policy')!=POLICY:
              raise SystemExit('ELECTRONICS100_UNIVERSE_POLICY_MISMATCH')
          if universe.get('scope')!=SCOPE:
              raise SystemExit('ELECTRONICS100_UNIVERSE_SCOPE_MISMATCH')
          source_run_id=str(universe.get('source_run_id') or '')
          if not source_run_id.startswith('HENGCE_TWSE_ELECTRONICS100_'):
              raise SystemExit('ELECTRONICS100_SOURCE_RUN_MISMATCH')
          symbols=[str(x).strip() for x in universe.get('symbols',[])]
          if len(symbols)!=100 or len(symbols)!=len(set(symbols)):
              raise SystemExit('ELECTRONICS100_UNIVERSE_MUST_BE_EXACTLY_100_UNIQUE')
          bad=[x for x in symbols if not re.fullmatch(r'[1-9]\d{3}',x)]
          if bad:
              raise SystemExit(f'ELECTRONICS100_BAD_SYMBOLS:{bad[:10]}')
          rows=universe.get('rows',[])
          row_symbols=[str(r.get('Ticker')) for r in rows if r.get('Ticker')]
          if row_symbols!=symbols:
              raise SystemExit('ELECTRONICS100_ROWS_SYMBOL_ORDER_MISMATCH')
          bad_scope=[r for r in rows if r.get('market')!='TWSE' or str(r.get('industry_code')) not in ALLOWED_INDUSTRY]
          if bad_scope:
              raise SystemExit(f'NON_TWSE_ELECTRONICS_MEMBER:{bad_scope[:3]}')
          if int(universe.get('requested_count',-1))!=100:
              raise SystemExit('ELECTRONICS100_REQUESTED_COUNT_MISMATCH')

          universe_sha=hashlib.sha256(raw).hexdigest()
          universe_version=universe.get('version')
          universe_target_date=universe.get('target_date')
          BASE='https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/'

          def now_tw(): return datetime.now(TZ)
          def market_phase(dt):
              if dt.weekday()>=5: return 'closed'
              minute=dt.hour*60+dt.minute
              if minute<540: return 'preopen'
              if minute<=810: return 'open'
              return 'closed'
          def parse_ts(v):
              if v in (None,''): return None
              try:
                  v=float(v)
                  if v>=1e14: v/=1_000_000
                  elif v>=1e11: v/=1_000
                  return datetime.fromtimestamp(v,TZ)
              except Exception: return None
          def age(now,dt): return None if dt is None else max(0,int((now-dt).total_seconds()))
          def level(v): return v[0] if isinstance(v,list) and v and isinstance(v[0],dict) else {}
          def load_previous(symbol):
              p=QUOTE_DIR/f'{symbol}.json'
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return None

          def fetch(symbol):
              req=urllib.request.Request(
                  BASE+symbol,
                  headers={
                      'X-API-KEY':API_KEY,
                      'Accept':'application/json',
                      'User-Agent':'HENGCE-TWSE-ELECTRONICS100-LIVE/1.0'
                  }
              )
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req,timeout=15) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (401,403):
                          raise RuntimeError(f'AUTH_OR_PLAN_HTTP_{e.code}')
                      if e.code==429:
                          if attempt==3:
                              raise RuntimeError('RATE_LIMIT_HTTP_429')
                          retry_after=e.headers.get('Retry-After') if e.headers else None
                          try:
                              wait=max(float(retry_after), 3.0*(attempt+1)) if retry_after else 3.0*(attempt+1)
                          except Exception:
                              wait=3.0*(attempt+1)
                          time.sleep(wait+random.uniform(0.2,0.8))
                          continue
                      if 500<=e.code<=599:
                          if attempt==3:
                              raise RuntimeError(f'SERVER_HTTP_{e.code}')
                          time.sleep((2**attempt)+random.uniform(0.2,0.8))
                          continue
                      raise
                  except Exception:
                      if attempt==3: raise
                      time.sleep((2**attempt)+random.uniform(0.2,0.8))

          snap=now_tw()
          snapshot_id=snap.strftime('%Y%m%dT%H%M%S%z')
          expires=snap+timedelta(seconds=CACHE_TTL_SECONDS)
          records=[]; failures=[]; successful=0
          for idx,symbol in enumerate(symbols):
              try:
                  row=fetch(symbol)
                  if not isinstance(row,dict): raise RuntimeError('INVALID_RESPONSE')
                  if str(row.get('symbol'))!=symbol: raise RuntimeError('SYMBOL_MISMATCH')
                  name=row.get('name')
                  if not name: raise RuntimeError('NAME_MISSING')
                  total=row.get('total') or {}; last=row.get('lastTrade') or {}; trial=row.get('lastTrial') or {}; halt=row.get('tradingHalt') or {}
                  bid=level(row.get('bids')); ask=level(row.get('asks'))
                  qt=parse_ts(row.get('lastUpdated')); tt=parse_ts(last.get('time'))
                  price=last.get('price'); prev=row.get('previousClose')
                  chg=pct=None
                  if price is not None and prev not in (None,0):
                      chg=round(float(price)-float(prev),4)
                      pct=round((float(price)/float(prev)-1)*100,4)
                  qdate=row.get('date'); is_trial=bool(row.get('isTrial',False))
                  rec={
                      'schema_version':3,'snapshot_id':snapshot_id,'symbol':symbol,'company_name':name,
                      'price':price,'previous_close':prev,'reference_price':row.get('referencePrice'),
                      'open':row.get('openPrice'),'high':row.get('highPrice'),'low':row.get('lowPrice'),'avg_price':row.get('avgPrice'),
                      'change':chg,'change_percent':pct,'volume':total.get('tradeVolume'),'trade_value':total.get('tradeValue'),
                      'transactions':total.get('transaction'),'volume_at_bid':total.get('tradeVolumeAtBid'),'volume_at_ask':total.get('tradeVolumeAtAsk'),
                      'best_bid':bid.get('price'),'best_bid_size':bid.get('size'),'best_ask':ask.get('price'),'best_ask_size':ask.get('size'),
                      'last_trade_time':tt.isoformat() if tt else None,'trade_age_seconds':age(snap,tt),
                      'trade_idle_warning': age(snap,tt) is not None and age(snap,tt)>TRADE_IDLE_SECONDS,
                      'source_last_price':row.get('lastPrice'),'source_last_updated':qt.isoformat() if qt else None,'quote_age_seconds':age(snap,qt),
                      'is_trial':is_trial,'trial_price':row.get('lastPrice') if is_trial else None,'last_trial_price':trial.get('price'),
                      'is_halted':bool(halt.get('isHalted',False)),'is_limit_up_price':bool(row.get('isLimitUpPrice',False)),
                      'is_limit_down_price':bool(row.get('isLimitDownPrice',False)),'is_delayed_open':bool(row.get('isDelayedOpen',False)),
                      'is_delayed_close':bool(row.get('isDelayedClose',False)),'quote_date':qdate,
                      'stale_at_publish':qdate!=snap.date().isoformat(),'fetch_ok':True,'fetched_at_taipei':now_tw().isoformat(),
                      'cache_expires_at_taipei':expires.isoformat(),'market_phase':market_phase(snap),'source':'Fugle MarketData',
                      'universe_scope':SCOPE,'universe_version':universe_version,'universe_source_run_id':source_run_id
                  }
                  records.append(rec); successful+=1
                  (QUOTE_DIR/f'{symbol}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception as e:
                  err=str(e); failures.append({'symbol':symbol,'error':err})
                  old=load_previous(symbol)
                  if old:
                      old['fetch_ok']=False
                      old['stale_at_publish']=True
                      old['fetch_error']=err
                      old['last_fetch_attempt_taipei']=now_tw().isoformat()
                      records.append(old)
              if idx < len(symbols)-1:
                  time.sleep(REQUEST_GAP_SECONDS+random.uniform(0.02,0.12))

          if successful==0:
              raise SystemExit('ELECTRONICS100_ALL_REQUESTS_FAILED')
          payload={
              'schema_version':3,'service':'HENGCE TWSE ELECTRONICS 100 LIVE QUOTES','snapshot_id':snapshot_id,
              'generated_at_taipei':now_tw().isoformat(),'cache_expires_at_taipei':expires.isoformat(),'cache_ttl_seconds':CACHE_TTL_SECONDS,
              'market_phase':market_phase(snap),'universe_policy':POLICY,'universe_scope':SCOPE,'universe_version':universe_version,
              'universe_target_date':universe_target_date,'universe_source_run_id':source_run_id,'universe_sha256':universe_sha,
              'requested_count':len(symbols),'success_count':successful,'failure_count':len(failures),
              'stale_count':sum(bool(x.get('stale_at_publish')) for x in records),'trial_count':sum(bool(x.get('is_trial')) for x in records),
              'halted_count':sum(bool(x.get('is_halted')) for x in records),'failures':failures,'data':records,
              'request_gap_seconds':REQUEST_GAP_SECONDS,
              'authority':'INTRADAY_QUOTE_TRANSPORT_ONLY_NO_MODEL_RANKING_AUTHORITY'
          }
          status={k:v for k,v in payload.items() if k!='data'}
          status['healthy']=successful>=98 and payload['stale_count']<=2
          Path('legacy_latest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT_ROOT/'active.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT_ROOT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HENGCE TWSE ELECTRONICS100 SNAPSHOT',snapshot_id,successful,'/',len(symbols),source_run_id)
          PY

      - name: Validate TWSE electronics100 hard bind
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('legacy_latest.json').read_text(encoding='utf-8'))
          universe=json.loads(Path('hengce/legacy/live_universe.json').read_text(encoding='utf-8'))
          expected=[str(x) for x in universe.get('symbols',[])]
          actual=[str(x.get('symbol')) for x in latest.get('data',[])]
          failed={str(x.get('symbol')) for x in latest.get('failures',[])}
          if latest.get('requested_count')!=100 or len(expected)!=100:
              raise SystemExit('ELECTRONICS100_REQUESTED_COUNT_MISMATCH')
          if latest.get('universe_source_run_id')!=universe.get('source_run_id'):
              raise SystemExit('ELECTRONICS100_SOURCE_RUN_MISMATCH')
          if latest.get('universe_policy')!='TWSE_LISTED_ELECTRONICS_100_HARD_BIND':
              raise SystemExit('ELECTRONICS100_POLICY_MISMATCH')
          if latest.get('universe_scope')!='TWSE_LISTED_ELECTRONICS_ONLY':
              raise SystemExit('ELECTRONICS100_SCOPE_MISMATCH')
          silent=[x for x in expected if x not in actual and x not in failed]
          if silent:
              raise SystemExit(f'ELECTRONICS100_SILENT_MISSING:{silent[:10]}')
          print('HENGCE TWSE ELECTRONICS100 HARD-BIND VERIFIED',latest.get('requested_count'),latest.get('success_count'),latest.get('failure_count'))
          PY

      - name: Commit isolated live snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-electronics100-live-bot'
          git config user.email 'hengce-electronics100-live-bot@users.noreply.github.com'
          git add legacy_latest.json legacy_live/
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE TWSE electronics100 live ${TS}"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
