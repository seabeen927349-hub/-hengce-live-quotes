name: HENGCE Q012 microstructure shadow

"on":
  workflow_dispatch:
  push:
    paths:
      - "research/q012/**"
      - ".github/workflows/hengce-q012-microstructure.yml"
  schedule:
    # Taiwan regular session 09:00-13:25 (UTC+8), weekdays.
    - cron: "*/15 1-4 * * 1-5"
    - cron: "0-15/15 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: hengce-q012-microstructure
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      # Frozen from committed HENGCE_DAILY_CLOSE_20261007_R1 D active pool.
      # Capture universe != recommendation list.
      HENGCE_SYMBOLS: "7711,3443,3605,1326,2351,2615,4736,5876,2426,3006,6770,2605,2801,2881,6426"
      HENGCE_MICRO_OUT: ${{ github.workspace }}/hengce_microstructure
      # Official TWSE 2026 weekday closures. Weekend closures are already excluded by cron.
      TWSE_CLOSED_DATES_2026: "2026-01-01,2026-02-12,2026-02-13,2026-02-16,2026-02-17,2026-02-18,2026-02-19,2026-02-20,2026-02-27,2026-04-03,2026-04-06,2026-05-01,2026-06-19,2026-09-25,2026-09-28,2026-10-09,2026-10-26,2026-12-25"

    steps:
      - name: Gate scheduled runs by TWSE trading calendar
        id: market_day
        shell: bash
        run: |
          set -euo pipefail
          TODAY_TW=$(TZ=Asia/Taipei date +%F)
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "is_open=true" >> "$GITHUB_OUTPUT"
            echo "Q012 non-scheduled transport/deployment check: ${TODAY_TW}"
            exit 0
          fi
          if [[ ",${TWSE_CLOSED_DATES_2026}," == *",${TODAY_TW},"* ]]; then
            echo "is_open=false" >> "$GITHUB_OUTPUT"
            echo "Q012_SKIP_TWSE_CLOSED_DATE=${TODAY_TW}"
          else
            echo "is_open=true" >> "$GITHUB_OUTPUT"
            echo "Q012_TWSE_TRADING_DATE=${TODAY_TW}"
          fi

      - name: Checkout existing vessel repo
        if: steps.market_day.outputs.is_open == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.market_day.outputs.is_open == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frozen collector dependency
        if: steps.market_day.outputs.is_open == 'true'
        shell: bash
        run: npm install --no-save @fugle/marketdata

      - name: Capture Q-012 books and trades
        if: steps.market_day.outputs.is_open == 'true'
        id: capture
        shell: bash
        run: |
          set +e
          timeout 90s node research/q012/HENGCE_MICROSTRUCTURE_SHADOW_COLLECTOR_v0_1.mjs
          RC=$?
          set -e
          # timeout(124) is expected: collector is intentionally bounded per Actions run.
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 124 ]; then
            echo "collector_exit_code=$RC"
            exit "$RC"
          fi
          echo "collector_exit_code=$RC"

      - name: Verify raw capture and freeze hashes
        if: steps.market_day.outputs.is_open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hengce_microstructure/verification

          BOOKS=$(find hengce_microstructure -type f -name '*.books.ndjson' 2>/dev/null | wc -l | tr -d ' ')
          TRADES=$(find hengce_microstructure -type f -name '*.trades.ndjson' 2>/dev/null | wc -l | tr -d ' ')
          BYTES=$(find hengce_microstructure -type f -name '*.ndjson' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{print s+0}')

          {
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "books_files=${BOOKS}"
            echo "trades_files=${TRADES}"
            echo "raw_bytes=${BYTES}"
            echo "universe=7711,3443,3605,1326,2351,2615,4736,5876,2426,3006,6770,2605,2801,2881,6426"
            echo "source_run=HENGCE_DAILY_CLOSE_20261007_R1"
          } > hengce_microstructure/verification/capture_status.txt

          find hengce_microstructure -type f -name '*.ndjson' -print0 2>/dev/null \
            | sort -z \
            | xargs -0 -r sha256sum \
            > hengce_microstructure/verification/SHA256SUMS.txt

          cat hengce_microstructure/verification/capture_status.txt

          # Scheduled in-session runs must produce both direct observables.
          # Push/manual runs outside market hours are deployment transport checks only.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ "$BOOKS" -lt 1 ] || [ "$TRADES" -lt 1 ] || [ "$BYTES" -lt 1 ]; then
              echo "Q012_SCHEDULED_CAPTURE_NO_REAL_BOOKS_TRADES"
              exit 12
            fi
          fi

      - name: Extract frozen Q-012 features when raw exists
        if: steps.market_day.outputs.is_open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find hengce_microstructure -type f -name '*.ndjson' -print0 2>/dev/null)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No raw events yet; feature extraction deferred."
            exit 0
          fi
          python3 research/q012/HENGCE_MICROSTRUCTURE_FEATURES_v0_1.py \
            "${FILES[@]}" \
            --out hengce_microstructure/features.ndjson

      - name: Upload immutable Q-012 raw artifact
        if: steps.market_day.outputs.is_open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HENGCE_Q012_${{ github.run_id }}_${{ github.run_attempt }}
          path: hengce_microstructure/
          if-no-files-found: error
          retention-days: 90
