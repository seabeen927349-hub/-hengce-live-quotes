name: HENGCE Live Overlay Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-live-overlay-export.yml'
      - 'scripts/hengce_q017_observation_lock_v5.py'
      - 'scripts/hengce_q017_authority_guard_v5.py'
      - 'scripts/hengce_q017_backup_observer_v5.py'
      - 'scripts/hengce_q017_recovery_compute_v5.py'
      - 'scripts/test_hengce_q017_resilience_v5.py'
      - 'scripts/hengce_q017_decision_lock_v4.py'
      - 'scripts/hengce_q017_decision_lock.py'
      - 'scripts/hengce_daily_command_center.py'
      - 'scripts/hengce_daily_command_center_core_legacy.py'
      - 'scripts/hengce_e2_live.py'
      - 'hengce/e2_live/**'
      - 'hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_5_20261019.json'
      - '.github/workflows/hengce-daily-command-center.yml'
      - '.github/workflows/hengce-q017-authority-guard.yml'
      - '.github/workflows/hengce-q017-backup-observer.yml'
      - '.github/workflows/hengce-q017-recovery.yml'
      - '.github/workflows/hengce-q017-dxy-source-smoke.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned live overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/scripts export/workflows export/hengce/e2_live export/contracts
          cp scripts/hengce_q017_observation_lock_v5.py export/scripts/
          cp scripts/hengce_q017_authority_guard_v5.py export/scripts/
          cp scripts/hengce_q017_backup_observer_v5.py export/scripts/
          cp scripts/hengce_q017_recovery_compute_v5.py export/scripts/
          cp scripts/test_hengce_q017_resilience_v5.py export/scripts/
          cp scripts/hengce_q017_decision_lock_v4.py export/scripts/
          cp scripts/hengce_q017_decision_lock.py export/scripts/
          cp scripts/hengce_daily_command_center.py export/scripts/
          cp scripts/hengce_daily_command_center_core_legacy.py export/scripts/
          cp scripts/hengce_e2_live.py export/scripts/
          cp hengce/e2_live/state_latest.json export/hengce/e2_live/
          cp hengce/HENGCE_DAILY_COMMAND_CENTER_CONTRACT_v1_5_20261019.json export/contracts/
          cp .github/workflows/hengce-daily-command-center.yml export/workflows/
          cp .github/workflows/hengce-q017-authority-guard.yml export/workflows/
          cp .github/workflows/hengce-q017-backup-observer.yml export/workflows/
          cp .github/workflows/hengce-q017-recovery.yml export/workflows/
          cp .github/workflows/hengce-q017-dxy-source-smoke.yml export/workflows/
          printf '%s\n' "$(git rev-parse HEAD)" > export/GITHUB_HEAD_SHA.txt
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/LIVE_OVERLAY_SHA256SUMS.txt
          tar -czf hengce-live-overlay.tar.gz -C export .
          sha256sum hengce-live-overlay.tar.gz > hengce-live-overlay.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hengce-live-overlay
          path: |
            hengce-live-overlay.tar.gz
            hengce-live-overlay.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
