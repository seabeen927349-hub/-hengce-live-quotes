name: HENGCE TDCC FinMind Historical Full-Market 2019-2025 Research Backfill

"on":
  push:
    branches:
      - research/tdcc-finmind-historical-backfill-20261107
    paths:
      - .github/workflows/hengce-finmind-tdcc-fullmarket-2019-2025.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hengce-finmind-tdcc-fullmarket-2019-2025
  cancel-in-progress: false

jobs:
  year-archive:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical FinMind collector
        run: python -m py_compile scripts/hengce_finmind_tdcc_historical_backfill.py scripts/hengce_finmind_tdcc_marketwide_year.py
      - name: Retrieve and verify year-specific full-market weekly snapshots
        run: |
          set -euo pipefail
          python scripts/hengce_finmind_tdcc_marketwide_year.py \
            --year ${{ matrix.year }} \
            --out "/tmp/hengce-finmind-marketwide-${{ matrix.year }}"
      - name: Save isolated short-lived year archive, do not publish to Git repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-tdcc-full-market-${{ matrix.year }}
          path: /tmp/hengce-finmind-marketwide-${{ matrix.year }}/
          if-no-files-found: error
          retention-days: 1
