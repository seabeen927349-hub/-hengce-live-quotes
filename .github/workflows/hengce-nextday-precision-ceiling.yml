name: HENGCE Nextday Precision Ceiling
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_precision_ceiling.py'
      - '.github/workflows/hengce-nextday-precision-ceiling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded nextday precision ceiling test
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_precision_ceiling.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/nextday_precision_ceiling_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-precision-ceiling
          path: |
            research/codex_full_reset_20261023/nextday_precision_ceiling_result.json
            research/codex_full_reset_20261023/nextday_precision_ceiling_primary_events.jsonl
# trigger: precision-ceiling formal run 2026-10-25
