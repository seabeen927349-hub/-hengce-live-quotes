name: HENGCE E2 Morning No-Fill Release Patch Temp

on:
  push:
    branches:
      - chatgpt/e2-morning-no-fill-release-20261021
    paths:
      - .github/workflows/hengce-e2-morning-release-patch-temp.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only morning NO_FILL release persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/hengce_e2_live.py')
          s=p.read_text(encoding='utf-8')
          old='''    elif pos.get("state") == "NO_FILL":\n        state["paper_position"] = pos\n        state["engine_status"] = "NO_FILL"\n        state["action"] = "NO_FILL"\n        state["generated_at_taipei"] = core.now_tw().isoformat()\n        state["execution_override"] = execution_override\n        state["strict"] = compatibility_strict("NO_FILL", state.get("top1"), "NO_FILL")\n        state["position_state"] = {"asof":target.isoformat(),"held":[],"pending":[],"no_fill":[pos],"max_slots":1,"occupied_next_session":0,"free_slots_next_session":1}\n        atomic_json(STATE, state)\n    out = {\n'''
          new='''    elif pos.get("state") == "NO_FILL":\n        state["paper_position"] = pos\n        state["engine_status"] = "NO_FILL"\n        state["action"] = "NO_FILL"\n        state["generated_at_taipei"] = core.now_tw().isoformat()\n        state["execution_override"] = execution_override\n        state["strict"] = compatibility_strict("NO_FILL", state.get("top1"), "NO_FILL")\n        state["position_state"] = {"asof":target.isoformat(),"held":[],"pending":[],"no_fill":[pos],"max_slots":1,"occupied_next_session":0,"free_slots_next_session":1}\n        atomic_json(STATE, state)\n    elif pos.get("state") == "IDLE" and execution_override.get("reason") == "PRIOR_NO_FILL_SLOT_RELEASED":\n        # Persist the next-session release. Without this write-back, morning_latest\n        # can say IDLE while state_latest incorrectly remains yesterday's NO_FILL.\n        state["paper_position"] = pos\n        state["engine_status"] = "OFF"\n        state["action"] = "OFF"\n        state["generated_at_taipei"] = core.now_tw().isoformat()\n        state["execution_override"] = execution_override\n        state["strict"] = compatibility_strict("OFF", state.get("top1"), "OFF")\n        state["position_state"] = {"asof":target.isoformat(),"held":[],"pending":[],"no_fill":[],"max_slots":1,"occupied_next_session":0,"free_slots_next_session":1}\n        atomic_json(STATE, state)\n    out = {\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Add exact 2026-10-21 morning persistence regression
        run: |
          cat > scripts/test_hengce_e2_morning_release.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import json, tempfile
          from datetime import date
          from pathlib import Path
          import hengce_e2_live as e2

          def main():
              original=(e2.STATE,e2.MORNING,e2.EXECUTION_OVERRIDE)
              try:
                  with tempfile.TemporaryDirectory() as td:
                      root=Path(td)
                      e2.STATE=root/'state_latest.json'
                      e2.MORNING=root/'morning_latest.json'
                      e2.EXECUTION_OVERRIDE=root/'execution_override.json'
                      no_fill={
                          'state':'NO_FILL','signal_date':'2026-10-19','ticker':'3026','name':'禾伸堂',
                          'score':4.801362351369969,'beta60':2.083939641519657,
                          'residual':-0.052159336205509395,'entry_due':'NEXT_TWSE_SESSION_OPEN',
                          'execution_effective_date':'2026-10-20','execution_reason':'USER_CONFIRMED_NOT_FILLED',
                          'slot_released':True,'model_signal_preserved':True,'broker_order_execution':False,
                      }
                      state={
                          'schema_version':2,'system':'HENGCE','module':'E2_PROFIT_MAX_STATE',
                          'signal_asof':'2026-10-20','engine':'E2_PROFIT_MAX','engine_status':'NO_FILL',
                          'binding_status':'PASS','action':'NO_FILL','paper_position':no_fill,
                          'top1':{'ticker':'8021','name':'尖點','score':4.805611100695378},
                          'local_gate':{'go':True},'macro_gate':{'go':False},
                          'position_state':{'asof':'2026-10-20','held':[],'pending':[],'no_fill':[no_fill],
                                            'max_slots':1,'occupied_next_session':0,'free_slots_next_session':1},
                      }
                      e2.STATE.write_text(json.dumps(state,ensure_ascii=False),encoding='utf-8')
                      e2.EXECUTION_OVERRIDE.write_text(json.dumps({
                          'version':1,'status':'NO_FILL','ticker':'3026','signal_date':'2026-10-19',
                          'effective_date':'2026-10-20','reason':'USER_CONFIRMED_NOT_FILLED'
                      }),encoding='utf-8')
                      out=e2.build_morning(date(2026,10,21))
                      persisted=json.loads(e2.STATE.read_text(encoding='utf-8'))
                      assert out['trade_date']=='2026-10-21'
                      assert out['engine_status']=='OFF'
                      assert out['paper_position']=={'state':'IDLE'}
                      assert out['new_signal_buy_count']==0 and out['entry_due_count']==0
                      assert out['held_from_prior_close']==[] and out['no_fill_from_prior_signal']==[]
                      assert out['execution_override']['reason']=='PRIOR_NO_FILL_SLOT_RELEASED'
                      assert out['broker_order_execution'] is False
                      assert persisted['paper_position']=={'state':'IDLE'}
                      assert persisted['engine_status']=='OFF' and persisted['action']=='OFF'
                      assert persisted['position_state']['occupied_next_session']==0
                      assert persisted['position_state']['free_slots_next_session']==1
                      assert persisted['position_state']['no_fill']==[]
                      assert persisted['top1']['ticker']=='8021'
                  print(json.dumps({
                      'status':'PASS','trade_date':'2026-10-21','prior_no_fill_persisted_idle':True,
                      'free_slots_next_session':1,'same_model_top1_preserved':True,
                      'candidate_b_formula_mutated':False,'broker_order_execution':False
                  },ensure_ascii=False))
                  return 0
              finally:
                  e2.STATE,e2.MORNING,e2.EXECUTION_OVERRIDE=original

          if __name__=='__main__': raise SystemExit(main())
          PY
      - name: Static and regression checks
        run: |
          python -m py_compile scripts/hengce_e2_live.py scripts/test_hengce_e2_no_fill.py scripts/test_hengce_e2_morning_release.py
          PYTHONPATH=scripts python scripts/hengce_e2_live.py --mode self-test --date 2026-10-21
          PYTHONPATH=scripts python scripts/test_hengce_e2_no_fill.py
          PYTHONPATH=scripts python scripts/test_hengce_e2_morning_release.py
      - name: Real repo-state 2026-10-21 morning dry-run
        run: |
          python scripts/hengce_e2_live.py --mode morning --date 2026-10-21 > /tmp/e2-morning-20261021.json
          python - <<'PY'
          import json
          m=json.load(open('hengce/e2_live/morning_latest.json'))
          s=json.load(open('hengce/e2_live/state_latest.json'))
          assert m['trade_date']=='2026-10-21'
          assert m['engine_status']=='OFF'
          assert m['paper_position']=={'state':'IDLE'}
          assert m['entry_due_count']==0 and m['new_signal_buy_count']==0
          assert m['held_from_prior_close']==[] and m['no_fill_from_prior_signal']==[]
          assert m['execution_override']['reason']=='PRIOR_NO_FILL_SLOT_RELEASED'
          assert m['broker_order_execution'] is False
          assert s['paper_position']=={'state':'IDLE'}
          assert s['engine_status']=='OFF' and s['action']=='OFF'
          assert s['position_state']['occupied_next_session']==0
          assert s['position_state']['free_slots_next_session']==1
          assert s['top1']['ticker']=='8021'
          print('PASS REAL_20261021_MORNING_DRY_RUN', json.dumps(m,ensure_ascii=False))
          PY
          git restore hengce/e2_live/ || true
          git clean -f hengce/e2_live/morning_latest.json || true
      - name: Verify frozen authorities untouched
        run: |
          test "$(git rev-parse HEAD:scripts/hengce_q017_observation_lock_v5.py)" = c2b44d56844fd496445220e6c55b9a031c547c4e
          test "$(git rev-parse HEAD:scripts/hengce_daily_command_center_core_legacy.py)" = 1c6194da0325162c72b56368b2cf5972bc56cc0a
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/hengce_e2_live.py').read_text()
          assert 'K = 25.0' in s
          assert 'HOLD_INTERVALS = 20' in s
          assert 'roundtrip_cost_model":0.008' in s
          assert 'RESID_MAX = 0.04' in s
          print('PASS FROZEN_MODEL_CONSTANTS')
          PY
      - name: Commit tested execution-state patch to branch
        run: |
          set -euo pipefail
          git config user.name 'hengce-test-bot'
          git config user.email 'hengce-test-bot@users.noreply.github.com'
          git add scripts/hengce_e2_live.py scripts/test_hengce_e2_morning_release.py
          git diff --cached --check
          git commit -m 'HENGCE E2: persist next-session no-fill slot release'
          git push origin HEAD:chatgpt/e2-morning-no-fill-release-20261021
