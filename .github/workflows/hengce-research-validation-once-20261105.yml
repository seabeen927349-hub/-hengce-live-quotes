name: HENGCE one-shot retired-model exploratory validation
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-research-validation-once-20261105.yml'
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare retired reference and research changes on identical EOD-open cohort
        run: python research/q017_daily_audit_20261105/compare_revisions_20261105.py > /tmp/hengce_research_experiment.json
      - name: Log experiment summary
        run: python -m json.tool /tmp/hengce_research_experiment.json
      - name: Publish research artifacts (never trading signal)
        uses: actions/upload-artifact@v4
        with:
          name: HENGCE_RETIRED_MODEL_ABLATION_RESEARCH_20261105
          path: |
            research/q017_daily_audit_20261105/Q017_REVISION_ABLATION_20261105.json
            research/q017_daily_audit_20261105/Q017_REVISION_ABLATION_REPORT_20261105.md
          if-no-files-found: error
      - name: Publish research outputs using repository contents API (no strategy mutation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,base64,pathlib,requests
          root=pathlib.Path(".")
          repo=os.environ["GITHUB_REPOSITORY"]
          paths=[
            "research/q017_daily_audit_20261105/Q017_REVISION_ABLATION_20261105.json",
            "research/q017_daily_audit_20261105/Q017_REVISION_ABLATION_REPORT_20261105.md",
          ]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          for path in paths:
            url=f"https://api.github.com/repos/{repo}/contents/{path}"
            meta=requests.get(url,headers=headers,timeout=30)
            assert meta.status_code in (200,404),(meta.status_code,meta.text[:500])
            old_sha=meta.json().get("sha") if meta.status_code==200 else None
            payload={"message":"Publish evidence-only retired Q017 revision ablation","content":base64.b64encode((root/path).read_bytes()).decode(),"branch":"main"}
            if old_sha: payload["sha"]=old_sha
            r=requests.put(url,headers=headers,json=payload,timeout=60)
            assert r.status_code in (200,201),(path,r.status_code,r.text[:800])
            print("PUBLISHED",path,r.json().get("commit",{}).get("sha"))
          PY
