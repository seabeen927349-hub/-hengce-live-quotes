name: HENGCE Nextday Precision Failure Audit
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_precision_failure_audit.py'
      - '.github/workflows/hengce-nextday-precision-failure-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen nextday precision failure audit
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_precision_failure_audit.py
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-precision-failure-audit
          path: research/codex_full_reset_20261023/nextday_precision_failure_audit_result.json
