name: HENGCE Escape TWSE Common FinMind Shadow

"on":
  push:
    branches:
      - main
    paths:
      - 'scripts/hengce_escape_finmind_twse_common_shadow.py'
      - 'scripts/hengce_escape_intraday_monitor_adapter.py'
      - 'scripts/hengce_finmind_twse_common_snapshot_probe.py'
      - 'scripts/hengce_twse_session_status_probe.py'
      - 'scripts/hengce_finmind_intraday_freshness_gate.py'
      - 'scripts/hengce_finmind_trigger_gate.py'
      - 'tests/engineering/test_hengce_finmind_intraday_freshness_gate.py'
      - 'tests/engineering/test_hengce_finmind_schedule_recovery.py'
      - 'governance/HENGCE_TWSE_COMMON_NONTRADING_EXCEPTIONS_20261103.json'
      - '.github/workflows/hengce-escape-twse-full-market-finmind-shadow.yml'
  pull_request:
    paths:
      - 'scripts/hengce_escape_finmind_twse_common_shadow.py'
      - 'scripts/hengce_escape_intraday_monitor_adapter.py'
      - 'scripts/hengce_finmind_twse_common_snapshot_probe.py'
      - 'scripts/hengce_twse_session_status_probe.py'
      - 'scripts/hengce_finmind_intraday_freshness_gate.py'
      - 'scripts/hengce_finmind_trigger_gate.py'
      - 'tests/engineering/test_hengce_finmind_intraday_freshness_gate.py'
      - 'tests/engineering/test_hengce_finmind_schedule_recovery.py'
      - 'governance/HENGCE_TWSE_COMMON_NONTRADING_EXCEPTIONS_20261103.json'
      - '.github/workflows/hengce-escape-twse-full-market-finmind-shadow.yml'
  workflow_dispatch:
  # Backup wake-up by an existing independent scheduled HENGCE workflow.
  # It invokes THIS SAME FinMind job, never a parallel collector or market universe.
  workflow_run:
    workflows:
      - HENGCE Frozen Single-Name Live Quotes
      - HENGCE Governed SOX VIX Premarket EOD
      - HENGCE HBA Daily Surveillance Research Sidecar
    types: [completed]
  schedule:
    # Re-register the schedule actor and use offset 03,08,... (UTC/Taipei +8).
    # UTC 01:03–05:33 = Asia/Taipei 09:03–13:33, weekday only.
    # GitHub schedule is best effort: it may be delayed or dropped.
    - cron: "3-58/5 1-4 * * 1-5"
    - cron: "3-33/5 5 * * 1-5"

permissions:
  contents: write

concurrency:
  # Same writer lease as existing HBA surveillance: prevent concurrent HBA
  # output changes from invalidating the conservative-all FinMind publisher.
  # We KEEP the publisher's fail-closed dependency checks unchanged.
  group: hengce-hba-surveillance-research
  # Never cancel a half-published monitor when the next scheduled tick arrives.
  cancel-in-progress: false

jobs:
  trigger-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow_run origin and TWSE session timing
        id: guard
        shell: bash
        run: python scripts/hengce_finmind_trigger_gate.py

  shadow-context:
    needs: trigger-gate
    if: needs.trigger-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Checkout current authoritative main for governed publication
        uses: actions/checkout@v4
        with:
          # A push run can start from an OLD event SHA while HBA publishes
          # newer evidence. Use live main for data runs; PRs still test the
          # actual proposed PR head. Never rebase computed old inputs.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official FinMind client
        if: github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check finmind-mcp
      - name: Compile monitor vessel
        run: |
          python -m py_compile scripts/hengce_finmind_twse_common_snapshot_probe.py
          python -m py_compile scripts/hengce_twse_session_status_probe.py
          python -m py_compile scripts/hengce_escape_finmind_twse_common_shadow.py
          python -m py_compile scripts/hengce_escape_intraday_monitor_adapter.py
          python -m py_compile scripts/hengce_finmind_intraday_freshness_gate.py
      - name: FinMind stale, future, hash and authority offline regressions
        run: |
          python -m unittest discover -s tests/engineering -p 'test_hengce_finmind_intraday_freshness_gate.py' -v
          python -m unittest discover -s tests/engineering -p 'test_hengce_finmind_schedule_recovery.py' -v
      - name: Build non-raw aggregate shadow context
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FINMIND_TOKEN:-}"
          mkdir -p /tmp/hengce-finmind-shadow
          python scripts/hengce_escape_finmind_twse_common_shadow.py \
            --context /tmp/hengce-finmind-shadow/context.json \
            --status /tmp/hengce-finmind-shadow/status.json
      - name: Build intraday monitor payload
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_escape_intraday_monitor_adapter.py \
            --context /tmp/hengce-finmind-shadow/context.json \
            --status /tmp/hengce-finmind-shadow/status.json \
            --out /tmp/hengce-finmind-shadow/intraday_monitor.json
      - name: Assert authority and frozen metric boundary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          EXPECTED_METRIC_SHA='1d93c171b0b06d49eef19e0bf63e3b086fc366052d6bbc45516928c672f47281'
          root=Path('/tmp/hengce-finmind-shadow')
          context=json.loads((root/'context.json').read_text(encoding='utf-8'))
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          monitor=json.loads((root/'intraday_monitor.json').read_text(encoding='utf-8'))
          for x in (context,status):
              assert x['metric_contract_sha256']==EXPECTED_METRIC_SHA
              assert x['intraday_metric_role']=='PROVISIONAL_PRICE_LIQUIDITY_CONTEXT_ONLY'
              assert x['price_liquidity_shadow_only'] is True
              assert x['feature_detector_input_authority'] is False
              assert x['formal_metric_authority'] is False
              assert x['rolling_metric_authority'] is False
              assert x['one_day_change_rate_may_substitute_locked_ew_return'] is False
              assert x['missing_as_zero_forbidden'] is True
              assert x['source_binding_promotion_authority'] is False
              assert x['twse_mis_metric_values_used'] is False
              assert x['session_context_may_substitute_metric_observation'] is False
              assert x['metric_unknown_count']==x['stale_or_noncurrent_count']
              assert x['finmind_metric_observation_count']+x['metric_unknown_count']==x['active_required_count']
              assert x['session_context_count']>=x['finmind_metric_observation_count']
              assert x['session_context_count']<=x['active_required_count']
          assert status['state']=='SHADOW_CONTEXT_READY_NO_FORMAL_AUTHORITY'
          assert status['active_universe_transport_full_coverage'] is True
          assert status['unexpected_missing_count']==0
          assert status['raw_finmind_rows_persisted'] is False
          assert status['raw_twse_mis_rows_persisted'] is False
          assert status['per_security_rows_persisted'] is False
          assert status['stale_rows_neutralized_as_zero'] is False
          assert status['formal_escape_authority'] is False
          assert status['formal_eod_authority'] is False
          assert status['trading_authority'] is False
          assert context['raw_finmind_rows_persisted'] is False
          assert context['raw_twse_mis_rows_persisted'] is False
          assert context['per_security_rows_persisted'] is False
          assert context['stale_rows_neutralized_as_zero'] is False
          assert context['formal_escape_state_creation'] is False
          assert context['trading_authority'] is False
          assert context['active_required_count'] >= 900
          assert context['market']['constituent_count'] == context['active_required_count']
          assert context['market']['return_observed_count'] == status['finmind_metric_observation_count']
          assert 0 < status['current_market_date_ratio'] <= 1
          assert monitor['schema']=='HENGCE_ESCAPE_INTRADAY_MONITOR_V1'
          assert monitor['monitor_state']=='LIVE_CONTEXT_READY'
          assert monitor['metric_contract_sha256']==EXPECTED_METRIC_SHA
          assert monitor['active_universe_transport_full_coverage'] is True
          assert monitor['formal_escape_level'] is None
          assert monitor['formal_escape_authority'] is False
          assert monitor['formal_eod_authority'] is False
          assert monitor['feature_detector_input_authority'] is False
          assert monitor['trading_authority'] is False
          assert monitor['canonical_eod_legs_replaced'] is False
          assert monitor['quality']['raw_finmind_rows_persisted'] is False
          assert monitor['quality']['per_security_rows_persisted'] is False
          print(json.dumps({
              'monitor_state': monitor['monitor_state'],
              'market_date': monitor['market_date'],
              'active_required_count': monitor['active_required_count'],
              'finmind_metric_observation_count': monitor['finmind_metric_observation_count'],
              'metric_unknown_count': monitor['metric_unknown_count'],
              'latest_source_timestamp': monitor['latest_source_timestamp'],
              'formal_escape_level': monitor['formal_escape_level'],
              'formal_escape_authority': monitor['formal_escape_authority'],
              'payload_sha256': monitor['payload_sha256'],
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Verify FinMind receipt integrity, coverage and current-session freshness
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hengce_finmind_intraday_freshness_gate.py \
            --context /tmp/hengce-finmind-shadow/context.json \
            --status /tmp/hengce-finmind-shadow/status.json \
            --monitor /tmp/hengce-finmind-shadow/intraday_monitor.json
      - name: Upload non-raw aggregate monitor receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-twse-common-monitor
          path: /tmp/hengce-finmind-shadow/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish latest aggregate monitor state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p escape_live
          cp /tmp/hengce-finmind-shadow/context.json escape_live/finmind_twse_common_context.json
          cp /tmp/hengce-finmind-shadow/status.json escape_live/finmind_twse_common_status.json
          cp /tmp/hengce-finmind-shadow/intraday_monitor.json escape_live/intraday_monitor.json
          git config user.name "hengce-escape-bot"
          git config user.email "hengce-escape-bot@users.noreply.github.com"
          git add escape_live/finmind_twse_common_context.json escape_live/finmind_twse_common_status.json escape_live/intraday_monitor.json
          if git diff --cached --quiet; then
            echo "No aggregate monitor changes to publish"
            exit 0
          fi
          git commit -m "data(escape): refresh FinMind aggregate intraday monitor"
          # Use the existing governed exact-lease publisher. Never blindly
          # rebase a snapshot onto a changed source or overwrite a newer run.
          python scripts/hengce_publish.py \
            --profile conservative-all \
            --report-dir "${RUNNER_TEMP}/hengce-finmind-publication"

      - name: Retain FinMind governed publication diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-governed-publication
          path: ${{ runner.temp }}/hengce-finmind-publication
          if-no-files-found: ignore
          retention-days: 7
