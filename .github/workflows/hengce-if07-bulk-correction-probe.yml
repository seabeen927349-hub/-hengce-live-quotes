name: HENGCE IF07 Bulk Correction Probe No Returns

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_bulk_correction_probe.py'
      - '.github/workflows/hengce-if07-bulk-correction-probe.yml'

permissions:
  contents: read

concurrency:
  group: hengce-if07-bulk-correction-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run quarterly correction-list controls — no returns
        run: python research/selection_core_rebuild/if07_bulk_correction_probe.py
      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_BULK_CORRECTION_PROBE.json
      - uses: actions/upload-artifact@v4
        with:
          name: if07-bulk-correction-probe
          path: research/selection_core_rebuild/generated/IF07_BULK_CORRECTION_PROBE.json
          if-no-files-found: error
