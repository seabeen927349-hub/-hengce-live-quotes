name: HENGCE TDCC Ownership Canonical Vessel

on:
  schedule:
    - cron: '25 15 * * *'  # 23:25 Asia/Taipei — formal daily ownership check
    - cron: '7,17,27,37,47,57 * * * *'  # prospective first-observed carrier
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hengce_tdcc_ownership_ingest.py'
      - '.github/workflows/hengce-tdcc-ownership-daily.yml'

permissions:
  contents: write

concurrency:
  group: hengce-tdcc-ownership-canonical-vessel
  cancel-in-progress: false

jobs:
  canonical_ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical vessel repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch TDCC once and derive ownership plus provenance from exact same bytes
        run: python scripts/hengce_tdcc_ownership_ingest.py

      - name: Validate canonical provenance and create one-time high-frequency schedule proof
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path('ownership/tdcc/provenance')
          current=json.loads((root/'current.json').read_text(encoding='utf-8'))
          sha=current['payload_sha256']
          payload=root/'payloads'/f'{sha}.csv'
          first=root/'first_observed'/f'{sha}.json'
          if not payload.exists() or not first.exists():
              raise SystemExit('TDCC_CANONICAL_PROVENANCE_MISSING')
          if hashlib.sha256(payload.read_bytes()).hexdigest()!=sha:
              raise SystemExit('TDCC_CANONICAL_PAYLOAD_HASH_MISMATCH')
          meta=json.loads(first.read_text(encoding='utf-8'))
          if meta.get('payload_sha256')!=sha:
              raise SystemExit('TDCC_FIRST_OBSERVED_HASH_MISMATCH')
          if current.get('provenance_source_authority')!='CANONICAL_VESSEL_RESPONSE_ONLY':
              raise SystemExit('TDCC_PROVENANCE_NOT_CANONICAL_VESSEL')
          if current.get('network_fetch_count_for_this_payload')!=1:
              raise SystemExit('TDCC_DUPLICATE_FETCH_GUARD_FAILED')
          if current.get('ownership_and_provenance_share_exact_response_bytes') is not True:
              raise SystemExit('TDCC_RESPONSE_BYTES_NOT_SHARED')
          if current.get('official_published_at') is not None or meta.get('official_published_at') is not None:
              raise SystemExit('TDCC_OFFICIAL_PUBLICATION_MUST_REMAIN_NULL_WITHOUT_PROOF')
          if current.get('historical_latency_status')!='DATA_BLOCKED':
              raise SystemExit('TDCC_HISTORICAL_LATENCY_GOVERNANCE_VIOLATION')
          if current.get('prospective_live_latency_status')!='COLLECTING':
              raise SystemExit('TDCC_PROSPECTIVE_LATENCY_GOVERNANCE_VIOLATION')

          # Persist only the FIRST genuine high-frequency schedule proof. This is
          # evidence that the canonical vessel ran unattended; it is not global
          # deployment/trading/model authority.
          hf='7,17,27,37,47,57 * * * *'
          proof_path=root/'schedule_proofs'/'first_verified_high_frequency_schedule.json'
          if (current.get('github_event_name')=='schedule'
                  and current.get('github_schedule')==hf
                  and current.get('schedule_proof') is True
                  and not proof_path.exists()):
              proof_path.parent.mkdir(parents=True,exist_ok=True)
              proof={
                  'schema_version':1,
                  'proof_scope':'TDCC_CANONICAL_VESSEL_ONLY',
                  'github_event_name':'schedule',
                  'github_schedule':hf,
                  'github_run_id':current.get('github_run_id'),
                  'github_run_attempt':current.get('github_run_attempt'),
                  'github_workflow':current.get('github_workflow'),
                  'github_workflow_ref':current.get('github_workflow_ref'),
                  'github_sha_at_trigger':current.get('github_sha_at_trigger'),
                  'request_started_at_taipei':current.get('request_started_at_taipei'),
                  'response_received_at_taipei':current.get('response_received_at_taipei'),
                  'payload_sha256':sha,
                  'snapshot_reference_date':current.get('snapshot_reference_date'),
                  'provenance_source_authority':'CANONICAL_VESSEL_RESPONSE_ONLY',
                  'network_fetch_count_for_this_payload':1,
                  'ownership_and_provenance_share_exact_response_bytes':True,
                  'historical_latency_status':'DATA_BLOCKED',
                  'prospective_live_latency_status':'COLLECTING',
                  'official_published_at':None,
                  'global_unattended_deployment_authority_created':False,
                  'model_authority_created':False,
                  'trading_authority_created':False,
              }
              proof_path.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('TDCC_FIRST_CANONICAL_SCHEDULE_PROOF_CREATED',proof_path)
          else:
              print('TDCC_CANONICAL_VALID',current.get('github_event_name'),current.get('github_schedule'),sha)
          PY

      - name: Commit only new canonical payload evidence or first schedule proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-tdcc-ownership'
          git config user.email 'actions@users.noreply.github.com'

          IS_NEW="$(python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('ownership/tdcc/provenance/current.json').read_text(encoding='utf-8'))
          print('1' if x.get('new_payload_first_observed') is True else '0')
          PY
          )"

          if [ "$IS_NEW" = '1' ]; then
            git add ownership/tdcc
          else
            git add ownership/tdcc/provenance/schedule_proofs/ 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo 'No new TDCC canonical evidence to commit.'
            exit 0
          fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE TDCC canonical vessel evidence ${TS}"

          # Same-payload checks intentionally leave transient current/attempt
          # observations outside the evidence commit. Clear them only after the
          # evidence commit so pull --rebase cannot be blocked by expected local state.
          git restore --worktree -- ownership/tdcc || true
          git clean -fd -- ownership/tdcc

          git pull --rebase origin main
          git push origin HEAD:main
