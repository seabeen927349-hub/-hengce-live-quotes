name: HENGCE TDCC Ownership Daily
# launcher-touch: 2026-11-01-prospective-schedule-carrier

on:
  schedule:
    - cron: '25 15 * * *'  # 23:25 Asia/Taipei — formal daily ownership ingest
    - cron: '7,17,27,37,47,57 * * * *'  # prospective TDCC first-observed carrier
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hengce_tdcc_ownership_ingest.py'
      - '.github/workflows/hengce-tdcc-ownership-daily.yml'

permissions:
  contents: write

concurrency:
  group: hengce-tdcc-ownership-daily
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'schedule' || github.event.schedule == '25 15 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formal vessel repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests

      - name: Check official TDCC dataset and ingest only a new snapshot
        run: python scripts/hengce_tdcc_ownership_ingest.py

      - name: Commit validated TDCC vessel state
        shell: bash
        run: |
          git config user.name 'hengce-tdcc-ownership'
          git config user.email 'actions@users.noreply.github.com'
          git add ownership/tdcc
          if git diff --cached --quiet; then
            echo 'TDCC ownership snapshot unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'HENGCE TDCC ownership daily ingest'
          git push origin HEAD:main

  prospective_tdcc_first_observed:
    if: github.event_name == 'schedule' && github.event.schedule == '7,17,27,37,47,57 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hengce-prospective-tdcc-first-observed-global
      cancel-in-progress: false
    steps:
      - name: Checkout frozen research ledger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/loss-forensics-20261101

      - name: Native schedule carrier heartbeat and TDCC first-observed poll
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, hashlib, io, json, os, re, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ=ZoneInfo('Asia/Taipei')
          ENDPOINT='https://opendata.tdcc.com.tw/getOD.ashx?id=1-5'
          ROOT=Path('research/loss_forensics/prospective_live/tdcc')
          PAYLOADS=ROOT/'payloads'
          FIRST=ROOT/'first_observed'
          ATTEMPTS=ROOT/'attempts'
          for p in (ROOT,PAYLOADS,FIRST,ATTEMPTS):
              p.mkdir(parents=True,exist_ok=True)

          def now_tw():
              return datetime.now(TZ)

          def norm_date(value):
              s=str(value or '').strip()
              digits=re.sub(r'\D','',s)
              try:
                  if len(digits)==8:
                      y,mo,d=int(digits[:4]),int(digits[4:6]),int(digits[6:8])
                      if 1900<=y<=2100:
                          return datetime(y,mo,d).date().isoformat()
                  if len(digits)==7:
                      y,mo,d=1911+int(digits[:3]),int(digits[3:5]),int(digits[5:7])
                      return datetime(y,mo,d).date().isoformat()
              except ValueError:
                  return None
              return None

          started=now_tw()
          event_name=os.environ.get('GITHUB_EVENT_NAME')
          run_id=os.environ.get('GITHUB_RUN_ID')
          run_attempt=os.environ.get('GITHUB_RUN_ATTEMPT')
          workflow=os.environ.get('GITHUB_WORKFLOW')
          workflow_ref=os.environ.get('GITHUB_WORKFLOW_REF')
          ref_at_trigger=os.environ.get('GITHUB_REF')
          sha_at_trigger=os.environ.get('GITHUB_SHA')

          heartbeat={
              'schema_version':3,
              'observed_at_taipei':started.isoformat(),
              'github_event_name':event_name,
              'github_run_id':run_id,
              'github_run_attempt':run_attempt,
              'github_workflow':workflow,
              'github_workflow_ref':workflow_ref,
              'github_ref_at_trigger':ref_at_trigger,
              'github_sha_at_trigger':sha_at_trigger,
              'native_schedule_carrier':'.github/workflows/hengce-tdcc-ownership-daily.yml',
              'native_schedule_expression':'7,17,27,37,47,57 * * * *',
              'schedule_proof':event_name=='schedule',
              'collector_status':'TRIGGERED_NOT_YET_POLLED',
              'historical_latency_status':'DATA_BLOCKED',
              'prospective_live_latency_status':'COLLECTING',
              'authority':'SCHEDULER_TRANSPORT_PROVENANCE_ONLY_NO_TRADING_AUTHORITY'
          }
          (ROOT/'scheduler_state.json').write_text(json.dumps(heartbeat,ensure_ascii=False,indent=2),encoding='utf-8')

          req=urllib.request.Request(ENDPOINT,headers={
              'Accept':'text/csv,text/plain,*/*',
              'User-Agent':'HENGCE-PROSPECTIVE-TDCC-CARRIER/1.0'
          })
          body=None
          status=None
          headers={}
          error=None
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read()
                  received=now_tw()
                  status=getattr(r,'status',None)
                  headers={
                      'date':r.headers.get('Date'),
                      'last_modified':r.headers.get('Last-Modified'),
                      'etag':r.headers.get('ETag')
                  }
          except Exception as e:
              received=now_tw()
              error=repr(e)

          stamp=received.strftime('%Y%m%dT%H%M%S%f%z')
          attempt_dir=ATTEMPTS/received.strftime('%Y')/received.strftime('%m')/received.strftime('%d')
          attempt_dir.mkdir(parents=True,exist_ok=True)
          attempt_id=f'TDCC_{stamp}_RUN{run_id or "LOCAL"}_A{run_attempt or "0"}'

          common={
              'schema_version':3,
              'attempt_id':attempt_id,
              'endpoint':ENDPOINT,
              'request_started_at_taipei':started.isoformat(),
              'response_received_at_taipei':received.isoformat(),
              'github_event_name':event_name,
              'github_run_id':run_id,
              'github_run_attempt':run_attempt,
              'github_workflow':workflow,
              'github_workflow_ref':workflow_ref,
              'github_ref_at_trigger':ref_at_trigger,
              'github_sha_at_trigger':sha_at_trigger,
              'native_schedule_carrier':'.github/workflows/hengce-tdcc-ownership-daily.yml',
              'native_schedule_expression':'7,17,27,37,47,57 * * * *',
              'schedule_proof':event_name=='schedule',
              'official_published_at':None,
              'historical_latency_status':'DATA_BLOCKED',
              'prospective_live_latency_status':'COLLECTING',
              'authority':'SHADOW_PROSPECTIVE_AVAILABILITY_RESEARCH_ONLY_NO_TRADING_AUTHORITY'
          }

          if body is None:
              attempt={**common,'http_status':status,'http_error':error,'payload_sha256':None,
                       'snapshot_reference_date':None,'reference_date_candidates':[],
                       'new_payload_first_observed':False}
              (attempt_dir/f'{attempt_id}.json').write_text(json.dumps(attempt,ensure_ascii=False,indent=2),encoding='utf-8')
              heartbeat.update({'collector_status':'POLL_FAILED','http_error':error,
                                'last_poll_received_at_taipei':received.isoformat()})
              (ROOT/'scheduler_state.json').write_text(json.dumps(heartbeat,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit(f'TDCC_POLL_FAILED:{error}')

          payload_sha=hashlib.sha256(body).hexdigest()
          decoded=None
          decoded_encoding=None
          for enc in ('utf-8-sig','utf-8','cp950','big5'):
              try:
                  decoded=body.decode(enc)
                  decoded_encoding=enc
                  break
              except UnicodeDecodeError:
                  pass

          reference_dates=[]
          header=[]
          if decoded is not None:
              try:
                  rows=list(csv.reader(io.StringIO(decoded)))
                  if rows:
                      header=[str(x).strip() for x in rows[0]]
                      date_idx=None
                      for i,h in enumerate(header):
                          hh=re.sub(r'\s+','',h)
                          if hh in ('資料日期','日期','資料年月日') or '資料日期' in hh:
                              date_idx=i
                              break
                      vals=[]
                      for row in rows[1:]:
                          if not row:
                              continue
                          if date_idx is not None and date_idx<len(row):
                              vals.append(row[date_idx])
                          elif row:
                              vals.append(row[0])
                      reference_dates=sorted({d for d in (norm_date(v) for v in vals) if d})
              except Exception:
                  reference_dates=[]

          snapshot_reference_date=reference_dates[0] if len(reference_dates)==1 else None
          first_meta=FIRST/f'{payload_sha}.json'
          raw_path=PAYLOADS/f'{payload_sha}.csv'
          is_new=not first_meta.exists()
          if is_new:
              raw_path.write_bytes(body)
              first_observed={
                  **common,
                  'payload_sha256':payload_sha,
                  'first_observed_at_taipei':received.isoformat(),
                  'first_observed_at_utc':received.astimezone(timezone.utc).isoformat(),
                  'snapshot_reference_date':snapshot_reference_date,
                  'reference_date_candidates':reference_dates,
                  'decoded_encoding':decoded_encoding,
                  'csv_header':header,
                  'http_status':status,
                  'http_date':headers.get('date'),
                  'http_last_modified':headers.get('last_modified'),
                  'http_etag':headers.get('etag'),
                  'publication_provenance_status':'OFFICIAL_PUBLICATION_TIMESTAMP_NOT_INDEPENDENTLY_PROVEN',
                  'availability_semantics':'HENGCE_FIRST_OBSERVED_PUBLIC_ENDPOINT_RECEIPT_NOT_OFFICIAL_PUBLISHED_AT'
              }
              first_meta.write_text(json.dumps(first_observed,ensure_ascii=False,indent=2),encoding='utf-8')

          attempt={
              **common,
              'http_status':status,
              'http_error':None,
              'http_date':headers.get('date'),
              'http_last_modified':headers.get('last_modified'),
              'http_etag':headers.get('etag'),
              'payload_sha256':payload_sha,
              'snapshot_reference_date':snapshot_reference_date,
              'reference_date_candidates':reference_dates,
              'new_payload_first_observed':is_new,
              'first_observed_record':str(first_meta)
          }
          (attempt_dir/f'{attempt_id}.json').write_text(json.dumps(attempt,ensure_ascii=False,indent=2),encoding='utf-8')

          current={
              'schema_version':3,
              'endpoint':ENDPOINT,
              'last_poll_received_at_taipei':received.isoformat(),
              'payload_sha256':payload_sha,
              'snapshot_reference_date':snapshot_reference_date,
              'reference_date_candidates':reference_dates,
              'first_observed_record':str(first_meta),
              'github_event_name':event_name,
              'github_run_id':run_id,
              'github_workflow':workflow,
              'native_schedule_carrier':'.github/workflows/hengce-tdcc-ownership-daily.yml',
              'schedule_proof':event_name=='schedule',
              'official_published_at':None,
              'publication_provenance_status':'OFFICIAL_PUBLICATION_TIMESTAMP_NOT_INDEPENDENTLY_PROVEN',
              'historical_latency_status':'DATA_BLOCKED',
              'prospective_live_latency_status':'COLLECTING'
          }
          (ROOT/'current.json').write_text(json.dumps(current,ensure_ascii=False,indent=2),encoding='utf-8')

          heartbeat.update({
              'collector_status':'POLL_SUCCEEDED',
              'last_poll_received_at_taipei':received.isoformat(),
              'http_status':status,
              'payload_sha256':payload_sha,
              'snapshot_reference_date':snapshot_reference_date,
              'new_payload_first_observed':is_new
          })
          (ROOT/'scheduler_state.json').write_text(json.dumps(heartbeat,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TDCC_NATIVE_SCHEDULE_CARRIER_OK',payload_sha,snapshot_reference_date,is_new,event_name,run_id)
          PY

      - name: Validate immutable prospective evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('research/loss_forensics/prospective_live/tdcc')
          state=json.loads((root/'scheduler_state.json').read_text(encoding='utf-8'))
          if state.get('github_event_name')!='schedule' or state.get('schedule_proof') is not True:
              raise SystemExit('NATIVE_SCHEDULE_PROOF_MISSING')
          if state.get('collector_status')!='POLL_SUCCEEDED':
              raise SystemExit('TDCC_COLLECTOR_NOT_SUCCEEDED')
          current=json.loads((root/'current.json').read_text(encoding='utf-8'))
          sha=current['payload_sha256']
          raw=root/'payloads'/f'{sha}.csv'
          meta=root/'first_observed'/f'{sha}.json'
          if not raw.exists() or not meta.exists():
              raise SystemExit('IMMUTABLE_EVIDENCE_MISSING')
          if hashlib.sha256(raw.read_bytes()).hexdigest()!=sha:
              raise SystemExit('TDCC_RAW_HASH_MISMATCH')
          m=json.loads(meta.read_text(encoding='utf-8'))
          if m.get('official_published_at') is not None:
              raise SystemExit('OFFICIAL_PUBLICATION_MUST_REMAIN_NULL_WITHOUT_INDEPENDENT_PROOF')
          print('TDCC_NATIVE_SCHEDULE_EVIDENCE_VALID',state.get('github_run_id'),sha)
          PY

      - name: Commit native schedule proof and TDCC provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-prospective-live-bot'
          git config user.email 'hengce-prospective-live-bot@users.noreply.github.com'
          git add research/loss_forensics/prospective_live/tdcc/
          if git diff --cached --quiet; then
            echo 'No TDCC prospective provenance changes.'
            exit 0
          fi
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git commit -m "HENGCE native scheduled TDCC prospective provenance ${TS}"
          git pull --rebase origin research/loss-forensics-20261101
          git push origin HEAD:research/loss-forensics-20261101
