name: HENGCE E2 Profit Max PIT Membership V2

on:
  push:
    branches: [main]
    paths:
      - 'research/e2_profit_max/acquire_pit_electronics_membership_v2.py'
      - '.github/workflows/hengce-e2-profit-max-membership-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-year:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch official PIT electronics membership
        run: python research/e2_profit_max/acquire_pit_electronics_membership_v2.py --year ${{ matrix.year }} --out research/e2_profit_max/membership_parts/${{ matrix.year }} --sleep 1.1 --retries 8
      - name: Upload yearly PIT part
        uses: actions/upload-artifact@v4
        with:
          name: e2-pit-membership-${{ matrix.year }}
          path: research/e2_profit_max/membership_parts/${{ matrix.year }}/
          if-no-files-found: error
      - name: Enforce yearly hard gate
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          y=os.environ['YEAR']
          p=pathlib.Path('research/e2_profit_max/membership_parts')/y/f'membership_receipt_{y}.json'
          r=json.loads(p.read_text())
          assert r['hard_gate']=='PASS',r
          assert r['review_days']==0 and r['error_days']==0,r
          assert r['pass_days']>=230,r
          print('PASS_YEAR',y,r['pass_days'],r['rows'])
          PY
        env:
          YEAR: ${{ matrix.year }}

  merge:
    needs: fetch-year
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: e2-pit-membership-*
          path: research/e2_profit_max/membership_parts_download
          merge-multiple: true
      - name: Merge and validate PIT archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json,pathlib,shutil
          src=pathlib.Path('research/e2_profit_max/membership_parts_download')
          out=pathlib.Path('research/e2_profit_max/membership');out.mkdir(parents=True,exist_ok=True)
          years=[2023,2024,2025]; recs={}; files={}; total_pass=total_rows=0
          def sha(p):
              h=hashlib.sha256();h.update(p.read_bytes());return h.hexdigest()
          for y in years:
              rp=src/f'membership_receipt_{y}.json'; cp=src/f'twse_electronics_membership_{y}.csv'; qp=src/f'membership_qa_{y}.csv'
              assert rp.exists() and cp.exists() and qp.exists(),(y,list(src.iterdir()))
              r=json.loads(rp.read_text()); recs[str(y)]=r
              assert r['hard_gate']=='PASS' and r['review_days']==0 and r['error_days']==0 and r['pass_days']>=230,r
              shutil.copy2(cp,out/cp.name); shutil.copy2(qp,out/qp.name); shutil.copy2(rp,out/rp.name)
              total_pass+=r['pass_days'];total_rows+=r['rows']; files[str(y)]={'path':str(out/cp.name),'rows':r['rows'],'dates':r['dates'],'sha256':sha(out/cp.name)}
          receipt={'system':'HENGCE','engine':'E2_PROFIT_MAX','artifact':'PIT_TWSE_ELECTRONICS_MEMBERSHIP_2023_2025_V2','status':'PASS','hard_gate':'PASS','source':'TWSE MI_INDEX type=13 official daily electronics table','policy':'POINT_IN_TIME_OBSERVED_ON_DATE_NO_CURRENT_CONSTITUENT_BACKFILL','years':years,'pass_days':total_pass,'rows':total_rows,'files':files,'year_receipts':recs,'candidate_formula_mutated':False,'purpose':'FINAL_VALIDATION_OF_FROZEN_E2_PROFIT_MAX_CANDIDATE_B'}
          (out/'membership_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e2-profit-max-pit-electronics-membership-v2
          path: research/e2_profit_max/membership/
          if-no-files-found: error
      - name: Commit final PIT membership archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hengce-e2-research-bot
          git config user.email hengce-e2-research-bot@users.noreply.github.com
          git add research/e2_profit_max/membership/
          git commit -m 'HENGCE E2 PIT electronics membership 2023-2025 PASS' || exit 0
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
