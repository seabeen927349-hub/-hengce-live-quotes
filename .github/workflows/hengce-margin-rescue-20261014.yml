name: HENGCE margin rescue 20261014

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-margin-rescue-20261014.yml'

permissions:
  contents: write

jobs:
  fetch-margin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch official TWSE MI_MARGN and normalize
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, json, re, urllib.request
          from pathlib import Path
          DATE='20261014'; ISO='2026-10-14'; OUT=Path('eod')/DATE; OUT.mkdir(parents=True,exist_ok=True)
          URL=f'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={DATE}&selectType=ALL&response=json'
          req=urllib.request.Request(URL,headers={'User-Agent':'Mozilla/5.0 HENGCE-MARGIN-RESCUE/1.0','Accept':'application/json','Referer':'https://www.twse.com.tw/'})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.load(r)
          if str(obj.get('stat'))!='OK' or str(obj.get('date'))!=DATE:
              raise SystemExit(f'MARGIN_NOT_READY stat={obj.get("stat")} date={obj.get("date")}')
          def clean(x): return '' if x is None else str(x).replace(',','').strip()
          candidates=[]
          if isinstance(obj.get('tables'),list): candidates += obj['tables']
          if isinstance(obj.get('fields'),list) and isinstance(obj.get('data'),list): candidates += [{'fields':obj['fields'],'data':obj['data']}]
          for k,v in obj.items():
              m=re.fullmatch(r'fields(\d+)',str(k))
              if m and isinstance(v,list) and isinstance(obj.get('data'+m.group(1)),list): candidates += [{'fields':v,'data':obj['data'+m.group(1)]}]
          table=None
          for t in candidates:
              fs=[clean(x).replace(' ','') for x in (t.get('fields') or [])]
              data=t.get('data') or t.get('records') or []
              if len(fs)>=15 and len(data)>=500 and any('現金償還' in x for x in fs) and any('現券償還' in x for x in fs) and sum('今日餘額' in x for x in fs)>=2:
                  table=(t.get('fields') or [],data); break
          if table is None: raise SystemExit('MARGIN_TABLE_NOT_FOUND')
          fields,data=table
          cols=['Date','Ticker','Name','MarginBuy','MarginSell','MarginCashRepayment','MarginPreviousBalance','MarginBalance','MarginNextDayLimit','ShortBuy','ShortSell','ShortStockRepayment','ShortPreviousBalance','ShortBalance','ShortNextDayLimit','Offset','Note','Source']
          buckets={str(i):[] for i in range(1,10)}
          for r in data:
              if not isinstance(r,(list,tuple)) or len(r)<15: continue
              ticker=clean(r[0]).replace('=','').replace('"','')
              if not re.fullmatch(r'[1-9]\d{3}',ticker): continue
              buckets[ticker[0]].append({'Date':ISO,'Ticker':ticker,'Name':clean(r[1]),'MarginBuy':clean(r[2]),'MarginSell':clean(r[3]),'MarginCashRepayment':clean(r[4]),'MarginPreviousBalance':clean(r[5]),'MarginBalance':clean(r[6]),'MarginNextDayLimit':clean(r[7]),'ShortBuy':clean(r[8]),'ShortSell':clean(r[9]),'ShortStockRepayment':clean(r[10]),'ShortPreviousBalance':clean(r[11]),'ShortBalance':clean(r[12]),'ShortNextDayLimit':clean(r[13]),'Offset':clean(r[14]),'Note':clean(r[15]) if len(r)>15 else '','Source':URL})
          total=sum(map(len,buckets.values()))
          if total < 500: raise SystemExit(f'MARGIN_ROWS_TOO_SMALL:{total}')
          for k,rs in buckets.items():
              if rs:
                  with (OUT/f'margin_{k}.csv').open('w',encoding='utf-8-sig',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(rs)
          status_path=OUT/'status.json'; status={}
          if status_path.exists(): status=json.loads(status_path.read_text(encoding='utf-8'))
          status.update({'system':'HENGCE','artifact':'EOD_COMPLETE_LEG_INGEST','target_date':ISO,'margin_status':'COMPLETE','margin_date':ISO,'margin_rows':total,'margin_source':URL,'policy':'PER_LEG_INGEST_NO_GLOBAL_BLOCK'})
          status_path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
      - name: Commit recovered margin leg
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-eod-bot'
          git config user.email 'hengce-eod-bot@users.noreply.github.com'
          git add eod/20261014/
          if git diff --cached --quiet; then echo 'Margin artifacts already current.'; exit 0; fi
          git commit -m 'HENGCE EOD 2026-10-14 margin complete'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
