name: HENGCE Phase 1 Foundation Evidence

on:
  pull_request:
    paths:
      - 'research/phase1_audit/**'
      - '.github/workflows/hengce-phase1-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only pinned replay dependencies
        run: python -m pip install -r research/phase1_audit/requirements-replay.txt
      - name: Verify dependency closure
        run: python -m pip check
      - name: Reject production and out-of-scope changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -B research/phase1_audit/scope_guard.py --base "$BASE_SHA"
      - name: Verify frozen evidence inventory
        run: python -B research/phase1_audit/inventory.py --check
      - name: Synthetic governance and audit regressions
        run: python -B research/phase1_audit/test_foundation.py
