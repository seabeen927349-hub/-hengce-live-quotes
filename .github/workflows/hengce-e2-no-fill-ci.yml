name: HENGCE E2 No-Fill CI

on:
  pull_request:
    paths:
      - 'scripts/hengce_e2_live.py'
      - 'scripts/test_hengce_e2_no_fill.py'
      - 'hengce/e2_live/execution_override.json'
      - '.github/workflows/hengce-e2-no-fill-ci.yml'
      - '.github/workflows/hengce-e2-profit-max-live.yml'

permissions:
  contents: read

jobs:
  no-fill-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Compile E2 execution layer
        run: python -m py_compile scripts/hengce_e2_live.py scripts/test_hengce_e2_no_fill.py

      - name: Frozen E2 self-test
        run: python scripts/hengce_e2_live.py --mode self-test --date 2026-10-20

      - name: NO-FILL regression
        run: PYTHONPATH=scripts python scripts/test_hengce_e2_no_fill.py

      - name: Verify frozen model authorities untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          git diff --exit-code "$BASE"...HEAD -- \
            scripts/hengce_q017_observation_lock_v5.py \
            scripts/hengce_daily_command_center_core_legacy.py \
            research/e2_profit_max/E2_PROFIT_MAX_CANDIDATE_B_PIT_VALIDATION_LOCK_20261019.json
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/hengce_e2_live.py').read_text(encoding='utf-8')
          assert 'K = 25.0' in s
          assert 'LOCAL_M1_MAX = 0.0' in s
          assert 'LOCAL_M5_MAX = -0.02' in s
          assert 'SOX1_MAX = 0.0' in s
          assert 'SOX5_MAX = -0.03' in s
          assert 'HOLD_INTERVALS = 20' in s
          assert 'score = beta * (1.0 + K * max(-resid, 0.0))' in s
          print('PASS FROZEN_MODEL_FORMULA_UNCHANGED')
          PY
