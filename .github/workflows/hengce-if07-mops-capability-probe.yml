name: HENGCE IF07 MOPS Capability Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_xbrl_bulk_page_probe.py'
      - '.github/workflows/hengce-if07-mops-capability-probe.yml'

permissions:
  contents: read

concurrency:
  group: hengce-if07-mops-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests lxml beautifulsoup4

      - name: Probe official MOPS XBRL bulk page — no returns
        run: python research/selection_core_rebuild/if07_xbrl_bulk_page_probe.py

      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_XBRL_BULK_PAGE_PROBE.json

      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: if07-xbrl-bulk-page-probe
          path: research/selection_core_rebuild/generated/IF07_XBRL_BULK_PAGE_PROBE.json
          if-no-files-found: error
