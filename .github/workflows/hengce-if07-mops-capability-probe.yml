name: HENGCE IF07 MOPS Capability Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_mops_actions_probe.py'
      - 'research/selection_core_rebuild/if07_mops_actions_probe_v0_2.py'
      - '.github/workflows/hengce-if07-mops-capability-probe.yml'

permissions:
  contents: write

concurrency:
  group: hengce-if07-mops-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests pandas lxml beautifulsoup4

      - name: Run MOPS capability probe V0.2 — no returns
        run: python research/selection_core_rebuild/if07_mops_actions_probe_v0_2.py

      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_MOPS_ACTIONS_PROBE_V0_2.json

      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: if07-mops-actions-probe-v0-2
          path: research/selection_core_rebuild/generated/IF07_MOPS_ACTIONS_PROBE_V0_2.json
          if-no-files-found: error

      - name: Persist receipt to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengce-if07-research-bot'
          git config user.email 'hengce-if07-research-bot@users.noreply.github.com'
          git add research/selection_core_rebuild/generated/IF07_MOPS_ACTIONS_PROBE_V0_2.json
          if git diff --cached --quiet; then
            echo 'No receipt change.'
            exit 0
          fi
          git commit -m 'research: persist IF-07 MOPS capability receipt v0.2'
          git push origin HEAD:research/selection-core-rebuild-20261031
