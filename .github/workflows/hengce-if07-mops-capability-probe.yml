name: HENGCE IF07 MOPS Capability Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - 'research/selection_core_rebuild/if07_bulk_zip_probe.py'
      - '.github/workflows/hengce-if07-mops-capability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and inspect official 2023Q1 bulk XBRL ZIP — no returns
        run: python research/selection_core_rebuild/if07_bulk_zip_probe.py
      - name: Show receipt
        run: cat research/selection_core_rebuild/generated/IF07_BULK_ZIP_PROBE_2023Q1.json
      - uses: actions/upload-artifact@v4
        with:
          name: if07-bulk-zip-probe-2023q1
          path: research/selection_core_rebuild/generated/IF07_BULK_ZIP_PROBE_2023Q1.json
          if-no-files-found: error
