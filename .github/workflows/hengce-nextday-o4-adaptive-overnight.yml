name: HENGCE Nextday O4 Adaptive Overnight
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/nextday_o4_adaptive_overnight.py'
      - '.github/workflows/hengce-nextday-o4-adaptive-overnight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run O4 mature-only adaptive overnight
        run: PYTHONPATH=. python research/codex_full_reset_20261023/nextday_o4_adaptive_overnight.py
      - name: Print result
        if: always()
        run: test -f research/codex_full_reset_20261023/nextday_o4_adaptive_overnight_result.json && cat research/codex_full_reset_20261023/nextday_o4_adaptive_overnight_result.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-nextday-o4-adaptive-overnight
          path: |
            research/codex_full_reset_20261023/nextday_o4_adaptive_overnight_result.json
            research/codex_full_reset_20261023/nextday_o4_adaptive_overnight_events.jsonl
          if-no-files-found: ignore
