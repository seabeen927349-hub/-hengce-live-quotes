name: HENGCE Five-Pass Morning Dry-Run Temp

on:
  push:
    branches:
      - chatgpt/hengce-five-pass-morning-dryrun-20261020
    paths:
      - .github/workflows/hengce-five-pass-morning-dryrun-temp.yml

permissions:
  contents: read

jobs:
  five-pass-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install production runtime dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Five complete clean-state morning dry-runs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts"
          for ROUND in 1 2 3 4 5; do
            echo "================ ROUND ${ROUND}/5 START ================"

            # Every round must start from the exact checked-out state, with no prior-round residue.
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
            test -z "$(git status --porcelain)"

            echo "[${ROUND}] strict original-vessel + mother receipt preflight"
            python - <<'PY'
          import json
          from pathlib import Path
          import hengce_eod_incremental_ingest as eod
          import hengce_daily_command_center_core_legacy as core

          iso='2026-10-20'
          out=Path('eod/20261020')
          st=json.loads((out/'status.json').read_text(encoding='utf-8'))
          mr=json.loads((out/'receipts'/'mother.json').read_text(encoding='utf-8'))

          assert core.TWSE_PRICE == 'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX'
          assert core.TWSE_INST == 'https://www.twse.com.tw/rwd/zh/fund/T86'
          assert core.TWSE_MARGIN == 'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN'
          assert st['target_date']==iso
          assert st['parallel_eod_tree'] is False
          assert st['second_mother'] is False
          assert st['model_authority_created'] is False
          assert st['mother_promotion_route']=='EXISTING_EOD_TO_CANONICAL_HISTORICAL_MOTHER_BRIDGE'
          assert st['mother_status']=='COMPLETE'
          assert st['downstream_ready'] is True
          assert mr['target_date']==iso and mr['status']=='PASS'
          assert mr['second_mother'] is False
          assert mr['model_or_schema_mutated'] is False
          assert mr['mother_latest_date']==iso
          assert mr['mother_sha256']==st['mother_sha256']

          available=[]
          for leg in eod.LEGS:
              if st.get(f'{leg}_status')=='COMPLETE':
                  info=eod._read(out,leg,iso)
                  assert info is not None
                  assert info['rows']==st[f'{leg}_rows']
                  assert info['sha256']==st[f'{leg}_sha256']
                  assert mr['promoted_leg_sha256'][leg]==info['sha256']
                  assert leg in mr['promoted_legs']
                  available.append(leg)
              elif st.get(f'{leg}_status')=='PENDING':
                  assert leg in mr.get('pending_legs',[])
              else:
                  raise AssertionError((leg, st.get(f'{leg}_status')))
          assert eod._mother_receipt(out,iso,st) is not None
          assert available==st['available_legs']
          print(json.dumps({'mother_preflight':'PASS','available_legs':available,'pending_legs':st['pending_legs'],'mother_sha256':mr['mother_sha256']},ensure_ascii=False))
          PY

            echo "[${ROUND}] frozen authority + model invariants"
            test "$(git rev-parse HEAD:scripts/hengce_q017_observation_lock_v5.py)" = c2b44d56844fd496445220e6c55b9a031c547c4e
            test "$(git rev-parse HEAD:scripts/hengce_daily_command_center_core_legacy.py)" = 1c6194da0325162c72b56368b2cf5972bc56cc0a
            python - <<'PY'
          from pathlib import Path
          s=Path('scripts/hengce_e2_live.py').read_text(encoding='utf-8')
          for needle in (
              'K = 25.0',
              'LOCAL_M1_MAX = 0.0',
              'LOCAL_M5_MAX = -0.02',
              'SOX1_MAX = 0.0',
              'SOX5_MAX = -0.03',
              'RESID_MAX = 0.04',
              'LIQ20_MIN = 20_000_000.0',
              'BETA_WINDOW = 60',
              'BETA_MIN = 30',
              'HOLD_INTERVALS = 20',
              'score = beta * (1.0 + K * max(-resid, 0.0))',
              'paper_net_return_after_0_8pct_cost',
          ):
              assert needle in s, needle
          print('PASS_FROZEN_MODEL_INVARIANTS')
          PY

            echo "[${ROUND}] core/Q017/E2 regressions"
            python scripts/hengce_daily_command_center.py --mode self-test
            python scripts/hengce_eod_incremental_ingest.py --mode self-test
            python scripts/test_hengce_eod_original_vessel_incremental.py
            python scripts/hengce_q017_observation_lock_v5.py --mode self-test
            python scripts/hengce_q017_premarket_snapshot_v1.py --mode self-test
            python scripts/hengce_q017_observer_supervisor_v2.py --mode self-test
            python scripts/hengce_q017_authority_guard_v5.py --mode self-test
            python scripts/hengce_e2_live.py --mode self-test --date 2026-10-21
            python scripts/test_hengce_e2_no_fill.py
            python scripts/test_hengce_e2_morning_release.py

            echo "[${ROUND}] actual 2026-10-21 premarket gate"
            python scripts/hengce_daily_command_center.py --mode premarket --date 2026-10-21 > "/tmp/premarket-${ROUND}.json"
            python - <<'PY'
          import json
          x=json.load(open('hengce/q017_radar/data_status.json'))
          assert x['module']=='DAILY_DATA_GATE'
          assert x['trade_date']=='2026-10-21'
          assert x['lane_status']['q017_inputs'] in {'PASS','DATA_PENDING'}
          # E2 archive is allowed to remain DATA_PENDING while a late margin leg is still officially pending.
          assert x['lane_status']['e2_eod_archive'] in {'PASS','ARCHIVE_GAP','DATA_PENDING'}
          assert x['required']['latest_eod_date']=='20261020'
          print('PASS_ACTUAL_PREMARKET_GATE', json.dumps(x['lane_status'],ensure_ascii=False))
          PY

            echo "[${ROUND}] actual 2026-10-21 E2 morning bridge from real repo state"
            python scripts/hengce_e2_live.py --mode morning --date 2026-10-21 > "/tmp/e2-morning-${ROUND}.json"
            python - <<'PY'
          import json
          m=json.load(open('hengce/e2_live/morning_latest.json'))
          s=json.load(open('hengce/e2_live/state_latest.json'))
          assert m['trade_date']=='2026-10-21'
          assert m['source_signal_asof']=='2026-10-20'
          assert m['engine_status']=='OFF'
          assert m['paper_position']=={'state':'IDLE'}
          assert m['new_signal_buy_count']==0
          assert m['entry_due_count']==0
          assert m['entry_due']==[]
          assert m['held_from_prior_close']==[]
          assert m['no_fill_from_prior_signal']==[]
          assert m['execution_override']['reason']=='PRIOR_NO_FILL_SLOT_RELEASED'
          assert m['broker_order_execution'] is False
          assert s['paper_position']=={'state':'IDLE'}
          assert s['engine_status']=='OFF'
          assert s['action']=='OFF'
          assert s['position_state']['occupied_next_session']==0
          assert s['position_state']['free_slots_next_session']==1
          assert s['position_state']['held']==[]
          assert s['position_state']['pending']==[]
          assert s['position_state']['no_fill']==[]
          assert s['top1']['ticker']=='8021'
          assert s['broker_order_execution'] is False
          print('PASS_REAL_MORNING_BRIDGE', json.dumps({'engine_status':m['engine_status'],'paper_position':m['paper_position'],'free_slots_next_session':s['position_state']['free_slots_next_session'],'top1_preserved':s['top1']['ticker']},ensure_ascii=False))
          PY

            echo "[${ROUND}] no fake 09:01 authority + no broker execution"
            python - <<'PY'
          import json
          q=json.load(open('hengce/q017_radar/latest.json'))
          e=json.load(open('hengce/e2_live/state_latest.json'))
          assert e['broker_order_execution'] is False
          # Dry-run deliberately does not call Q017 observe/compute for 2026-10-21 before the real 09:01 timestamp.
          # Existing Q017 latest must not be rewritten as a fake 2026-10-21 formal decision.
          assert q.get('trade_date')!='2026-10-21' or q.get('authority')!='FORMAL_SIGNAL'
          print('PASS_NO_FAKE_0901_NO_BROKER_EXECUTION')
          PY

            echo "[${ROUND}] clean-state restoration + second invariant check"
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
            test -z "$(git status --porcelain)"
            python - <<'PY'
          import json
          s=json.load(open('hengce/e2_live/state_latest.json'))
          assert s['signal_asof']=='2026-10-20'
          assert s['engine_status']=='NO_FILL'
          assert s['paper_position']['state']=='NO_FILL'
          assert s['paper_position']['ticker']=='3026'
          assert s['position_state']['occupied_next_session']==0
          assert s['position_state']['free_slots_next_session']==1
          assert s['broker_order_execution'] is False
          print('PASS_RESTORED_BASELINE_NO_FILL')
          PY

            echo "================ ROUND ${ROUND}/5 PASS ================"
          done
          echo "FIVE_PASS_MORNING_DRYRUN=PASS"
