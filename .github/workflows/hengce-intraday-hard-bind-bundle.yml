name: HENGCE intraday hard-bind bundle

on:
  pull_request:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/RUN_HENGCE.sh'
      - 'scripts/RUN_HENGCE_COMPLETE.sh'
      - 'scripts/RUN_IN_WORK_DETACHED.sh'
      - 'scripts/CHECK_HENGCE_RUN.sh'
      - 'scripts/RUN_INTRADAY_ACTION_BOARD.sh'
      - 'scripts/hengce_intraday_action_board.py'
      - 'scripts/hengce_unified*.py'
      - 'scripts/hengce_scan_once_router.py'
      - 'hengce/HENGCE_INTRADAY_ACTION_BOARD_CONTRACT_v1_0_20261015.json'
      - 'patch/INSTALL_HENGCE_INTRADAY_HARD_BIND.sh'
      - '.github/workflows/hengce-intraday-hard-bind-bundle.yml'

permissions:
  contents: read

jobs:
  build-test-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle tree
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH"
          mkdir -p "$B/scripts" "$B/hengce" "$B/patch"
          cp scripts/RUN_HENGCE.sh "$B/scripts/"
          cp scripts/RUN_HENGCE_COMPLETE.sh "$B/scripts/"
          cp scripts/RUN_IN_WORK_DETACHED.sh "$B/scripts/"
          cp scripts/CHECK_HENGCE_RUN.sh "$B/scripts/"
          cp scripts/RUN_INTRADAY_ACTION_BOARD.sh "$B/scripts/"
          cp scripts/hengce_intraday_action_board.py "$B/scripts/"
          cp scripts/hengce_unified*.py "$B/scripts/"
          cp scripts/hengce_scan_once_router.py "$B/scripts/"
          cp hengce/HENGCE_INTRADAY_ACTION_BOARD_CONTRACT_v1_0_20261015.json "$B/hengce/"
          cp patch/INSTALL_HENGCE_INTRADAY_HARD_BIND.sh "$B/patch/"
          chmod +x "$B/scripts/"*.sh "$B/patch/"*.sh
          echo "BUNDLE=$B" >> "$GITHUB_ENV"

      - name: Install into isolated package fixture
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/fake-hengce"
          mkdir -p "$T/runtime/production_core" "$T/work_output/context"
          # Fake frozen model file proves installer preserves arbitrary joblib bytes/hashes.
          printf 'MODEL_BYTES_MUST_NOT_CHANGE' > "$T/runtime/production_core/fake.joblib"
          sha256sum "$T/runtime/production_core/fake.joblib" > "$RUNNER_TEMP/model.before"
          cat > "$T/RUN_IN_WORK.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          sleep 2
          mkdir -p work_output/formal/production
          cat > work_output/formal/production/v2_scan.json <<'JSON'
          {
            "formal_scan_allowed":true,
            "run_id":"INTEGRATION_FORMAL",
            "rows":[
              {"Ticker":"AAA","FormalEntryTrigger":true,"ActivationState":"READY","BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90},
              {"Ticker":"BBB","FormalEntryTrigger":false,"ActivationState":"EMPTY_SHADOW","BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90},
              {"Ticker":"CCC","FormalEntryTrigger":true,"ActivationState":"READY","PositionHeld":true,"BreakoutLower":100,"BreakoutUpper":105,"NoChase":110,"InvalidationPrice":90}
            ]
          }
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Taipei'))
          p=Path('work_output/formal/production/v2_scan.json')
          x=json.loads(p.read_text());x.update(trade_date=now.date().isoformat(),generated_at=now.isoformat());p.write_text(json.dumps(x))
          PY
          SH
          chmod +x "$T/RUN_IN_WORK.sh"
          printf '{"MarketContextState":"CAUTION","NewCapitalPolicy":"PROBE_ONLY"}\n' > "$T/work_output/context/HENGCE_MARKET_CONTEXT.json"
          python3 - "$T/work_output/context/HENGCE_MARKET_CONTEXT.json" <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Taipei'));p=Path(sys.argv[1])
          x=json.loads(p.read_text());x.update(trade_date=now.date().isoformat(),generated_at=now.isoformat());p.write_text(json.dumps(x))
          PY
          bash "$BUNDLE/patch/INSTALL_HENGCE_INTRADAY_HARD_BIND.sh" "$T"
          sha256sum "$T/runtime/production_core/fake.joblib" > "$RUNNER_TEMP/model.after"
          cmp "$RUNNER_TEMP/model.before" "$RUNNER_TEMP/model.after"
          python3 - "$T/work_output/HENGCE_INTRADAY_HARD_BIND_INSTALL_RECEIPT.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='PASS'
          assert x['production_model_mutated_by_patch'] is False
          assert x['entrypoint']=='RUN_HENGCE.sh'
          print('INSTALLER_PASS')
          PY

      - name: Create fresh local live fixture
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/fake-hengce"
          mkdir -p "$T/fixture"
          NOW="$(TZ=Asia/Taipei date --iso-8601=seconds)"
          DATE="$(TZ=Asia/Taipei date +%F)"
          cat > "$T/fixture/live.json" <<JSON
          {
            "snapshot_id":"BUNDLE_LIVE_TEST",
            "generated_at_taipei":"$NOW",
            "stale_count":0,
            "data":[
              {"symbol":"AAA","price":103,"high":104,"low":99,"avg_price":102,"quote_date":"$DATE"},
              {"symbol":"BBB","price":104,"high":104,"low":99,"avg_price":102,"quote_date":"$DATE"},
              {"symbol":"CCC","price":89,"high":101,"low":88,"avg_price":95,"quote_date":"$DATE"}
            ]
          }
          JSON

      - name: End-to-end detached formal-to-intraday run
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/fake-hengce"
          cd "$T"
          HENGCE_ROOT="$T" HENGCE_LIVE_JSON="$T/fixture/live.json" bash ./RUN_HENGCE.sh
          # RUN_HENGCE must detach promptly. Poll with short status checks only.
          for i in $(seq 1 30); do
            set +e
            HENGCE_ROOT="$T" bash ./CHECK_HENGCE_RUN.sh >/tmp/hengce-status.txt 2>&1
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then break; fi
            if [[ $rc -ne 10 ]]; then cat /tmp/hengce-status.txt; exit 1; fi
            sleep 1
          done
          HENGCE_ROOT="$T" bash ./CHECK_HENGCE_RUN.sh
          test -f work_output/intraday_action_board/HENGCE_INTRADAY_ACTION_BOARD.json
          test -f work_output/complete_run_state/HENGCE_COMPLETE_RUN_RECEIPT.json
          python3 - <<'PY'
          import json
          board=json.load(open('work_output/intraday_action_board/HENGCE_INTRADAY_ACTION_BOARD.json'))
          rec=json.load(open('work_output/complete_run_state/HENGCE_COMPLETE_RUN_RECEIPT.json'))
          assert board['ActionLayer']=='INTRADAY_ACTION_BOARD'
          assert board['binding_status']=='PASS'
          assert rec['state']=='PASS'
          m={r['Ticker']:r for r in board['rows']}
          assert m['AAA']['FinalAction']=='REVIEW_PROBE'
          assert m['BBB']['FormalEntryTrigger'] is False and m['BBB']['FinalAction']=='ABSTAIN'
          assert m['CCC']['FinalAction']=='EXIT_ALL'
          print('END_TO_END_HARD_BIND_PASS')
          PY

      - name: Create checksums and zip
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUNDLE"
          find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cd "$(dirname "$BUNDLE")"
          zip -qr HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH.zip "$(basename "$BUNDLE")"
          sha256sum HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH.zip > HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH.zip.sha256

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH
          path: |
            ${{ runner.temp }}/HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH.zip
            ${{ runner.temp }}/HENGCE_v9_3_46_INTRADAY_HARD_BIND_PATCH.zip.sha256
          if-no-files-found: error
          retention-days: 30
