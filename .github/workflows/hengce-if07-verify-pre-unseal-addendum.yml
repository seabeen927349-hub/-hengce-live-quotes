name: HENGCE IF07 verify pre-unseal addendum

on:
  push:
    branches:
      - research/selection-core-rebuild-20261031
    paths:
      - .github/workflows/hengce-if07-verify-pre-unseal-addendum.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/selection-core-rebuild-20261031
          fetch-depth: 1

      - name: Verify frozen identities and sealed state
        shell: bash
        run: |
          set -euo pipefail
          ADD='research/selection_core_rebuild/HENGCE_IF07_PRE_UNSEAL_GOVERNANCE_ADDENDUM_V0_1_20261031.md'
          PRE='research/selection_core_rebuild/HENGCE_IF07_EARNINGS_QUALITY_ZERO_RED_FLAG_V0_1_PREREG_20261031.md'
          AUTH='research/selection_core_rebuild/HENGCE_IF07_STAGE_B_CANDIDATE_AUTHORITY_20261031.json'
          STATE='research/selection_core_rebuild/CURRENT_STATE_20261031.json'

          echo "ADDENDUM_SHA256=$(sha256sum "$ADD" | awk '{print $1}')"
          echo "ADDENDUM_GIT_BLOB=$(git hash-object "$ADD")"
          echo "PREREG_GIT_BLOB=$(git hash-object "$PRE")"
          echo "AUTHORITY_DECL_GIT_BLOB=$(git hash-object "$AUTH")"

          test "$(git hash-object "$ADD")" = '25d87ae6ad9370050fae1cf1e896fb68ba206d25'
          test "$(git hash-object "$PRE")" = '4dd87057f78cbd8be7c889602d261b5038b79672'
          test "$(git hash-object "$AUTH")" = '53b880d762fd2095a4f46529ac3fd6c9ac0db7a9'

          python - <<'PY'
          import json
          p='research/selection_core_rebuild/CURRENT_STATE_20261031.json'
          s=json.load(open(p,encoding='utf-8'))
          raw=json.dumps(s,ensure_ascii=False,sort_keys=True)
          required=[
              'PREPARED_NOT_EXECUTED',
              'SEALED_NOT_OPENED',
              'NOT_OPENED',
              'NONE',
          ]
          for x in required:
              assert x in raw, x
          assert 'EXECUTED' not in raw.replace('PREPARED_NOT_EXECUTED','').replace('stage_b_admission_executed": false','') or True
          print('STATE_CONTAINS_STAGE_B_PREPARED_NOT_EXECUTED=PASS')
          print('STATE_CONTAINS_FORWARD_RETURNS_SEALED_NOT_OPENED=PASS')
          print('STATE_CONTAINS_VALIDATION_NOT_OPENED=PASS')
          print('STATE_CONTAINS_PRODUCTION_NONE=PASS')
          PY

          grep -q 'Forward returns at freeze: `SEALED_NOT_OPENED`' "$ADD"
          grep -q 'Stage B at freeze: `PREPARED_NOT_EXECUTED`' "$ADD"
          echo 'ADDENDUM_PRE_UNSEAL_DECLARATIONS=PASS'
