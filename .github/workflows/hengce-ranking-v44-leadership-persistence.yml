name: HENGCE Ranking V44 Leadership Persistence
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_v44_leadership_persistence.py'
      - '.github/workflows/hengce-ranking-v44-leadership-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V44 leadership persistence
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_v44_leadership_persistence.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_v44_leadership_persistence_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v44-leadership-persistence
          path: |
            research/codex_full_reset_20261023/ranking_v44_leadership_persistence_result.json
            research/codex_full_reset_20261023/ranking_v44_events.jsonl
