name: HENGCE Ranking X3 Factor Leave-One-Out
on:
  push:
    branches:
      - research/codex-full-reset-run-20261023
    paths:
      - 'research/codex_full_reset_20261023/ranking_x3_factor_leaveoneout.py'
      - '.github/workflows/hengce-ranking-x3-factor-leaveoneout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run X3 factor leave-one-out
        run: PYTHONPATH=. python research/codex_full_reset_20261023/ranking_x3_factor_leaveoneout.py
      - name: Print result
        run: cat research/codex_full_reset_20261023/ranking_x3_factor_leaveoneout_result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-x3-factor-leaveoneout
          path: |
            research/codex_full_reset_20261023/ranking_x3_factor_leaveoneout_result.json
            research/codex_full_reset_20261023/ranking_x3_events.jsonl
