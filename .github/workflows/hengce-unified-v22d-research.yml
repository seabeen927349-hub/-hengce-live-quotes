name: HENGCE Public Unified Report Pointer Safety
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/hengce_scan_once_router.py'
      - 'scripts/hengce_unified_scan_publisher.py'
      - 'tests/engineering/test_hengce_unified_scan_publisher.py'
      - '.github/workflows/hengce-unified-v22d-research.yml'
permissions:
  contents: read
jobs:
  original-research-report-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no second PUBLIC model scan is published
        run: |
          python -m unittest discover -s tests/engineering -p 'test_hengce_unified_scan_publisher.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/retail_top5/unified_scan/report_latest.json').read_text())
          assert r['status']=='PRIVATE_CANONICAL_REPORT_POINTER_ONLY'
          assert r.get('ranked')==[] and r.get('top5')==[]
          assert r['broker_execution'] is False
          print('ONE_PRIVATE_CANONICAL_REPORT_WITH_PUBLIC_POINTER')
          PY
