name: HENGCE research-only 2379 closing-price broker comparison
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-research-2379-close-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      FUGLE_MARKETDATA_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
    steps:
      - name: Verify trial auction and cross-market closing auction
        run: |
          python - <<'PY'
          import os,json,urllib.parse,urllib.request,datetime,collections,concurrent.futures,statistics,io,subprocess,sys
          day='2026-11-24'
          token=os.environ['FINMIND_TOKEN'].strip()
          def get(url,headers):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=90) as r: return r.read()
          fm={'Authorization':'Bearer '+token,'Accept':'application/json'}
          key=os.environ.get('FUGLE_API_KEY') or os.environ.get('FUGLE_MARKETDATA_API_KEY')
          try:
              if not key: raise RuntimeError('FUGLE_KEY_NOT_IN_ENV')
              x=json.loads(get('https://api.fugle.tw/marketdata/v1.0/stock/intraday/trades/2379?isTrial=true&limit=500&sort=desc',{'X-API-KEY':key}))
              assert x['date']==day and x['symbol']=='2379'
              rows=[]
              for v in x['data']:
                  t=datetime.datetime.fromtimestamp(v['time']/1e6,datetime.timezone(datetime.timedelta(hours=8))).strftime('%H:%M:%S.%f')
                  if '13:25'<=t<'13:30': rows.append([t,v.get('price'),v.get('size'),v.get('bid'),v.get('ask')])
              print('HENGCE_TRIAL '+json.dumps({'date':day,'all_rows':len(x['data']),'closing_trial':sorted(rows)}),flush=True)
          except Exception as e: print('HENGCE_TRIAL_ERROR '+type(e).__name__+':'+str(e)[:160],flush=True)
          def calc(t):
              t=sorted(t,key=lambda x:x['Time'])
              p=[x for x in t if x['Time']<'13:25']; c=[x for x in t if x['Time'].startswith(('13:30','13:33'))]
              if not p or not c:return None
              p0=float(p[-1]['deal_price']); p1=float(c[-1]['deal_price'])
              if p0<=0:return None
              v=sum(int(x['volume']) for x in c)
              return [p0,p1,v,round((p1/p0-1)*100,5),sum(int(x['volume']) for x in t if x['Time']<'13:34')]
          peers='2379 2454 3034 3227 3529 3592 4961 3661 3443 5274 6415 6531 3035 2401 2303 2330 3711 2308 2317 2383 2357 3044 3189 3324 3017 2059 3653 2360 2345 6669 2327 8046 6223 2449 3006 2408 2337 2344 3260 8299 6488 2376 2382 3231 2881 2882 2892 2884'.split()
          results={}
          scope='peer_sample'
          try:
              blob=get('https://api.finmindtrade.com/api/v4/storage_objects?dataset=TaiwanStockPriceTick&date='+day,{'Authorization':'Bearer '+token})
              if not blob.startswith(b'PAR1'): raise RuntimeError('NOT_PARQUET')
              subprocess.check_call([sys.executable,'-m','pip','-q','install','pyarrow'])
              import pyarrow.parquet as pq
              tab=pq.read_table(io.BytesIO(blob),columns=['stock_id','deal_price','volume','Time','date'])
              groups=collections.defaultdict(list)
              for v in tab.to_pylist():
                  k=str(v['stock_id'])
                  if len(k)==4 and k.isdigit() and int(k)>=1100 and str(v['date'])[:10]==day:
                      v['Time']=str(v['Time']); groups[k].append(v)
              for k,t in groups.items():
                  x=calc(t)
                  if x:results[k]=x
              scope='all_four_digit_equity_codes_in_bulk'
          except Exception as e: print('HENGCE_BULK_ERROR '+type(e).__name__+':'+str(e)[:160],flush=True)
          if not results:
              def one(k):
                  try:
                      x=json.loads(get('https://api.finmindtrade.com/api/v4/data?'+urllib.parse.urlencode({'dataset':'TaiwanStockPriceTick','data_id':k,'start_date':day}),fm))
                      assert str(x['status'])=='200' and x['data'] and all(str(y['date'])[:10]==day and str(y['stock_id'])==k for y in x['data'])
                      return k,calc(x['data'])
                  except Exception as e: return k,None
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  for k,v in pool.map(one,peers):
                      if v:results[k]=v
          r=sorted(results.items(),key=lambda x:-x[1][3]); v=[x[1][3] for x in r]
          print('HENGCE_MARKET_CLOSE '+json.dumps({'scope':scope,'count':len(r),'peer_expected':len(peers),'peer_missing':[k for k in peers if k not in results],'median':statistics.median(v) if v else None,'up':sum(x>0 for x in v),'down':sum(x<0 for x in v),'ge_1pct':sum(x>=1 for x in v),'ge_2pct':sum(x>=2 for x in v),'top':r[:25],'bottom':r[-10:],'peers':[[k,results[k]] for k in peers if k in results],'2379_rank':next((i+1 for i,x in enumerate(r) if x[0]=='2379'),None)}),flush=True)
          PY
