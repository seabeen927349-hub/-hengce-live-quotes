name: HENGCE research-only 2379 closing-price broker comparison
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengce-research-2379-close-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: Read-only FinMind tick and price-level broker research
        run: |
          python - <<'PY'
          import os,json,urllib.parse,urllib.request,collections,decimal
          D=decimal.Decimal
          token=os.environ['FINMIND_TOKEN'].strip()
          day='2026-11-24'; stock='2379'; close=D('694')
          def get(endpoint,params):
              req=urllib.request.Request('https://api.finmindtrade.com/api/v4/'+endpoint+'?'+urllib.parse.urlencode(params),headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'HENGCE-READONLY-RESEARCH'})
              with urllib.request.urlopen(req,timeout=60) as r: x=json.loads(r.read(30000000))
              if str(x.get('status'))!='200': raise RuntimeError(str(x.get('status'))+':'+str(x.get('msg'))[:200])
              return x['data']
          try:
              rows=get('data',{'dataset':'TaiwanStockPriceTick','data_id':stock,'start_date':day})
              assert rows and all(str(x['date'])[:10]==day and str(x['stock_id'])==stock for x in rows)
              ticks=sorted(rows,key=lambda x:x['Time'])
              at=[x for x in ticks if str(x['Time']).startswith('13:30')]
              earlier=[x for x in ticks if str(x['Time'])<'13:30' and D(str(x['deal_price']))==close]
              print('HENGCE_2379_TICK '+json.dumps({'rows':len(rows),'tail':ticks[-10:],'at_close':at,'earlier_same_price_volume':sum(int(x['volume']) for x in earlier),'earlier_same_price_count':len(earlier),'at_close_volume':sum(int(x['volume']) for x in at)},ensure_ascii=False),flush=True)
          except Exception as e: print('HENGCE_2379_TICK_ERROR '+str(e),flush=True)
          rows=get('taiwan_stock_trading_daily_report',{'data_id':stock,'date':day})
          assert rows and all(str(x['date'])[:10]==day and str(x['stock_id'])==stock for x in rows)
          d=collections.defaultdict(lambda:[0,0,0,0])
          for x in rows:
              v=d[(str(x['securities_trader_id']),str(x['securities_trader']))]; b=int(x['buy']); s=int(x['sell']); v[2]+=b; v[3]+=s
              if D(str(x['price']))==close: v[0]+=b;v[1]+=s
          rank=sorted([[k[0],k[1],*v] for k,v in d.items() if v[0] or v[1]],key=lambda x:-x[2])
          print('HENGCE_2379_CLOSE '+json.dumps({'price':str(close),'rows':len(rows),'branches':len(d),'buy_at_price':sum(x[2] for x in rank),'sell_at_price':sum(x[3] for x in rank),'buy_rank':rank[:35],'sell_rank':sorted(rank,key=lambda x:-x[3])[:15],'focus':[[k[0],k[1],*v] for k,v in d.items() if k[0] in ('9661','9A81')]},ensure_ascii=False),flush=True)
          import concurrent.futures
          dates='2026-09-01 2026-09-02 2026-09-03 2026-09-04 2026-09-07 2026-09-08 2026-09-09 2026-09-10 2026-09-11 2026-09-14 2026-09-15 2026-09-16 2026-09-17 2026-09-18 2026-09-21 2026-09-22 2026-09-23 2026-09-24 2026-09-29 2026-09-30 2026-10-01 2026-10-02 2026-10-05 2026-10-06 2026-10-07 2026-10-08 2026-10-12 2026-10-13 2026-10-14 2026-10-15 2026-10-16 2026-10-19 2026-10-20 2026-10-21 2026-10-22 2026-10-27 2026-10-28 2026-10-29 2026-10-30 2026-11-02 2026-11-03 2026-11-04 2026-11-05 2026-11-06 2026-11-09 2026-11-10 2026-11-11 2026-11-12 2026-11-13 2026-11-16 2026-11-17 2026-11-18 2026-11-19 2026-11-20 2026-11-23 2026-11-24'.split()
          focus={'1470','9268','9800','1590','9200','8440','6160','1560','9600','9136','1440','8880','1650','1480','9A81','9661'}
          def historical(day):
              o={'date':day}
              try:
                  t=get('data',{'dataset':'TaiwanStockPriceTick','data_id':stock,'start_date':day,'end_date':day})
                  assert t and all(str(x['date'])[:10]==day and str(x['stock_id'])==stock for x in t)
                  t.sort(key=lambda x:x['Time'])
                  prev=[x for x in t if x['Time']<'13:25']
                  close_t=[x for x in t if x['Time'].startswith('13:30')]
                  if prev and close_t:
                      p=float(prev[-1]['deal_price']); c=float(close_t[-1]['deal_price']); v=sum(int(x['volume']) for x in close_t)
                      o['tick']=[p,c,v,round((c/p-1)*100,4),sum(int(x['volume']) for x in t if x['Time']<'13:31'),sum(int(x['volume']) for x in t if x['Time']<'13:30' and float(x['deal_price'])==c)]
                  else: o['tick_error']='NO_AUCTION_OR_PREVIOUS'
              except Exception as e: o['tick_error']=str(e)[:150]
              try:
                  r=get('taiwan_stock_trading_daily_report',{'data_id':stock,'date':day})
                  assert r and all(str(x['date'])[:10]==day and str(x['stock_id'])==stock for x in r)
                  agg=collections.defaultdict(lambda:[0,0,0,0])
                  for x in r:
                      k=str(x['securities_trader_id']).upper()
                      if k not in focus: continue
                      b=int(x['buy']);s=int(x['sell']); a=agg[k];a[0]+=b;a[1]+=s
                      if 'tick' in o and float(x['price'])==o['tick'][1]: a[2]+=b;a[3]+=s
                  o['branch']=dict(agg)
              except Exception as e: o['branch_error']=str(e)[:150]
              return o
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for o in pool.map(historical,dates):
                  print('HENGCE_2379_HIST '+json.dumps(o,ensure_ascii=False),flush=True)
          PY
