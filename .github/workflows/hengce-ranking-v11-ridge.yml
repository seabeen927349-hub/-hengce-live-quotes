name: HENGCE Ranking V11 Ridge

on:
  push:
    branches: [research/codex-full-reset-run-20261023]
    paths:
      - 'research/codex_full_reset_20261023/ranking_v11_walkforward_ridge.py'
      - '.github/workflows/hengce-ranking-v11-ridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V11 prior-only ridge
        run: python -u research/codex_full_reset_20261023/ranking_v11_walkforward_ridge.py
      - name: Print result
        if: always()
        run: cat research/codex_full_reset_20261023/ranking_v11_walkforward_ridge_result.json 2>/dev/null || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v11-ridge
          path: |
            research/codex_full_reset_20261023/ranking_v11_walkforward_ridge_result.json
            research/codex_full_reset_20261023/ranking_v11_champion_events.jsonl
          if-no-files-found: warn
          retention-days: 30
