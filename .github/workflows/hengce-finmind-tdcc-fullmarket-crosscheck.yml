name: HENGCE TDCC FinMind Full-Market Official Crosscheck

"on":
  push:
    branches:
      - research/tdcc-finmind-historical-backfill-20261107
    paths:
      - .github/workflows/hengce-finmind-tdcc-fullmarket-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare FinMind vs 2025-11-07 official all stocks
        run: |
          python -m py_compile scripts/hengce_finmind_tdcc_fullmarket_crosscheck.py
          python scripts/hengce_finmind_tdcc_fullmarket_crosscheck.py
      - name: Retain research QA metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-finmind-tdcc-fullmarket-official-overlap-qa
          path: /tmp/hengce-finmind-fullmarket-official-qa/receipt.json
          retention-days: 1
          if-no-files-found: error
