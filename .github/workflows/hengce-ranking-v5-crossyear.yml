name: HENGCE Ranking V5 Cross-Year Search

on:
  push:
    branches: [research/codex-full-reset-run-20261023]
    paths:
      - 'research/codex_full_reset_20261023/ranking_v5_crossyear_search.py'
      - '.github/workflows/hengce-ranking-v5-crossyear.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V5 cross-year search
        run: python -u research/codex_full_reset_20261023/ranking_v5_crossyear_search.py
      - name: Print result
        if: always()
        run: cat research/codex_full_reset_20261023/ranking_v5_crossyear_result.json 2>/dev/null || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hengce-ranking-v5-crossyear
          path: |
            research/codex_full_reset_20261023/ranking_v5_crossyear_result.json
            research/codex_full_reset_20261023/ranking_v5_champion_events.jsonl
          if-no-files-found: warn
          retention-days: 30
